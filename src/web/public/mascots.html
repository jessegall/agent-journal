<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascot animations</title>
    <style>
        :root {
            --page: #f6f6f8;
            --panel: #ffffff;
            --text: #1d1d22;
            --muted: #6b6b76;
            --line: #dcdce2;
            --accent: #5b5bd6;
            --accent-text: #ffffff;
            --stage: #e9eaef;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #101013;
                --panel: #18181c;
                --text: #ececf1;
                --muted: #9a9aa6;
                --line: #2b2b33;
                --accent: #8a8aff;
                --accent-text: #101013;
                --stage: #202026;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--page);
            color: var(--text);
            font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 600;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .stage {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--stage);
        }

        .sprite {
            background-repeat: no-repeat;
        }

        .group {
            margin-bottom: 20px;
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            border-color: var(--accent);
        }

        button[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-text);
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
        }

        .status {
            margin-top: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <h1>Mascot animations</h1>
    <p>Each animation is rendered from the one rigged robot, so every voice moves the same way.</p>

    <div class="stage"><div class="sprite" id="sprite" role="img" aria-label="The mascot"></div></div>

    <div class="group">
        <h2>Voice</h2>
        <div class="choices" id="voices"></div>
    </div>

    <div class="group">
        <h2>Animation</h2>
        <div class="choices" id="clips"></div>
    </div>

    <label><input type="checkbox" id="repeat" checked> Repeat until another is chosen</label>
    <div class="status" id="status"></div>
</main>

<script>
    const SCALE = 1.6;
    const IDLE = "idle";

    const state = {manifest: null, voice: null, clip: IDLE, wanted: IDLE, frame: 0, since: 0};
    const sprite = document.getElementById("sprite");
    const repeat = document.getElementById("repeat");
    const status = document.getElementById("status");
    const sheets = new Map();

    const sheetUrl = (voice, clip) => `mascots/${voice}/${clip}.webp`;

    function preload(voice) {
        for (const clip of Object.keys(state.manifest.clips)) {
            const key = sheetUrl(voice, clip);
            if (sheets.has(key)) continue;
            const image = new Image();
            image.src = key;
            sheets.set(key, image);
        }
    }

    function show(frame) {
        const [width, height] = state.manifest.cell;
        const info = state.manifest.clips[state.clip];
        const columns = Math.min(state.manifest.columns, info.frames);
        const rows = Math.ceil(info.frames / columns);
        sprite.style.width = `${width * SCALE}px`;
        sprite.style.height = `${height * SCALE}px`;
        sprite.style.backgroundImage = `url(${sheetUrl(state.voice, state.clip)})`;
        sprite.style.backgroundSize = `${columns * width * SCALE}px ${rows * height * SCALE}px`;
        sprite.style.backgroundPosition = `${-(frame % columns) * width * SCALE}px ${-Math.floor(frame / columns) * height * SCALE}px`;
    }

    function choose(clip) {
        state.wanted = clip;
        start(clip);
        mark("clips", clip);
        status.textContent = clip === IDLE ? "Standing still and blinking." : `Playing ${clip}.`;
    }

    function start(clip) {
        state.clip = clip;
        state.frame = 0;
        state.since = performance.now();
        show(0);
    }

    function pick(voice) {
        state.voice = voice;
        preload(voice);
        mark("voices", voice);
        start(state.clip);
    }

    function mark(group, name) {
        for (const button of document.querySelectorAll(`#${group} button`)) {
            button.setAttribute("aria-pressed", String(button.dataset.name === name));
        }
    }

    function tick(now) {
        const info = state.manifest.clips[state.clip];
        const frame = Math.floor(((now - state.since) / 1000) * info.fps);
        if (frame >= info.frames) {
            if (state.clip === IDLE || (state.wanted !== IDLE && repeat.checked)) {
                state.since = now;
                state.frame = 0;
            } else {
                state.wanted = IDLE;
                mark("clips", IDLE);
                status.textContent = "Standing still and blinking.";
                start(IDLE);
            }
        } else if (frame !== state.frame) {
            state.frame = frame;
            show(frame);
        }
        requestAnimationFrame(tick);
    }

    function addChoices(group, names, onChoose) {
        const holder = document.getElementById(group);
        for (const name of names) {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.name = name;
            button.textContent = name[0].toUpperCase() + name.slice(1);
            button.addEventListener("click", () => onChoose(name));
            holder.append(button);
        }
    }

    async function main() {
        state.manifest = await (await fetch("mascots/manifest.json")).json();
        addChoices("voices", state.manifest.voices, pick);
        addChoices("clips", Object.keys(state.manifest.clips), choose);
        pick(state.manifest.voices.includes("butler") ? "butler" : state.manifest.voices[0]);
        choose(IDLE);
        requestAnimationFrame(tick);
    }

    main();
</script>
</body>
</html>
