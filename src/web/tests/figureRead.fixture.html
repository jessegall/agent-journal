<!doctype html>
<html><body>
<canvas id="figure" width="128" height="128"></canvas>
<script type="module">
import * as THREE from "three";
import {BOOK, CLIPS, Stage, figureOf} from "/src/figure/figure.js";
import {surfacesIntersect, trianglesOf} from "./figureReadGeometry.js";

const stage = new Stage();
const canvas = document.getElementById("figure");
const read = CLIPS.find((clip) => clip.name === "read");
const idle = CLIPS.find((clip) => clip.name === "idle");
const search = CLIPS.find((clip) => clip.name === "search");
const tolerance = 0.02;
const precision = 0.00001;
const bone = (figure, name) => figure.rig.bones.find((each) => each.name === name);
const position = (object) => object.getWorldPosition(new THREE.Vector3());
const gap = (a, b) => new THREE.Vector3(
    Math.max(a.min.x - b.max.x, b.min.x - a.max.x, 0),
    Math.max(a.min.y - b.max.y, b.min.y - a.max.y, 0),
    Math.max(a.min.z - b.max.z, b.min.z - a.max.z, 0)
).length();
const shown = (object) => object.visible && (!object.parent || shown(object.parent));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const boxOf = (mesh) => new THREE.Box3().setFromObject(mesh, true);

window.measureReading = async (voice) => {
    const manifest = await fetch("/voices/figures/figures.json").then((response) => response.json());
    const bytes = await fetch(`/voices/figures/${manifest[voice]}`).then((response) => response.arrayBuffer());
    const figure = await figureOf(bytes, voice, "/voices/figures/draco/");
    const originals = [];
    figure.scene.traverse((mesh) => { if (mesh.isSkinnedMesh && mesh.userData.hull) originals.push(mesh); });
    const body = originals.filter((mesh) => !/^(arm|forearm|hand)_/.test(mesh.userData.attachment || ""));
    const forearms = originals.filter((mesh) => /^forearm_/.test(mesh.userData.attachment || ""));
    const upperArms = originals.filter((mesh) => /^arm_/.test(mesh.userData.attachment || ""));
    const hands = Object.fromEntries(["l", "r"].map((side) => [side, originals.find((mesh) => mesh.name === `hand_shell_${side}`)]));
    const report = {voice, poses: 0, held: 0, maximumGripError: 0, minimumBookBodyGap: Infinity, maximumHandCoverGap: 0, narrowPhaseChecks: 0, intersections: 0};
    let scanning = null, turning = null;
    for (const posture of read.postures) {
        for (let frame = 0; frame < read.frames; frame++) {
            const label = `${voice}/${posture}/${frame}`;
            stage.draw(figure, read, frame, 0, canvas, {posture, stride: frame / read.fps});
            figure.scene.updateMatrixWorld(true);
            report.poses++;
            assert(!figure.glass.visible && !figure.laptop.visible, `${label}: conflicting prop`);
            assert(figure.inHand.every((mesh) => !mesh.visible), `${label}: occupied hand`);
            const protectedBoxes = body.filter(shown).map((mesh) => ({mesh, name: mesh.name, box: boxOf(mesh)}));
            const surfaces = new Map();
            const surface = (mesh) => {
                if (!surfaces.has(mesh)) {
                    mesh.skeleton?.update();
                    const positions = new Float64Array(mesh.geometry.attributes.position.count * 3);
                    const point = new THREE.Vector3();
                    for (let vertex = 0; vertex < positions.length / 3; vertex++) mesh.getVertexPosition(vertex, point).applyMatrix4(mesh.matrixWorld).toArray(positions, vertex * 3);
                    surfaces.set(mesh, trianglesOf(positions, mesh.geometry.index?.array));
                }
                return surfaces.get(mesh);
            };
            const clear = (mesh, part) => {
                if (!boxOf(mesh).intersectsBox(part.box)) return;
                report.narrowPhaseChecks++;
                const intersects = surfacesIntersect(surface(mesh), surface(part.mesh));
                if (intersects) report.intersections++;
                assert(!intersects, `${label}: ${mesh.name} intersects ${part.name}`);
            };
            for (const arm of forearms.filter(shown)) for (const part of protectedBoxes) clear(arm, part);
            for (const arm of upperArms.filter(shown)) for (const part of protectedBoxes.filter((part) => part.mesh.userData.attachment === "head_root")) clear(arm, part);
            if (!figure.book.visible) continue;
            report.held++;
            for (const side of ["l", "r"]) {
                const error = position(bone(figure, `hand_${side}`)).distanceTo(position(figure.book.userData.grips[side]));
                report.maximumGripError = Math.max(report.maximumGripError, error);
                assert(error < precision, `${label}: ${side} grip error ${error}`);
                const hand = boxOf(hands[side]);
                const distance = gap(hand, boxOf(figure.book.userData.covers[side]));
                report.maximumHandCoverGap = Math.max(report.maximumHandCoverGap, distance);
                assert(distance < tolerance, `${label}: ${side} hand misses its cover by ${distance}`);
                for (const part of protectedBoxes) clear(hands[side], part);
            }
            figure.book.traverse((mesh) => {
                if (!mesh.isMesh || !shown(mesh)) return;
                const box = boxOf(mesh);
                for (const part of protectedBoxes) {
                    report.minimumBookBodyGap = Math.min(report.minimumBookBodyGap, gap(box, part.box));
                    clear(mesh, part);
                }
            });
            if (frame === read.intro) scanning = bone(figure, "head").matrixWorld.clone();
            if (frame === read.intro + 2) assert(!scanning.equals(bone(figure, "head").matrixWorld), `${label}: head does not scan`);
            if (frame === read.intro + read.leaves / 2) turning = figure.book.userData.leaf.matrixWorld.clone();
            if (frame === read.intro + read.leaves / 2 + 4) assert(!turning.equals(figure.book.userData.leaf.matrixWorld), `${label}: page does not turn`);
            if (frame >= read.intro && frame < read.frames - read.outro) {
                const angle = 180 - THREE.MathUtils.radToDeg(Math.abs(figure.book.userData.hinges.l.rotation.y - figure.book.userData.hinges.r.rotation.y));
                assert(Math.abs(angle - BOOK.open) < precision, `${label}: covers not fully open`);
            }
        }
    }
    stage.draw(figure, idle, 0, 0, canvas);
    assert(!figure.book.visible, `${voice}: book left visible after reading`);
    assert(figure.inHand.every((mesh) => mesh.visible), `${voice}: carried items not restored`);
    stage.draw(figure, search, 0, 0, canvas);
    assert(figure.glass.visible && !figure.book.visible, `${voice}: searching lost its glass`);
    figure.scene.traverse((node) => {
        node.geometry?.dispose();
        if (Array.isArray(node.material)) node.material.forEach((material) => material.dispose());
        else node.material?.dispose();
    });
    return report;
};
document.title = "ready";
</script>
</body></html>
