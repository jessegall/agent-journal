<!doctype html>
<html><body>
<canvas id="figure" width="128" height="128"></canvas>
<script type="module">
import * as THREE from "three";
import {CLIPS, Stage, figureOf, WRITING, TOOLS} from "/src/figure/figure.js";
import {surfaceIntersection, surfaceTree, trianglesOf} from "./figureReadGeometry.js";
import {collisionParts, sweepCases, shown} from "./figureCollisionScope.js";

import {jointAngles} from "/src/figure/blend.js";

const stage = new Stage();
const canvas = document.getElementById("figure");
const point = new THREE.Vector3();
const topology = new WeakMap();
const loaded = new Map();

async function figureFor(voice) {
    if (!loaded.has(voice)) {
        const manifest = await fetch("/voices/figures/figures.json").then((response) => response.json());
        const response = await fetch(`/voices/figures/${manifest[voice]}`);
        if (!response.ok) throw new Error(`Unable to load ${voice}: ${response.status}`);
        loaded.set(voice, await figureOf(await response.arrayBuffer(), voice, "/voices/figures/draco/"));
    }
    return loaded.get(voice);
}

function geometryAt(mesh) {
    const positions = new Float64Array(mesh.geometry.attributes.position.count * 3);
    const bounds = new THREE.Box3();
    mesh.skeleton?.update();
    for (let vertex = 0; vertex < positions.length / 3; vertex++) {
        mesh.getVertexPosition(vertex, point).applyMatrix4(mesh.matrixWorld).toArray(positions, vertex * 3);
        bounds.expandByPoint(point);
    }
    return {positions, bounds, surface: null};
}

function surfaceOf(mesh, geometry) {
    if (!geometry.surface) {
        geometry.surface = surfaceTree(trianglesOf(geometry.positions, mesh.geometry.index?.array), topology.get(mesh));
        topology.set(mesh, geometry.surface);
    }
    return geometry.surface;
}

window.collisionCases = (voice) => sweepCases(CLIPS, voice);
window.measureCollisionBatch = async (voice, cases) => {
    const figure = await figureFor(voice);
    const report = {voice, poses: 0, expected: cases.length, narrowPhaseChecks: 0, intersections: [], errors: []};
    for (const sample of cases) {
        try {
            const clip = CLIPS.find((each) => each.name === sample.clip);
            stage.draw(figure, clip, sample.frame, sample.facing, canvas, {posture: sample.posture, stride: sample.frame / clip.fps});
            figure.scene.updateMatrixWorld(true);
            const parts = collisionParts(figure);
            const geometries = new Map([...parts.moving, ...parts.protectedParts].map((mesh) => [mesh, geometryAt(mesh)]));
            for (const moving of parts.moving) {
                for (const protectedPart of parts.protectedParts) {
                    if (moving === protectedPart) continue;
                    const first = geometries.get(moving), second = geometries.get(protectedPart);
                    if (!first.bounds.intersectsBox(second.bounds)) continue;
                    report.narrowPhaseChecks++;
                    const contact = surfaceIntersection(surfaceOf(moving, first), surfaceOf(protectedPart, second));
                    if (contact) report.intersections.push({voice, ...sample, first: moving.name || moving.geometry.type, second: protectedPart.name, firstAttachment: moving.userData.attachment || "prop", secondAttachment: protectedPart.userData.attachment, triangles: contact});
                }
            }
            report.poses++;
        } catch (error) {
            report.errors.push({voice, ...sample, error: error.message});
        }
    }
    return report;
};
window.releaseCollisionFigure = (voice) => {
    const figure = loaded.get(voice);
    if (!figure) return;
    const geometries = new Set(), materials = new Set();
    figure.scene.traverse((mesh) => {
        if (mesh.geometry) geometries.add(mesh.geometry);
        for (const material of Array.isArray(mesh.material) ? mesh.material : [mesh.material]) if (material) materials.add(material);
    });
    for (const geometry of geometries) geometry.dispose();
    for (const material of materials) material.dispose();
    loaded.delete(voice);
};
window.measureRoundThree = async (voice) => {
    const figure = await figureFor(voice);
    const names = new Set(["read", "waiting", "write", "compacting", "yawn", "whistle", "sip", "headphones", "shield_polish", "bow", "salute", "startled", "stumble", "glance"]);
    const report = {voice, poses: 0, errors: [], gazeRays: 0, gazeMisses: [], nibs: 0, maximumNibError: 0, nativePropConflicts: [], blendFrames: 0, maximumJointDegrees: 0};
    const toGLB = new THREE.Matrix4().makeRotationX(-Math.PI / 2);
    const head = figure.rig.bones.find((bone) => bone.name === "head");
    for (const sample of sweepCases(CLIPS.filter((clip) => names.has(clip.name)), voice)) {
        try {
            const clip = CLIPS.find((each) => each.name === sample.clip);
            stage.draw(figure, clip, sample.frame, sample.facing, canvas, {posture: sample.posture, stride: sample.frame / clip.fps, eyes: sample.clip === "read" ? {mood: "amused", seconds: 1, lasts: 3} : null});
            figure.scene.updateMatrixWorld(true);
            report.poses++;
            if (sample.clip === "read" && sample.frame >= clip.intro && sample.frame < clip.frames - clip.outro) {
                const delta = head.matrixWorld.clone().multiply(figure.rig.rest.get("head").clone().invert());
                for (const eye of figure.rig.eyes) {
                    const origin = eye.clone().applyMatrix4(toGLB).applyMatrix4(delta);
                    const direction = new THREE.Vector3(0, 0, 1).transformDirection(delta);
                    const ray = new THREE.Raycaster(origin, direction);
                    report.gazeRays++;
                    if (!ray.intersectObjects(Object.values(figure.book.userData.pages)).length) report.gazeMisses.push(sample);
                }
            }
            const tool = Object.entries(WRITING).find(([name]) => name === voice)?.[1];
            const pen = figure.propByName.get(tool);
            if (sample.clip === "write" && pen?.visible) {
                const pad = figure.propByName.get(voice === "butler" ? "writing_tablet" : "writing_paper");
                const nib = pad.worldToLocal(pen.userData.tip.getWorldPosition(new THREE.Vector3()));
                const surface = TOOLS.paper.thickness * (voice === "butler" ? 2.5 : 0.5);
                report.maximumNibError = Math.max(report.maximumNibError, Math.abs(nib.y - surface));
                if (Math.abs(nib.x) > TOOLS.paper.width / 2 || Math.abs(nib.z) > TOOLS.paper.depth / 2) report.errors.push({...sample, error: "nib outside surface"});
                report.nibs++;
            }
            if (["write", "compacting", "read", "waiting", "whistle"].includes(sample.clip) && (figure.book.visible || figure.props.some((prop) => prop.visible))) {
                if (figure.inHand.some(shown)) report.nativePropConflicts.push(sample);
            }
        } catch (error) {
            report.errors.push({...sample, error: error.message});
        }
    }
    const held = CLIPS.filter((clip) => clip.loops && !clip.name.startsWith("hang") && clip.postures.includes("stand"));
    for (const from of held) for (const to of held) {
        const original = stage.draw(figure, from, from.intro || 0, 30, canvas);
        let previous = original;
        for (let frame = 0; frame < 60; frame++) {
            const blend = {from: original, previous, k: Math.min(frame / 12, 1), settled: false};
            const moves = stage.draw(figure, to, to.intro || 0, 70, canvas, {blend});
            const maximum = Math.max(...jointAngles(figure.rig, previous, moves).values());
            report.maximumJointDegrees = Math.max(report.maximumJointDegrees, THREE.MathUtils.radToDeg(maximum));
            report.blendFrames++;
            previous = moves;
            if (blend.settled) break;
            if (frame === 59) report.errors.push({from: from.name, to: to.name, error: "blend never settled"});
        }
    }
    return report;
};

document.title = "ready";
</script>
</body></html>
