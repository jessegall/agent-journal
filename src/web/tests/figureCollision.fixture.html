<!doctype html>
<html><body>
<canvas id="figure" width="128" height="128"></canvas>
<script type="module">
import * as THREE from "three";
import {CLIPS, Stage, figureOf} from "/src/figure/figure.js";
import {surfaceIntersection, surfaceTree, trianglesOf} from "./figureReadGeometry.js";
import {collisionParts, sweepCases} from "./figureCollisionScope.js";

const stage = new Stage();
const canvas = document.getElementById("figure");
const point = new THREE.Vector3();
const topology = new WeakMap();
const loaded = new Map();

async function figureFor(voice) {
    if (!loaded.has(voice)) {
        const manifest = await fetch("/voices/figures/figures.json").then((response) => response.json());
        const response = await fetch(`/voices/figures/${manifest[voice]}`);
        if (!response.ok) throw new Error(`Unable to load ${voice}: ${response.status}`);
        loaded.set(voice, await figureOf(await response.arrayBuffer(), voice, "/voices/figures/draco/"));
    }
    return loaded.get(voice);
}

function geometryAt(mesh) {
    const positions = new Float64Array(mesh.geometry.attributes.position.count * 3);
    const bounds = new THREE.Box3();
    mesh.skeleton?.update();
    for (let vertex = 0; vertex < positions.length / 3; vertex++) {
        mesh.getVertexPosition(vertex, point).applyMatrix4(mesh.matrixWorld).toArray(positions, vertex * 3);
        bounds.expandByPoint(point);
    }
    return {positions, bounds, surface: null};
}

function surfaceOf(mesh, geometry) {
    if (!geometry.surface) {
        geometry.surface = surfaceTree(trianglesOf(geometry.positions, mesh.geometry.index?.array), topology.get(mesh));
        topology.set(mesh, geometry.surface);
    }
    return geometry.surface;
}

window.collisionCases = (voice) => sweepCases(CLIPS, voice);
window.measureCollisionBatch = async (voice, cases) => {
    const figure = await figureFor(voice);
    const report = {voice, poses: 0, expected: cases.length, narrowPhaseChecks: 0, intersections: [], errors: []};
    for (const sample of cases) {
        try {
            const clip = CLIPS.find((each) => each.name === sample.clip);
            stage.draw(figure, clip, sample.frame, sample.facing, canvas, {posture: sample.posture, stride: sample.frame / clip.fps});
            figure.scene.updateMatrixWorld(true);
            const parts = collisionParts(figure);
            const geometries = new Map([...parts.moving, ...parts.protectedParts].map((mesh) => [mesh, geometryAt(mesh)]));
            for (const moving of parts.moving) {
                for (const protectedPart of parts.protectedParts) {
                    if (moving === protectedPart) continue;
                    const first = geometries.get(moving), second = geometries.get(protectedPart);
                    if (!first.bounds.intersectsBox(second.bounds)) continue;
                    report.narrowPhaseChecks++;
                    const contact = surfaceIntersection(surfaceOf(moving, first), surfaceOf(protectedPart, second));
                    if (contact) report.intersections.push({voice, ...sample, first: moving.name || moving.geometry.type, second: protectedPart.name, firstAttachment: moving.userData.attachment || "prop", secondAttachment: protectedPart.userData.attachment, triangles: contact});
                }
            }
            report.poses++;
        } catch (error) {
            report.errors.push({voice, ...sample, error: error.message});
        }
    }
    return report;
};
window.releaseCollisionFigure = (voice) => {
    const figure = loaded.get(voice);
    if (!figure) return;
    const geometries = new Set(), materials = new Set();
    figure.scene.traverse((mesh) => {
        if (mesh.geometry) geometries.add(mesh.geometry);
        for (const material of Array.isArray(mesh.material) ? mesh.material : [mesh.material]) if (material) materials.add(material);
    });
    for (const geometry of geometries) geometry.dispose();
    for (const material of materials) material.dispose();
    loaded.delete(voice);
};
document.title = "ready";
</script>
</body></html>
