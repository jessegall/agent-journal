name: Version 5 binaries

on:
  push:
    tags: ["v5.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: sh scripts/build_binaries.sh dist
      - run: sh scripts/build_archive.sh dist
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" dist/journal-* dist/agent-journal.tar.gz dist/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
