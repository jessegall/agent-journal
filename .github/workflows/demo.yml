name: Demo

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: src/web/package-lock.json
            - run: npm ci
              working-directory: src/web
            - run: npx vite build --mode demo
              working-directory: src/web
            - name: Play every scenario in a browser before publishing
              working-directory: src/web
              run: |
                  python3 -m http.server 8650 --directory dist-demo &
                  sleep 1
                  for scenario in bakery ledgerly subagents helpers; do
                      for answer in 0 1; do
                          node demo/play.mjs "http://127.0.0.1:8650/?speed=100&scenario=$scenario" $answer > /dev/null
                      done
                  done
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: src/web/dist-demo

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
