<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal 6 · Domain UI design</title></head><body>
<div id="journal-domain-design">
<style>
#journal-domain-design{color-scheme:light dark;--paper:light-dark(#fff,#191b20);--side:light-dark(#f5f5f8,#202228);--ink:light-dark(#23242d,#eeeef5);--muted:light-dark(#666874,#a6a8b4);--line:light-dark(#e3e4eb,#353741);--brand:light-dark(#5359b9,#b0b3ff);--selection:light-dark(#ebecfa,#30334f);font:14px/1.5 Inter,Geist,system-ui,sans-serif;color:var(--ink);background:var(--paper);max-width:1440px;margin:auto}
#journal-domain-design *{box-sizing:border-box}#journal-domain-design button,#journal-domain-design select,#journal-domain-design textarea{font:inherit;color:inherit}#journal-domain-design button,#journal-domain-design select{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:6px;cursor:pointer}#journal-domain-design button:focus-visible,#journal-domain-design select:focus-visible,#journal-domain-design textarea:focus-visible{outline:2px solid var(--brand);outline-offset:3px}#journal-domain-design .designbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;background:var(--side);border-bottom:1px solid var(--line)}#journal-domain-design .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}#journal-domain-design .designbar label{margin-left:auto;display:flex;gap:8px;align-items:center}#journal-domain-design .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:680px}#journal-domain-design aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}#journal-domain-design .brand{font-weight:600;margin:0 8px 28px;font-size:16px}#journal-domain-design .brand span{display:inline-grid;place-items:center;width:27px;height:27px;background:var(--brand);color:var(--paper);border-radius:6px;margin-right:10px}#journal-domain-design nav button{display:block;border:0;text-align:left;width:100%;background:transparent;margin-bottom:3px;padding:7px 10px}#journal-domain-design nav button[aria-current=page]{background:var(--selection);color:var(--brand)}#journal-domain-design nav .symbol{display:inline-block;width:26px;color:var(--muted)}#journal-domain-design .profile{margin-top:auto;padding:24px 8px 0;color:var(--muted);font-size:12px}#journal-domain-design .topbar{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}#journal-domain-design .status{font-size:12px;color:var(--muted)}#journal-domain-design .workspace{padding:28px;min-width:0}#journal-domain-design h1{font-size:23px;letter-spacing:-.6px;font-weight:600;margin:0}#journal-domain-design h2{font-size:15px;font-weight:600;margin:0}#journal-domain-design p{margin:6px 0 16px}#journal-domain-design .muted{color:var(--muted)}#journal-domain-design .heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}#journal-domain-design .columns{display:grid;grid-template-columns:minmax(240px,2fr) minmax(270px,3fr);gap:22px}#journal-domain-design .panel{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}#journal-domain-design .panelhead{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}#journal-domain-design .panelbody{padding:18px}#journal-domain-design .stack{display:grid;align-content:start;gap:18px}#journal-domain-design .row{padding:13px 0;border-bottom:1px solid var(--line)}#journal-domain-design .row:last-child{border:0}#journal-domain-design .row small{display:block;color:var(--muted);margin-top:4px}#journal-domain-design .badge{font-size:11px;padding:3px 7px;background:var(--selection);color:var(--brand);border-radius:4px;white-space:nowrap}#journal-domain-design .progress{height:4px;background:var(--side);margin-top:12px;border-radius:3px;overflow:hidden}#journal-domain-design .progress span{display:block;background:var(--brand);width:60%;height:100%}#journal-domain-design .message{padding:14px;background:var(--side);border-radius:7px;margin:15px 0 24px}#journal-domain-design textarea{display:block;width:100%;resize:vertical;min-height:100px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--paper)}#journal-domain-design .primary{background:var(--brand);color:var(--paper);border-color:var(--brand)}#journal-domain-design .actions{display:flex;gap:8px;align-items:center;margin-top:12px}#journal-domain-design .link{background:transparent;border:0;padding:0;color:var(--brand)}#journal-domain-design .empty{text-align:center;padding:34px 20px}#journal-domain-design .empty p{color:var(--muted);max-width:320px;margin:8px auto 18px}#journal-domain-design .notice{border-left:3px solid var(--brand);background:var(--selection);padding:12px 15px;margin-bottom:22px}#journal-domain-design .skeleton{height:12px;border-radius:3px;background:var(--line);margin:15px 0}#journal-domain-design .short{width:62%}#journal-domain-design .notesgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#journal-domain-design .footnote{padding:15px 22px;background:var(--side);border-top:1px solid var(--line);color:var(--muted);font-size:12px}#journal-domain-design [hidden]{display:none!important}#journal-domain-design .readonly{padding:20px;border:1px dashed var(--line);border-radius:8px}#journal-domain-design .wide{grid-column:1/-1}
@media(max-width:900px){#journal-domain-design .shell{grid-template-columns:170px minmax(0,1fr)}#journal-domain-design .columns,#journal-domain-design .notesgrid{grid-template-columns:1fr}#journal-domain-design .workspace{padding:20px}}@media(max-width:580px){#journal-domain-design .shell{display:block}#journal-domain-design aside{border-right:0;border-bottom:1px solid var(--line);padding:12px}#journal-domain-design .brand{margin-bottom:10px}#journal-domain-design nav{display:flex;gap:5px;overflow:auto}#journal-domain-design nav button{width:auto;white-space:nowrap}#journal-domain-design .profile{display:none}#journal-domain-design .designbar label{margin-left:0;flex-wrap:wrap}#journal-domain-design .heading{align-items:flex-start}#journal-domain-design .topbar{padding:0 20px}}
</style>
<div class="designbar"><div><div class="eyebrow">Design proposal · Journal 6</div><strong>Each domain brings its own UI</strong></div><label>Preview state <select id="preview-state"><option value="home">Home with Notes installed</option><option value="notes">Notes page</option><option value="empty">Empty section</option><option value="loading">First load</option><option value="updated">Live update received</option><option value="offline">Connection lost</option><option value="error">Section could not load</option><option value="installed">Module becomes available</option><option value="removed">Module removed while open</option><option value="missing">Saved link unavailable</option></select></label></div>
<div class="shell"><aside><div class="brand"><span>J</span>Journal</div><nav aria-label="Journal"><button data-page="home" aria-current="page"><span class="symbol">⌂</span>Home</button><button data-page="plans"><span class="symbol">▤</span>Plans</button><button data-page="rules"><span class="symbol">≡</span>Rules</button><button data-page="notes" id="notes-nav"><span class="symbol">▧</span>Notes</button></nav><div class="profile">Jesse Gall<br>Signed in · Owner</div></aside><div><header class="topbar"><span id="breadcrumb">Home</span><span class="status" id="connection">● Live</span></header><main class="workspace" id="screen"></main></div></div>
<div class="footnote" id="caption">Home keeps its chat and plans. Notes supplies the additional section and its own page; the sidebar and connection belong to the shell.</div>
<template id="home-template"><div class="heading"><div><h1>Home</h1><p class="muted">Your agents and their work.</p></div><span class="status">All visible work</span></div><div class="columns"><section class="panel"><div class="panelhead"><h2>Conversation</h2><span class="badge">Grace · Running</span></div><div class="panelbody"><small class="muted">Today · 10:42</small><div class="message"><strong>Grace</strong><p>The domain boundary review is ready. Each module keeps its own pages and sections.</p></div><label for="draft">Message Grace</label><textarea id="draft" placeholder="Write a message…"></textarea><div class="actions"><button class="primary" id="send-message">Send message</button><span class="status" id="send-status"></span></div></div></section><div class="stack"><section class="panel"><div class="panelhead"><h2>Plans</h2><button class="link" data-open="plans">View all →</button></div><div class="panelbody"><div class="row">Public domain contracts <span class="badge">Started</span><small>6 of 10 tasks complete</small><div class="progress"><span></span></div></div><div class="row">Browser access review<small>Planned · 4 tasks</small></div></div></section><section class="panel" aria-label="Recent notes"><div class="panelhead"><h2>Recent notes</h2><button class="link" data-open="notes">View all →</button></div><div class="panelbody" id="notes-section"><div class="row">Module registration decisions<small>Grace · Just now</small></div><div class="row">Keep one live connection<small>Jesse · Today, 09:30</small></div></div></section></div></div></template>
<template id="notes-template"><div class="heading"><div><h1>Notes</h1><p class="muted">Decisions and observations from your work.</p></div><button class="primary" id="new-note">New note</button></div><div class="notesgrid"><section class="panel"><div class="panelhead"><h2>Recent notes</h2><span class="status">2 notes</span></div><div class="panelbody"><div class="row"><strong>Module registration decisions</strong><small>Grace · Today, 10:42</small></div><div class="row">Keep one live connection<small>Jesse · Today, 09:30</small></div></div></section><section class="panel"><div class="panelhead"><h2>Module registration decisions</h2></div><div class="panelbody"><span class="status">Grace · Today, 10:42</span><p>Keep the shell stable. Each domain supplies the pages and Home sections it needs.</p><p>Publish new UI only when its routes, components and types are ready together.</p></div></section><section class="panel wide" id="note-editor" hidden><div class="panelhead"><h2>New note</h2><span class="status">Prototype only</span></div><div class="panelbody"><label for="note-body">Note</label><textarea id="note-body" placeholder="What should we remember?"></textarea><div class="actions"><button id="save-note" class="primary">Save note</button><span class="status" id="note-status"></span></div></div></section></div></template>
<script>
(()=>{
const root=document.getElementById('journal-domain-design');
const screen=root.querySelector('#screen');
const statePicker=root.querySelector('#preview-state');
const caption=root.querySelector('#caption');
let draft='';
const captions={home:'Home keeps its chat and plans. Notes supplies the additional section and its own page; the sidebar and connection belong to the shell.',notes:'A domain page uses the same shell. Its content, actions and validation belong to Notes.',empty:'An authorized, empty section stays visible and explains how to begin. Hidden or unavailable sections do not reserve blank space.',loading:'Only the new section waits. Keep its heading and space stable; the rest of Home remains usable.',updated:'Refresh authorized data in place after committed facts. Preserve filters, focus, scroll and unsent drafts.',offline:'Keep the last readable data and show that it may be stale. Reconnection refreshes visible sections; sending does not silently retry.',error:'A failed section is contained. Retry reads this section again; other sections and the sidebar keep working.',installed:'A new release offers Notes after its routes, assets and types are ready. Refresh shell entries without interrupting a draft.',removed:'An open module page is replaced with a neutral explanation. Its navigation disappears; no module data remains visible.',missing:'A fresh saved link uses the same neutral response for a removed module or denied access. It reveals no record titles.'};
function render(state){
 const existing=root.querySelector('#draft');if(existing)draft=existing.value;
 const notesPage=state==='notes';const gone=state==='removed'||state==='missing';
 root.querySelector('#notes-nav').hidden=gone;
 root.querySelector('#breadcrumb').textContent=gone?'Page unavailable':notesPage?'Notes':'Home';
 root.querySelector('#connection').textContent=state==='offline'?'○ Reconnecting…':'● Live';
 root.querySelectorAll('[data-page]').forEach(button=>{if(button.dataset.page===(notesPage?'notes':'home')&&!gone)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});
 caption.textContent=captions[state];
 if(gone){screen.innerHTML='<div class="empty"><h1>This page is no longer available</h1><p>It may have been removed, or your access may have changed.</p><button data-open="home" class="primary">Go to Home</button></div>';return;}
 screen.replaceChildren(root.querySelector(notesPage?'#notes-template':'#home-template').content.cloneNode(true));
 const editor=root.querySelector('#draft');if(editor)editor.value=draft;
 const section=root.querySelector('#notes-section');
 if(state==='empty')section.innerHTML='<div class="empty"><h2>No notes yet</h2><p>Keep decisions and useful observations here.</p><button class="primary" data-open="notes">Open Notes</button></div>';
 if(state==='loading'){section.setAttribute('aria-busy','true');section.innerHTML='<span class="status">Loading notes…</span><div class="skeleton"></div><div class="skeleton short"></div><div class="skeleton"></div>';}
 if(state==='updated'){section.innerHTML='<span role="status" class="badge">Updated just now</span><div class="row">Module removal behavior agreed<small>Grace · Just now</small></div><div class="row">Module registration decisions<small>Grace · Today, 10:42</small></div>';}
 if(state==='error')section.innerHTML='<div class="empty"><h2>Notes could not load</h2><p>Your other work is still available.</p><button data-open="home">Retry</button></div>';
 if(state==='offline')screen.insertAdjacentHTML('afterbegin','<div class="notice" role="status">Live updates are paused. Showing the last loaded work. <button data-open="updated">Reconnect</button></div>');
 if(state==='installed')screen.insertAdjacentHTML('afterbegin','<div class="notice" role="status"><strong>Notes is now available.</strong> Find it in the sidebar or below Plans. <button data-open="notes">Open Notes</button></div>');
}
statePicker.addEventListener('change',()=>render(statePicker.value));
root.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 const target=button.dataset.open||button.dataset.page;
 if(target){if(target==='plans'||target==='rules'){root.querySelector('#breadcrumb').textContent=target==='plans'?'Plans':'Rules';screen.innerHTML='<h1>'+ (target==='plans'?'Plans':'Rules')+'</h1><p class="muted">Existing page retained in the shared shell.</p><button data-open="home">Back to Home</button>';root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===target)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});caption.textContent='This design preserves the existing '+target+' page; its detailed UI is outside this flow.';return;}statePicker.value=target;render(target);return;}
 if(button.id==='send-message')root.querySelector('#send-status').textContent=root.querySelector('#draft').value.trim()?'Preview only · message not sent':'Write a message first.';
 if(button.id==='new-note'){root.querySelector('#note-editor').hidden=false;root.querySelector('#note-body').focus();}
 if(button.id==='save-note')root.querySelector('#note-status').textContent=root.querySelector('#note-body').value.trim()?'Preview only · note not saved':'Write a note first.';
});
render('home');
})();
</script>
</div>
</body></html>
