<!-- Home, version 6 · round 5: what round 5 adds to round 4. Build docs/designs/home-v6-round-5/index.html from the
     user's round 4 file (.journal/files/message/19050/Home, version 6 · round 4.html) with four mechanical steps:
       1. Copy that file whole to docs/designs/home-v6-round-5/index.html.
       2. Replace both "Home, version 6 · round 4" (the <title> and the top <h1>) with "Home, version 6 · round 5".
       3. Replace the one exact text  const H=()=>760-2-40-  with  const H=()=>innerHeight-40-
          (the panes then take the window's height instead of a fixed 760 px frame).
       4. Paste everything below this comment just before the first </body>, after round 4's main <script>.
     Nothing else of round 4 changes: the block reads round 4's globals and wraps pageHtml, makeFromForm and
     newSequence; every other control keeps its handler, and is only moved into the toolbox. -->
<style>
/* Full window: the prototype is the page. The design's own controls live in the toolbox (.dtools). */
body{overflow:hidden}
.top,.lead,.wrap>.notes,.wrap>.small{display:none}
.wrap{padding:0}
.stage{overflow:hidden;padding:0}
.app{width:100vw!important;height:100vh;border:0;border-radius:0}

/* The toolbox: one floating button in the corner, opening a panel of the design's modes. It sits inside #app, so it
   uses the app's tokens and follows light and dark. */
.dtools{position:absolute;left:12px;bottom:12px;z-index:400}
.dtools .tbtnmain{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-2);background:var(--raised);color:var(--text-2);box-shadow:var(--shadow-pop);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dtools .tbtnmain:hover,.dtools .tbtnmain[aria-expanded=true]{color:var(--text);border-color:var(--border-3)}
.dtools .tbtnmain:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dtools .panel{position:absolute;left:0;bottom:42px;width:330px;max-height:calc(100vh - 80px);overflow:auto;background:var(--raised);border:1px solid var(--border-2);border-radius:var(--radius-menu);box-shadow:var(--shadow-pop);padding:10px 12px 12px;font-size:var(--text-small);color:var(--text-2);--page-text:var(--text)}
.dtools .panel[hidden]{display:none}
.dtools .phd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.dtools .phd b{color:var(--text);font-weight:600;font-size:var(--text-field);flex:1}
.dtools .sec{margin:12px 0 6px}
.dtools .seg2,.dtools .tbtn{color:var(--text)}
.dtools .sline{margin:6px 0 0;color:var(--text-3);font-size:var(--text-small);opacity:1;min-height:0}
.dtools .dnotes div{border-top:1px solid var(--line);padding:8px 0}
.dtools .dnotes b{display:block;color:var(--text);font-weight:500;margin-bottom:2px}

/* A list page with no rows: one region under the page header, the empty state centred both ways. */
.emptyfull{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.emptyfull .in{max-width:360px;text-align:center;color:var(--text-3);font-size:var(--text-empty);display:flex;flex-direction:column;align-items:center}
.emptyfull .mark{width:40px;height:40px;border-radius:var(--radius-card);border:1px solid var(--line);background:var(--bg-2);color:var(--text-4);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.emptyfull .mark svg.i{width:20px;height:20px}
.emptyfull b{display:block;color:var(--text-2);font-weight:500;margin-bottom:4px}
.emptyfull .btn{margin-top:16px}
</style>
<script>
/* =====================================================================================================================
   Round 5, empty states. The toolbox's "List pages: With rows | Empty" switches every list page. Empty means a page
   starts with no rows: under its header (title, 0, its own action) one centred empty state. Rows made while Empty are
   the page's only rows, so the first one brings the split back with it selected and a count of 1; Undo takes it away.
   ===================================================================================================================== */
const EMPTY_PAGES={
  accounts:{rows:()=>ACCOUNTS,key:r=>r[1],kind:'account',ic:'account',t:'No accounts yet',line:'Agents run on an account. Add a Claude Code or Codex account so they can start work.'},
  profiles:{rows:()=>PROFILES,key:r=>r[0],kind:null,ic:'users',t:'No profiles yet',line:'A profile is a kind of helper: the program it runs, its models, its rules and whom it answers to.',action:'New profile'},
  docs:{rows:()=>DOCS,key:r=>r[0],kind:'document',ic:'docs',t:'No documents yet',line:'Designs, plans and notes that you and the agents write are kept here.'},
  tasks:{rows:()=>TASKS,key:r=>r[0],kind:'task',ic:'todos',t:'No tasks yet',line:'A task is one piece of work an agent takes on, from start until it is tested.'},
  plans:{rows:()=>PLANS,key:r=>r[0],kind:'plan',ic:'plan',t:'No plans yet',line:'A plan breaks bigger work into phases and tasks that agents can pick up.'},
  sequences:{rows:()=>SEQS,key:r=>r.id,kind:'sequence',ic:'seq',t:'No sequences yet',line:'A sequence is a list of steps an agent follows the same way each time.'}};
/* The rows each page had when Empty was chosen; any row not in it was made since. */
let EMPTY_BEFORE={};
function noteRowsBefore(){EMPTY_BEFORE=Object.fromEntries(Object.entries(EMPTY_PAGES).map(([id,p])=>[id,new Set(p.rows().map(p.key))]))}
function madeRows(id){const p=EMPTY_PAGES[id];return p.rows().filter(r=>!EMPTY_BEFORE[id].has(p.key(r)))}
function withOnly(arr,keep,fn){const all=arr.slice();arr.splice(0,arr.length,...keep);try{return fn()}finally{arr.splice(0,arr.length,...all)}}
function emptyFullHtml(id){const p=EMPTY_PAGES[id],label=p.kind?CREATE[p.kind].title:p.action,attr=p.kind?`data-create="${p.kind}"`:'data-newprofile';
  return `<div class="emptyfull" role="region" aria-label="${PAGE_TITLE()}"><div class="in"><span class="mark">${I(p.ic)}</span><b>${p.t}</b>${p.line}
    <button class="btn sm primary" ${attr} data-fk="emptycreate:${id}">${I('plus','s14')}${label}</button></div></div>`}
/* The page header exactly as round 4 draws it in its empty mode (count 0, its own action); the region below is replaced. */
function emptyHeadHtml(id){if(id==='profiles')return `<div class="pghead"><h3>Profiles</h3><span class="sub">0</span><div class="r"></div></div>`;
  const drawn=round4PageHtml();let i=drawn.indexOf('<div class="pgbody">');if(i<0)i=drawn.indexOf('<div class="pgread">');return drawn.slice(0,i)}
const round4PageHtml=pageHtml;
pageHtml=function(){const id=page,p=EMPTY_PAGES[id];if(!showEmpty||!p)return round4PageHtml();
  const made=madeRows(id);if(!made.length)return emptyHeadHtml(id)+emptyFullHtml(id);
  if(id==='profiles'&&!made.some(r=>r[0]===PROFSEL))PROFSEL=made[made.length-1][0];
  if(id==='sequences'&&!made.some(r=>r.id===SEQSEL))SEQSEL=made[made.length-1].id;
  showEmpty=false;try{return withOnly(p.rows(),made,round4PageHtml)}finally{showEmpty=true}};
/* Round 4 turns its empty mode off when a row is made; here the page stays Empty and shows just the new row. */
const round4MakeFromForm=makeFromForm;
makeFromForm=function(){const was=showEmpty;round4MakeFromForm();if(was){showEmpty=true;render()}};
const round4NewSequence=newSequence;
newSequence=function(d,drafted){const was=showEmpty;round4NewSequence(d,drafted);if(was){showEmpty=true;render()}};
/* The project has no way to make a profile yet; here New profile adds a plain one so the split can come back. */
function newProfile(){const id='new'+(PROFILES.length+1);
  PROFILES.push([id,'New profile','Claude Code','Sonnet',['Sonnet'],'Any driver','Agent 1','One per job',[],[],['Stops when its job is reported'],'','A new kind of helper. Its rules are not set yet.']);
  PROFSEL=id;render();toast('Added New profile',()=>{PROFILES.splice(PROFILES.findIndex(p=>p[0]===id),1);render()});focusFk('row:prof:'+id)}
WIRE_EXTRA.push(on=>on('[data-newprofile]',b=>b.onclick=newProfile));
function setRowsMode(empty){if(empty&&!showEmpty)noteRowsBefore();showEmpty=empty;
  $$('#rowsSeg button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.rows==='0')===empty)));render()}

/* =====================================================================================================================
   Round 5, full window and the toolbox. The prototype fills the browser window like the real journal. Every design-only
   switch moves, with its own handler, into one panel behind a floating button in the bottom left corner.
   ===================================================================================================================== */
function fitWindow(){frameW=innerWidth+2;render()}
(function buildToolbox(){const app=$('#app');
  app.insertAdjacentHTML('beforeend',`<div class="dtools" data-dtools>
    <button class="tbtnmain" data-fk="dtools" aria-expanded="false" aria-controls="dpanel" title="Design toolbox" aria-label="Design toolbox">${I('wand','s14')}</button>
    <div class="panel" id="dpanel" role="dialog" aria-label="Design toolbox" hidden>
      <div class="phd"><b>Home, version 6 · round 5</b><button class="ib" data-dclose aria-label="Close the toolbox" title="Close">${I('close','s14')}</button></div>
      <div class="sec">Grows</div><div data-slot="steps"></div><div data-slot="sline"></div>
      <div class="sec">List pages</div><div class="seg2" id="rowsSeg" role="group" aria-label="List pages"><button data-rows="1" aria-pressed="true">With rows</button><button data-rows="0" aria-pressed="false">Empty</button></div>
      <div class="sec">Theme</div><div data-slot="mode"></div>
      <div class="sec">Try</div><div data-slot="try"></div>
      <div class="sec">Notes</div><div class="dnotes" data-slot="notes"></div>
    </div></div>`);
  const slot=n=>$(`[data-slot="${n}"]`);
  slot('steps').append($('#steps'));slot('sline').append($('#sLine'));slot('mode').append($('#mL').parentElement);
  slot('try').append($('#simHelper'));$('#widths').hidden=true;$('#emptyBtn').hidden=true;
  $('#notes').hidden=true;
  const notes=()=>NOTE_CARDS.map(([t,x])=>`<div><b>${t}</b>${x}</div>`).join('')+`<div><b>Empty states</b>A list page with no rows does not split. Under its header, which keeps its title, 0 and its own action, one empty state sits in the middle: an icon, a title, one sentence and the action that makes the first one. The first row brings the split back. A filter with no matches is different: the split stays, the list says no matches and offers to clear the filter.</div>`;
  slot('notes').innerHTML=notes();
  const btn=$('[data-dtools] .tbtnmain'),panel=$('#dpanel'),open=on=>{panel.hidden=!on;btn.setAttribute('aria-expanded',String(on));if(!on)btn.focus()};
  btn.onclick=()=>open(panel.hidden);$('[data-dclose]').onclick=()=>open(false);
  panel.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();open(false)}});
  $$('#rowsSeg button').forEach(b=>b.onclick=()=>setRowsMode(b.dataset.rows==='0'));
  addEventListener('resize',()=>{clearTimeout(fitWindow.t);fitWindow.t=setTimeout(fitWindow,80)});
  noteRowsBefore();fitWindow()})();
</script>
