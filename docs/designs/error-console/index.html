<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The issue console · design</title>
<style>
/* The project's tokens (resources/css/app.css :root and .dark), copied as they are. */
:root{
  --font-sans:'Geist',-apple-system,'Segoe UI',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --text-title:16px;--text-card:13.5px;--text-body:13px;--text-small:12px;--text-badge:11.5px;--text-meta:11px;--text-group:10.5px;
  --radius-badge:4px;--radius-control:6px;--radius-button:7px;--radius-field:8px;--radius-menu:9px;--radius-card:12px;
  --ease-journal:cubic-bezier(0.2,0,0,1);--duration-hover:120ms;--duration-pop:180ms;--duration-view:240ms;
  --shadow-window:0 10px 30px rgba(20,22,30,.14),0 1px 3px rgba(20,22,30,.08);--shadow-pop:0 6px 20px rgba(20,22,30,.13);
  --scrim:rgba(0,0,0,.18);--focus:#262422;--side:#f6f5f3;--bg:#fff;--bg-2:#fbfaf9;--raised:#f7f6f4;--hover:#efedea;--sel:#e8e5e1;--chip:#edeae6;
  --code-bg:#f6f5f2;--border:#e9e6e2;--border-2:#dcd8d3;--border-3:#ccc7c1;--line:#e9e6e2;
  --text:#1c1a18;--text-2:#4a4540;--text-3:#625c56;--text-4:#6f6962;--brand:#262422;--on-brand:#fff;--danger:#bf4f3d;--tone-warn:#a4731a;
  --page:#ecebe8;--page-text:#3b3733}
.dark{--scrim:rgba(0,0,0,.45);--focus:#e8e6e3;--side:#0e0d0c;--bg:#141312;--bg-2:#11100f;--raised:#1a1817;--hover:#201e1c;--sel:#252220;--chip:#282523;
  --code-bg:#131211;--border:#282523;--border-2:#33302d;--border-3:#3f3b37;--line:#252220;
  --text:#e9e6e2;--text-2:#b0aaa3;--text-3:#a09a93;--text-4:#9a948d;--brand:#e8e6e3;--on-brand:#100f0e;--danger:#df8b7e;--tone-warn:#d8a94a;
  --shadow-window:0 14px 36px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);--shadow-pop:0 8px 22px rgba(0,0,0,.5);--page:#0a0908;--page-text:#c9c4be}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--page-text);font-family:var(--font-sans);font-size:var(--text-body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.s14{width:14px;height:14px}.i.s13{width:13px;height:13px}
.spin{width:12px;height:12px;flex:none;border-radius:50%;border:1.6px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:sp 800ms linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- The design page around the frame ---- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 20px}
.top h1{font-size:15px;font-weight:600;margin:0 8px 0 0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--page-text) 18%,transparent);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--page-text)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--page-text) 14%,transparent)}
.lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.caption{margin:0 auto 12px;max-width:1180px;padding:0 20px;font-size:13px;line-height:1.55}
.caption b{font-weight:600}
.caption .tb{margin-left:6px;border:1px solid color-mix(in srgb,var(--page-text) 22%,transparent);border-radius:7px;background:transparent;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--page-text)}
.stage{display:flex;justify-content:center;padding:0 20px 24px}
.frame{position:relative;width:1180px;max-width:100%;height:740px;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);background:var(--bg);color:var(--text)}
.frame.phone{width:390px;height:800px;border-radius:28px}
.notes{max-width:1180px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;font-size:12.5px;line-height:1.55}
.notes div{background:color-mix(in srgb,var(--page-text) 6%,transparent);border-radius:10px;padding:12px 14px}
.notes b{display:block;margin-bottom:4px;font-size:13px}

/* ---- The app shell, as AppSidebarLayout draws it ---- */
.app{display:flex;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text)}
.side{width:216px;flex:none;background:var(--side);border-right:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column}
.side .brand{display:flex;align-items:center;gap:8px;padding:2px 16px 14px;font-weight:600}
.side .brand .lg{width:18px;height:18px;border-radius:5px;background:var(--brand)}
.side a{display:flex;align-items:center;gap:9px;height:30px;margin:0 8px;padding:0 9px;border-radius:var(--radius-button);color:var(--text-2);font-size:var(--text-body)}
.side a.on{background:var(--sel);color:var(--text)}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:8px 16px 0;color:var(--text-2);font-size:var(--text-small)}
.side .foot .av{width:22px;height:22px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:10px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:500}
.topbar .sp{flex:1}
.fault{margin:0;border-bottom:1px solid var(--border);padding:4px 16px;font-size:var(--text-small);color:var(--danger);line-height:1.45}
main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.chat{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.me{align-self:flex-end;max-width:78%;background:var(--chip);border-radius:10px 10px 4px 10px;padding:8px 12px;line-height:1.45}
.ag{max-width:92%;line-height:1.55}
.ag .m{display:flex;gap:6px;align-items:center;font-size:var(--text-meta);color:var(--text-3);margin-bottom:3px}
.ag .m b{font-weight:500;color:var(--text-2)}
.composer{max-width:760px;width:100%;margin:0 auto;padding:0 24px 18px}
.composer .box{border:1px solid var(--border-2);border-radius:14px;background:var(--bg);padding:10px 12px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text-4)}
.composer .box .r{display:flex;justify-content:flex-end}
.composer .send{height:26px;padding:0 10px;border-radius:var(--radius-button);background:var(--brand);color:var(--on-brand);border:0;font-size:var(--text-small)}
.phone .side{display:none}
.phone .chat{padding:18px 16px}
.phone .composer{padding:0 12px 14px}

/* ---- The pill ---- */
.bub{position:absolute;left:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--border-2);background:var(--raised);box-shadow:var(--shadow-pop);cursor:pointer;font-size:var(--text-small);color:var(--text);animation:bubin var(--duration-view) var(--ease-journal)}
.bub:hover{background:var(--hover)}
.bub .n{font-weight:600;font-variant-numeric:tabular-nums}
.bub .mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--danger)}
.dark .bub .mk{color:#1a0f0c}
.bub.warn .mk{background:var(--tone-warn)}
.bub.calm .mk{background:transparent;color:var(--text-3)}
.bub.calm{cursor:default}
.bub .w{color:var(--text-3)}
.bub .w .e{color:var(--danger)}.bub .w .wa{color:var(--tone-warn)}
.bub.ping .mk{animation:ping 900ms var(--ease-journal) 2}
@keyframes bubin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.phone .bub{left:12px;bottom:104px}
.phone .bub .w{display:none}

/* ---- The console: the kit Dialog, size lg ---- */
.scrim{position:absolute;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.dlg{position:relative;width:100%;max-width:580px;max-height:calc(100% - 80px);display:flex;flex-direction:column;overflow:hidden;border-radius:var(--radius-card);border:1px solid var(--border-2);background:var(--raised);box-shadow:var(--shadow-window);animation:pop var(--duration-pop) var(--ease-journal)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.dh{display:flex;align-items:center;gap:8px;height:48px;flex:none;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:var(--text-title);font-weight:600}
.dh .cnt{font-size:var(--text-small);color:var(--text-3)}
.sp{flex:1}
.ibtn{width:28px;height:28px;border-radius:var(--radius-button);border:0;background:transparent;display:grid;place-items:center;color:var(--text-3);cursor:pointer}
.ibtn:hover{background:var(--hover);color:var(--text)}
.filt{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.filt button{height:24px;padding:0 9px;border-radius:var(--radius-button);border:1px solid var(--line);background:transparent;font-size:var(--text-small);color:var(--text-2);cursor:pointer}
.filt button[aria-pressed=true]{border-color:var(--border-3);color:var(--text);background:var(--sel)}
.db{overflow:auto;flex:1}
.grp{padding:12px 16px 4px;font-size:var(--text-group);font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-4);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.db>.grp:first-child{border-top:0}
.grp button{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:var(--text-meta);border:0;background:transparent;color:var(--text-3);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.iss{display:grid;grid-template-columns:18px 1fr;gap:2px 10px;padding:12px 16px;border-top:1px solid var(--line)}
.grp+.iss,.db>.iss:first-child{border-top:0}
.iss:focus-visible{outline-offset:-2px}
.iss .sv{padding-top:2px;color:var(--danger)}
.iss.warn .sv{color:var(--tone-warn)}
.iss.ok .sv,.iss.dis .sv{color:var(--text-3)}
.iss .tt{font-size:var(--text-card);line-height:1.45;font-weight:500}
.iss .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:var(--text-meta);color:var(--text-3);margin-top:3px}
.src{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--radius-badge);background:var(--chip);color:var(--text-2);font-size:var(--text-meta)}
.iss .why{font-size:var(--text-small);color:var(--text-2);line-height:1.5;margin-top:6px}
.iss .todo{margin-top:8px;font-size:var(--text-small);line-height:1.5}
.iss .todo .lb{display:block;font-size:var(--text-meta);color:var(--text-3);margin-bottom:2px}
.iss pre{margin:6px 0 0;padding:7px 9px;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-field);font-family:var(--font-mono);font-size:11px;white-space:pre-wrap;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-button);border:1px solid var(--border-2);background:var(--bg);color:var(--text);font-size:var(--text-small);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{opacity:.9;background:var(--brand)}
.btn.q{border-color:transparent;background:transparent;color:var(--text-3)}
.btn.q:hover{color:var(--text);background:var(--hover)}
.btn[disabled]{opacity:.55;cursor:default}
.iss.ok .tt,.iss.dis .tt{font-weight:400;color:var(--text-2)}
.iss.ok,.iss.dis{opacity:.8}
.iss.fresh{background:color-mix(in srgb,var(--danger) 6%,transparent)}
.busy{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:var(--text-small);color:var(--text-2)}
.helping{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:var(--sel);font-size:var(--text-meta);color:var(--text);margin-top:8px}
.helping a{color:var(--text-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.confirm{margin-top:10px;border:1px solid var(--border-2);border-radius:var(--radius-field);background:var(--bg);padding:10px 12px;font-size:var(--text-small);line-height:1.5}
.confirm .acts{margin-top:8px}
.fixed .how{font-size:var(--text-small);color:var(--text-2);margin-top:3px}
.empty{padding:34px 24px;text-align:center;color:var(--text-3);font-size:var(--text-small);line-height:1.6}
.empty b{display:block;color:var(--text);font-size:var(--text-card);font-weight:500;margin-bottom:4px}
.df{flex:none;display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:var(--text-meta);color:var(--text-3)}
.df kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-2);border-radius:4px;padding:0 4px;color:var(--text-2)}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;cursor:pointer;font-size:var(--text-small);color:var(--text)}
.sw .tr{width:28px;height:16px;border-radius:999px;background:var(--border-3);position:relative;transition:background var(--duration-hover) var(--ease-journal);flex:none}
.sw .tr::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);transition:transform var(--duration-hover) var(--ease-journal)}
.sw[aria-checked=true] .tr{background:var(--brand)}
.sw[aria-checked=true] .tr::after{transform:translateX(12px)}
.phone .scrim{align-items:flex-end;padding:0}
.phone .dlg{max-width:none;max-height:90%;border-radius:16px 16px 0 0;border-bottom:0}
.phone .df .keys{display:none}

/* ---- The ask-for-help picker: a second, smaller dialog over the console ---- */
.pick{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
.pk{width:100%;max-width:420px;border-radius:var(--radius-card);border:1px solid var(--border-2);background:var(--raised);box-shadow:var(--shadow-window);display:flex;flex-direction:column;overflow:hidden;animation:pop var(--duration-pop) var(--ease-journal)}
.pk .ph{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.pk .ph h3{margin:0;font-size:var(--text-title);font-weight:600}
.pk .ph p{margin:4px 0 0;font-size:var(--text-small);color:var(--text-3);line-height:1.45}
.pk .opts{padding:6px;display:flex;flex-direction:column;gap:2px}
.opt{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:var(--radius-button);padding:7px 9px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt[aria-checked=true]{background:var(--sel)}
.opt .av{width:22px;height:22px;border-radius:6px;background:var(--chip);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--text-2)}
.opt .nm{font-size:var(--text-body);line-height:1.3}
.opt small{display:block;font-size:var(--text-meta);color:var(--text-3)}
.opt .st{font-size:var(--text-meta);color:var(--text-3)}
.pk .sep{height:1px;background:var(--line);margin:4px 8px}
.pk .note{padding:6px 16px 4px}
.pk .note label{display:block;font-size:var(--text-meta);color:var(--text-3);margin-bottom:4px}
.pk textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--border-2);border-radius:var(--radius-field);background:var(--bg);padding:7px 9px;font-size:var(--text-small)}
.pk .pf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.phone .pick{align-items:flex-end;padding:0}
.phone .pk{max-width:none;border-radius:16px 16px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="alert" viewBox="0 0 16 16"><path d="M8 1.8 14.6 13.5H1.4Z"/><path d="M8 6v3.4M8 11.4v.1"/></symbol>

  <symbol id="close" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
  <symbol id="host" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M5.5 13.5h5M8 11v2.5"/></symbol>
  <symbol id="box" viewBox="0 0 16 16"><path d="M2.5 5 8 2.2 13.5 5v6L8 13.8 2.5 11Z"/><path d="M2.5 5 8 7.8 13.5 5M8 7.8v6"/></symbol>
  <symbol id="tag" viewBox="0 0 16 16"><path d="M2.5 2.5h5.2l5.8 5.8-5.2 5.2-5.8-5.8Z"/><circle cx="5.3" cy="5.3" r=".9"/></symbol>
  <symbol id="copy" viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></symbol>
  <symbol id="arrow" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></symbol>
  <symbol id="wand" viewBox="0 0 16 16"><path d="m2.5 13.5 8-8M10 2.5v2M12.5 3.5l-1.4 1.4M13.5 6h-2"/></symbol>
  <symbol id="auto" viewBox="0 0 16 16"><path d="M13.2 6.2A5.5 5.5 0 0 0 3 5M2.8 9.8A5.5 5.5 0 0 0 13 11"/><path d="M3 2.5V5h2.5M13 13.5V11h-2.5"/></symbol>
  <symbol id="hand" viewBox="0 0 16 16"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2Z"/></symbol>
  <symbol id="plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="home" viewBox="0 0 16 16"><path d="M2.5 7 8 2.5 13.5 7v6.5h-11Z"/></symbol>
  <symbol id="todos" viewBox="0 0 16 16"><path d="M6 4h7.5M6 8h7.5M6 12h7.5M2.5 4h.1M2.5 8h.1M2.5 12h.1"/></symbol>
  <symbol id="docs" viewBox="0 0 16 16"><path d="M4 1.8h5.5L12.5 5v9.2H4Z"/><path d="M9.5 1.8V5h3"/></symbol>
  <symbol id="cog" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></symbol>
  <symbol id="search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></symbol>
  <symbol id="menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></symbol>
</svg>

<div class="top" role="toolbar" aria-label="Design controls">
  <h1>The issue console</h1>
  <span class="lbl">State</span><div class="seg" id="scen"></div>
  <span class="lbl">Look</span><div class="seg" id="look"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <span class="lbl">Width</span><div class="seg" id="width"><button data-v="desk">Desktop</button><button data-v="phone">Phone 390</button></div>
</div>
<p class="caption" id="cap"></p>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="notes" id="notes"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* An issue: what went wrong, when it began, where it comes from, what to do, and the remedy when the journal knows one. */
const REL=n=>({label:'Run the install line again',past:`Brought ${n} up to release 6.2.0`,doing:`Running the install line on ${n}…`,done:`${n} runs 6.2.0 now`,kind:'a host on an older release',rule:'run its install line again'});
const ISSUES={
  h1:{sev:'error',src:['host','Host mac-1.home'],at:'15:13',min:18,title:'The host mac-1.home has failed to reach the journal since 15:13',
    why:'Its last call: connection refused by journal.home:443.',todo:'Check that the machine is awake and online. It clears by itself once a call goes through.',link:'Open Hosts'},
  r1:{sev:'warn',src:['tag','Host mac-1.home'],at:'15:09',min:22,title:'The host mac-1.home runs release 6.1.4, not the journal\'s 6.2.0',
    todo:'Run its install line again on that machine to bring it up to date.',cmd:'curl -fsSL https://journal.home/install/7f3c | sh',fix:REL('mac-1.home')},
  i1:{sev:'error',src:['box','Installation · updater'],at:'14:58',min:33,title:'The updater could not restart the queue worker after 3 tries',
    why:'The worker exits at start: “SQLSTATE[HY000] database is locked”.',todo:'Read the updater\'s log on the journal\'s machine, then restart the worker.',cmd:'docker compose logs updater --tail 50'},
  h2:{sev:'error',src:['host','Host ci-runner-1'],at:'15:27',min:4,title:'The host ci-runner-1 has failed to reach the journal since 15:27',why:'Its last call: TLS handshake timed out after 10 s.',todo:'Check the runner\'s network. It clears by itself once a call goes through.',link:'Open Hosts'},
  h3:{sev:'warn',src:['host','Host journal-host'],at:'15:24',min:7,title:'The journal\'s own host has not called the journal since 15:24',todo:'Restart the journal\'s host container.',cmd:'docker compose restart host',
    fix:{label:'Restart the host container',past:'Restarted the journal\'s host container',doing:'Restarting the host container…',done:'the host called again at 15:34',kind:'the journal\'s own host going quiet',rule:'restart its container'}},
  h4:{sev:'error',src:['host','Host build-2'],at:'15:21',min:10,title:'The host build-2 has failed to reach the journal since 15:21',why:'Its last call: 401, its secret was refused.',todo:'The host was probably enrolled again elsewhere. Enroll it again from Hosts.',link:'Open Hosts'},
  r2:{sev:'warn',src:['tag','Host build-2'],at:'15:02',min:29,title:'The host build-2 runs release 6.1.4, not the journal\'s 6.2.0',todo:'Run its install line again on that machine.',cmd:'curl -fsSL https://journal.home/install/a91e | sh',fix:REL('build-2')},
  r3:{sev:'warn',src:['tag','Host ci-runner-1'],at:'14:51',min:40,title:'The host ci-runner-1 runs release 6.0.9, not the journal\'s 6.2.0',todo:'Run its install line again on that machine.',cmd:'curl -fsSL https://journal.home/install/c02d | sh',fix:REL('ci-runner-1')},
  i2:{sev:'error',src:['box','Installation · scheduler'],at:'14:40',min:51,title:'The scheduler has not run for 50 minutes',todo:'Restart the scheduler container.',cmd:'docker compose restart scheduler',
    fix:{label:'Restart the scheduler',past:'Restarted the scheduler',doing:'Restarting the scheduler…',done:'the scheduler ran at 15:34',kind:'the scheduler stopping',rule:'restart it'}}};
Object.entries(ISSUES).forEach(([k,v])=>v.id=k);
const AGENTS=[['A1','Agent 1','main','Idle · waits for you'],['A2','Agent 2','main','Working on task 1702'],['A3','Agent 3','main','Asleep'],['W3','Worker 3','helper of Agent 1','Task 1718 · 2 of 4 steps']];

/* Each state: its name, its caption, its issues, whether the journal fixes known problems itself, and what is open. */
const SCEN={
  none:['No issues','Nothing is wrong, so there is no pill at all, and nothing sits between the top bar and the page.',[],true],
  some:['Some issues','Two errors are open. The layout keeps its height: before, each issue was a red line stacked under the top bar. A pill in the bottom-left corner of the content shows the count and the worst kind (red for an error, amber for warnings only). Click it, or press ⌥⇧I, to open the console: newest first, each issue with its time, its source, why it happened and what to do. Fix known problems is on, so the release warning on mac-1.home never showed: the journal ran its install line and lists it under Fixed for you.',['h1','i1'],true],
  actions:['Fix, Ignore, Auto-fix, Ask for help','Fix known problems is off here, so the warnings wait for you. A warning the journal knows a remedy for offers Fix (runs it now), Auto-fix (from now on, fix this kind without asking), Ignore and Ask for help. An error without a remedy offers only Ignore and Ask for help, next to what you can do yourself. Try Fix on the release warning, Auto-fix on the scheduler, and Ask for help on the updater.',['h3','r1','i1','i2'],false,'open'],
  many:['Many','Nine issues from five sources, with Fix known problems off. The pill still takes one line: “9 · 5 errors, 4 warnings”. The console filters by All, Errors or Warnings, its list scrolls, and its head keeps the count and Fix all 5, which runs every known remedy at once.',['h2','h3','h4','h1','r1','r2','i1','r3','i2'],false,'open'],
  fixed:['Fixed for you','Fix known problems is on. A host on an older release appears: the pill reads “Fixing build-2…” with a spinner, then “Fixed · build-2 runs 6.2.0 now” with a tick for 4 seconds, then goes. Nothing waited for you. The console (⌘K “Show issues”) lists it under Fixed for you, with what the journal did.',[],true,'fixdemo'],
  ignored:['Ignored','You ignored the updater\'s error: it leaves the count (the pill reads 1) and folds into Ignored at the foot of the list, with Show again. It comes back by itself when it changes, for example a new reason. When every issue is ignored the pill goes, and ⌘K “Show issues” still opens the console.',['h1','i1'],true,'open'],
  clears:['Clears by itself','The console is open. After a moment mac-1.home reaches the journal again: its issue turns grey with a tick, reads “Cleared at 15:32 · it reached the journal again”, and moves to Cleared, while the count drops. Press Clear the rest to see the last one go: the pill reads All clear for 4 seconds, then fades out.',['h1','i1'],true,'open']};

let S={scen:'some',dark:false,phone:false,open:false,before:false,filt:'all',list:[],ign:new Set(),cleared:[],fixedLog:[],rules:[],busy:{},confirm:null,help:{},pick:null,pill:null,auto:true,fresh:null,run:0};
const FIXED_BEFORE=[{title:'Restarted the journal\'s host container',how:'it had not called the journal for 2 minutes · it called again at 14:49',at:'14:47'}];
function seed(){const sc=SCEN[S.scen];S.run++;S.list=sc[2].map(k=>({...ISSUES[k]}));S.auto=sc[3];S.ign=new Set();S.cleared=[];S.busy={};S.confirm=null;S.help={};S.pick=null;S.pill=null;S.rules=[];S.filt='all';S.fresh=null;
  S.fixedLog=S.scen==='some'?[{title:'Brought mac-1.home up to release 6.2.0',how:'ran its install line again · it was on 6.1.4',at:'15:09'},...FIXED_BEFORE]:S.scen==='none'||S.scen==='ignored'||S.scen==='clears'?FIXED_BEFORE.slice():[];
  if(S.scen==='ignored')S.ign.add('i1');
  S.open=sc[4]==='open';const my=S.run;
  if(S.scen==='clears')setTimeout(()=>{if(S.run===my)clearOne('h1','it reached the journal again','15:32')},2600);
  if(S.scen==='fixed')setTimeout(()=>{if(S.run===my)arrive({...ISSUES.r2})},900)}

const live=()=>S.list.filter(x=>!S.ign.has(x.id));
const nErr=()=>live().filter(x=>x.sev==='error').length,nWarn=()=>live().filter(x=>x.sev==='warn').length;
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const say=t=>{$('#live').textContent=t};
const later=(ms,f)=>{const my=S.run;setTimeout(()=>{if(S.run===my)f()},ms)};
function clearOne(id,why,at){const x=S.list.find(y=>y.id===id);if(!x)return;S.list=S.list.filter(y=>y!==x);S.cleared.unshift({...x,clearedAt:at,clearWhy:why});say('Cleared: '+x.title);calmIfDone();draw()}
function calmIfDone(){if(!live().length){S.pill={ic:'tick',t:'All clear'};later(4000,()=>{S.pill=null;draw()})}}
/* The journal runs a remedy: the issue shows it working, then moves to Fixed for you. */
function runFix(id,by){const x=S.list.find(y=>y.id===id);if(!x||S.busy[id])return;S.busy[id]=true;S.confirm=null;draw();
  later(1800,()=>{S.list=S.list.filter(y=>y.id!==id);delete S.busy[id];
    S.fixedLog.unshift({title:x.fix.past,how:`${by||'you pressed Fix'} · ${x.fix.done}`,at:'15:34'});
    say('Fixed: '+x.fix.done);if(!live().length){S.pill={ic:'tick',t:'Fixed · '+x.fix.done};later(4000,()=>{S.pill=null;draw()})}draw()})}
/* A new issue arrives: with a known remedy and the setting on, the journal fixes it without asking. */
function arrive(x){if(S.auto&&x.fix){S.pill={ic:'spin',t:`Fixing ${x.src[1].replace('Host ','')}…`};draw();
    later(2000,()=>{S.fixedLog.unshift({title:`Brought ${x.src[1].replace('Host ','')} up to release 6.2.0`,how:`it was on 6.1.4 · ran its install line again · ${x.fix.done}`,at:'15:33'});S.pill={ic:'tick',t:'Fixed · '+x.fix.done};say('Fixed by itself: '+x.fix.done);draw();
      later(4000,()=>{S.pill=null;draw()})});return}
  S.list.unshift(x);S.fresh=x.id;say('New issue: '+x.title);draw()}

/* ---- Drawing ---- */
function shell(){const faults=S.before?S.list.map(x=>`<p class="fault" role="alert">${esc(x.title)}${x.why?': '+esc(x.why.replace(/^Its last call: /,'its last call, ')):'.'}</p>`).join(''):'';
  return `<div class="app">
  <nav class="side" aria-label="Main"><div class="brand"><span class="lg"></span>Journal</div>
    <a class="on">${I('home','s14')}Home</a><a>${I('todos','s14')}Tasks</a><a>${I('docs','s14')}Documents</a><a>${I('host','s14')}Hosts</a><a>${I('cog','s14')}Settings</a>
    <div class="foot"><span class="av">JG</span>Owner</div></nav>
  <div class="col">
    <div class="topbar">${S.phone?I('menu'):''}Home<span class="sp"></span>${I('search','s14')}</div>
    ${faults}
    <main><div class="chat">
      <div class="me">Is the bell toast fine on small screens?</div>
      <div class="ag"><div class="m"><b>Agent 1</b>· 15:30</div>I checked it at 360 px: the toast fits, but the close button wraps under the text. Task 1718 fixes that; Worker 3 is on it.</div>
      <div class="me">Good. Tell me when it lands.</div>
    </div>
    <div class="composer"><div class="box">Message Agent 1<div class="r"><button class="send" tabindex="-1">Send</button></div></div></div></main>
    ${S.before?'':pill()}
  </div></div>${S.open&&!S.before?consoleHtml():''}${S.pick?pickHtml():''}`}

function pill(){if(S.pill)return `<div class="bub calm" role="status">${'<span class="mk">'+(S.pill.ic==='spin'?'<span class="spin"></span>':I('tick','s13'))+'</span>'}<span>${esc(S.pill.t)}</span></div>`;
  const a=live(),e=nErr(),w=nWarn();if(!a.length)return '';
  const parts=[e?`<span class="e">${plural(e,'error')}</span>`:'',w?`<span class="wa">${plural(w,'warning')}</span>`:''].filter(Boolean).join(', ');
  return `<button class="bub${e?'':' warn'}${S.fresh?' ping':''}" data-bub aria-haspopup="dialog" aria-expanded="${S.open}" aria-label="${a.length} open issue${a.length===1?'':'s'}: ${parts.replace(/<[^>]+>/g,'')}. Open the issue console" title="Issues · ⌥⇧I">
    <span class="mk">${I(e?'alert':'warn','s13')}</span><span class="n">${a.length}</span><span class="w">· ${parts}</span></button>`}

function issueHtml(x,state){const icon=state==='ok'?'tick':state==='dis'?'warn':x.sev==='warn'?'warn':'alert';
  const cls=state==='ok'?'ok':state==='dis'?'dis':x.sev==='warn'?'warn':'';
  const time=state==='ok'?`Cleared at ${x.clearedAt} · ${esc(x.clearWhy)}`:`Since ${x.at} · ${x.min<60?x.min+' min':Math.floor(x.min/60)+' h'} ago`;
  let body='';
  if(!state){const f=x.fix,busy=S.busy[x.id],h=S.help[x.id];
    body=`${x.why?`<div class="why">${esc(x.why)}</div>`:''}
    <div class="todo"><span class="lb">${f?'What to do · Fix does it for you':'What to do'}</span>${esc(x.todo)}${x.cmd?`<pre>${esc(x.cmd)}</pre>`:''}</div>
    ${h?`<span class="helping">${I('hand','s13')}${esc(h)} is looking at it · <a data-chat>open its chat</a></span>`:''}
    ${busy?`<div class="busy" role="status"><span class="spin"></span>${esc(f.doing)}</div>`
      :S.confirm===x.id?`<div class="confirm" role="group" aria-label="Auto-fix">From now on, whenever ${esc(f.kind)} happens, the journal will ${esc(f.rule)} without asking, and list it under Fixed for you. It fixes this one now too.<div class="acts"><button class="btn pri" data-autoyes="${x.id}">Auto-fix from now on</button><button class="btn q" data-autono>Cancel</button></div></div>`
      :`<div class="acts">${f?`<button class="btn pri" data-fix="${x.id}" title="${esc(f.label)} now">${I('wand','s14')}Fix</button><button class="btn" data-autofix="${x.id}" title="Fix this kind without asking from now on">${I('auto','s14')}Auto-fix</button>`:''}${x.link?`<button class="btn" data-link>${I('arrow','s14')}${x.link}</button>`:''}${x.cmd&&!f?`<button class="btn" data-copy>${I('copy','s14')}Copy the command</button>`:''}<button class="btn" data-help="${x.id}" aria-haspopup="dialog">${I('hand','s14')}Ask for help</button><button class="btn q" data-ign="${x.id}" title="Hide it until it changes">Ignore</button></div>`}`}
  return `<article class="iss ${cls}${S.fresh===x.id?' fresh':''}" tabindex="-1" data-iss="${x.id}" aria-label="${x.sev==='warn'?'Warning':'Error'}: ${esc(x.title)}">
    <span class="sv">${I(icon,'s14')}</span>
    <div><div class="tt">${esc(x.title)}</div>
      <div class="meta"><span class="src">${I(x.src[0],'s13')}${esc(x.src[1])}</span><span>${time}</span>${state==='dis'?`<button class="btn q" style="height:20px;padding:0 6px" data-unign="${x.id}">Show again</button>`:''}</div>
      ${body}</div></article>`}
const fixedHtml=f=>`<article class="iss ok fixed" tabindex="-1"><span class="sv">${I('tick','s14')}</span><div><div class="tt">${esc(f.title)}</div><div class="how">${esc(f.how)}</div><div class="meta"><span>Fixed at ${f.at}</span></div></div></article>`;

function consoleHtml(){const a=live(),e=nErr(),w=nWarn(),f=S.filt,fixable=a.filter(x=>x.fix&&!S.busy[x.id]);
  const shown=a.filter(x=>f==='all'||(f==='err'?x.sev==='error':x.sev==='warn'));
  const ign=S.list.filter(x=>S.ign.has(x.id));
  let body=shown.map(x=>issueHtml(x,'')).join('');
  if(!a.length)body=`<div class="empty"><b>${S.cleared.length||S.fixedLog.length?'All clear':'No issues'}</b>Every host reaches the journal and runs its release, and the installation is well.</div>`;
  else if(!shown.length)body=`<div class="empty"><b>No ${f==='err'?'errors':'warnings'}</b>Only ${f==='err'?'warnings':'errors'} are open.</div>`;
  if(S.cleared.length)body+=`<div class="grp">Cleared · ${S.cleared.length}</div>`+S.cleared.map(x=>issueHtml(x,'ok')).join('');
  if(S.fixedLog.length)body+=`<div class="grp">Fixed for you · today</div>`+S.fixedLog.map(fixedHtml).join('');
  if(ign.length)body+=`<div class="grp">Ignored · ${ign.length}<button data-unignall>Show them again</button></div>`+ign.map(x=>issueHtml(x,'dis')).join('');
  const rest=S.scen==='clears'&&a.length?`<button class="btn" data-clearrest>Clear the rest</button>`:'';
  const fixall=fixable.length>1?`<button class="btn" data-fixall>${I('wand','s14')}Fix all ${fixable.length}</button>`:'';
  return `<div class="scrim" data-scrim><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt" tabindex="-1">
    <div class="dh"><h2 id="dt">Issues</h2><span class="cnt">${a.length?`${a.length} open · newest first`:'none open'}</span><span class="sp"></span>${rest}${fixall}<button class="ibtn" data-close aria-label="Close the issue console" title="Close · Esc">${I('close','s14')}</button></div>
    ${a.length>3?`<div class="filt" role="group" aria-label="Show"><button data-f="all" aria-pressed="${f==='all'}">All ${a.length}</button><button data-f="err" aria-pressed="${f==='err'}">Errors ${e}</button><button data-f="warn" aria-pressed="${f==='warn'}">Warnings ${w}</button></div>`:''}
    <div class="db">${body}</div>
    <div class="df"><button class="sw" role="switch" aria-checked="${S.auto}" data-auto title="When the journal knows the remedy for a problem, it applies it itself instead of showing a warning"><span class="tr"></span>Fix known problems myself</button>${S.rules.length?`<span>· ${plural(S.rules.length,'auto-fix rule')}</span>`:''}<span class="sp"></span><span class="keys"><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Esc</kbd> closes</span></div></div></div>`}

function pickHtml(){const x=S.list.find(y=>y.id===S.pick.id);if(!x)return '';const sel=S.pick.to;
  return `<div class="pick" data-pickscrim><div class="pk" role="dialog" aria-modal="true" aria-labelledby="pt" tabindex="-1">
    <div class="ph"><h3 id="pt">Ask for help</h3><p>${esc(x.title)}. The agent gets the issue, its reason, its evidence and what was tried, in its chat.</p></div>
    <div class="opts" role="radiogroup" aria-label="Who helps">${AGENTS.map(([k,n,r,st])=>`<button class="opt" role="radio" aria-checked="${sel===n}" data-to="${n}"><span class="av">${k}</span><span><span class="nm">${n}</span><small>${r}</small></span><span class="st">${st}</span></button>`).join('')}
      <div class="sep"></div>
      <button class="opt" role="radio" aria-checked="${sel==='new'}" data-to="new"><span class="av">${I('plus','s13')}</span><span><span class="nm">A new agent for it</span><small>Claude Code · Opus · Work (Max) · it starts with this issue</small></span><span class="st"></span></button></div>
    <div class="note"><label for="pn">A note for it (optional)</label><textarea id="pn" placeholder="For example: it started after I moved the Mac to the new network."></textarea></div>
    <div class="pf"><button class="btn q" data-pickno>Cancel</button><button class="btn pri" data-picksend ${sel?'':'disabled'}>${sel==='new'?'Start it and send':'Send to '+esc(sel||'…')}</button></div></div></div>`}

function draw(){const fr=$('#frame');fr.className='frame'+(S.phone?' phone':'')+(S.dark?' dark':'');document.documentElement.classList.toggle('dark',S.dark);
  const db=$('.db'),sc=db?db.scrollTop:0;fr.innerHTML=shell();const db2=$('.db');if(db2)db2.scrollTop=sc;
  $('#scen').innerHTML=Object.entries(SCEN).map(([k,v])=>`<button data-v="${k}" aria-pressed="${S.scen===k}">${v[0]}</button>`).join('');
  $$('#look button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='dark')===S.dark)));
  $$('#width button').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.v==='phone')===S.phone)));
  $('#cap').innerHTML=`<b>${SCEN[S.scen][0]}.</b> ${SCEN[S.scen][1]}${S.phone?' At phone width the pill sits above the composer with only its count, and the console and the picker open as sheets from the bottom.':''}${S.scen==='none'||S.scen==='fixed'?'':` <button class="tb" data-before>${S.before?'Back to the console':'Show the layout before'}</button>`}${!S.open&&(S.scen==='none'||S.scen==='fixed')?' <button class="tb" data-showall>Open the console (⌘K “Show issues”)</button>':''}`;
  wire()}
function openDlg(){S.open=true;S.fresh=null;draw();const d=$('.dlg');if(d)d.focus()}
function closeDlg(){S.open=false;draw();const b=$('[data-bub]');if(b)b.focus()}
function focusOn(sel){const n=$(sel);if(n)n.focus()}
function wire(){
  const on=(s,f)=>$$(s).forEach(f);
  on('[data-bub]',b=>b.onclick=()=>S.open?closeDlg():openDlg());
  on('[data-close]',b=>b.onclick=closeDlg);
  on('[data-scrim]',sc=>{sc.onclick=e=>{if(e.target===sc)closeDlg()};
    sc.onkeydown=e=>{if(S.pick)return;if(e.key==='Escape'){e.preventDefault();if(S.confirm){S.confirm=null;draw();return}closeDlg()}
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&!e.target.closest('textarea')){const r=$$('.iss'),cur=document.activeElement.closest('.iss'),i=r.indexOf(cur);e.preventDefault();const n=r[(i+(e.key==='ArrowDown'?1:-1)+r.length)%r.length];if(n)n.focus()}}});
  on('[data-f]',b=>b.onclick=()=>{S.filt=b.dataset.f;draw();focusOn(`[data-f="${S.filt}"]`)});
  on('[data-ign]',b=>b.onclick=()=>{S.ign.add(b.dataset.ign);say('Ignored. It comes back when it changes.');draw();focusOn('.iss')});
  on('[data-unign]',b=>b.onclick=()=>{S.ign.delete(b.dataset.unign);draw()});
  on('[data-unignall]',b=>b.onclick=()=>{S.ign.clear();draw()});
  on('[data-fix]',b=>b.onclick=()=>runFix(b.dataset.fix));
  on('[data-fixall]',b=>b.onclick=()=>live().filter(x=>x.fix).forEach((x,i)=>later(i*300,()=>runFix(x.id))));
  on('[data-autofix]',b=>b.onclick=()=>{S.confirm=b.dataset.autofix;draw();focusOn('[data-autoyes]')});
  on('[data-autono]',b=>b.onclick=()=>{const id=S.confirm;S.confirm=null;draw();focusOn(`[data-autofix="${id}"]`)});
  on('[data-autoyes]',b=>b.onclick=()=>{const x=S.list.find(y=>y.id===b.dataset.autoyes);S.rules.push(x.fix.kind);
    /* Every open issue of the same kind is fixed by the new rule too. */
    S.list.filter(y=>y.fix&&y.fix.kind===x.fix.kind).forEach(y=>runFix(y.id,'by your auto-fix rule'))});
  on('[data-auto]',b=>b.onclick=()=>{S.auto=!S.auto;if(S.auto)live().filter(x=>x.fix).forEach((x,i)=>later(i*300,()=>runFix(x.id,'Fix known problems is on')));draw();focusOn('[data-auto]')});
  on('[data-help]',b=>b.onclick=()=>{S.pick={id:b.dataset.help,to:null};draw();focusOn('.opt')});
  on('[data-to]',b=>b.onclick=()=>{S.pick.to=b.dataset.to;const v=$('#pn')?$('#pn').value:'';draw();if(v)$('#pn').value=v;focusOn(`[data-to="${S.pick.to}"]`)});
  on('[data-pickscrim]',p=>{p.onclick=e=>{if(e.target===p)closePick()};p.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePick()}
    if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.classList.contains('opt')){e.preventDefault();const r=$$('.opt'),i=r.indexOf(e.target);r[(i+(e.key==='ArrowDown'?1:-1)+r.length)%r.length].focus()}}});
  on('[data-pickno]',b=>b.onclick=closePick);
  on('[data-picksend]',b=>b.onclick=()=>{const id=S.pick.id,to=S.pick.to==='new'?'Agent 4':S.pick.to;S.help[id]=to;S.pick=null;say(`Sent to ${to}`);draw();focusOn(`[data-iss="${id}"]`)});
  on('[data-copy]',b=>b.onclick=()=>{b.innerHTML=I('tick','s14')+'Copied';later(1400,draw)});
  on('[data-link]',b=>b.onclick=()=>say('Opens the Hosts page'));
  on('[data-chat]',b=>b.onclick=()=>say('Opens its chat'));
  on('[data-clearrest]',b=>b.onclick=()=>[...S.list].forEach((x,i)=>later(i*500,()=>clearOne(x.id,'the updater restarted the worker','15:3'+(3+i)))));
  on('[data-before]',b=>b.onclick=()=>{S.before=!S.before;draw()});
  on('[data-showall]',b=>b.onclick=openDlg)}
function closePick(){const id=S.pick&&S.pick.id;S.pick=null;draw();focusOn(`[data-help="${id}"]`)}
document.addEventListener('keydown',e=>{if(e.altKey&&e.shiftKey&&e.code==='KeyI'){e.preventDefault();S.open?closeDlg():openDlg()}});
$('.top').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!t.dataset.v)return;const g=t.parentElement.id,v=t.dataset.v;
  if(g==='scen'){S.scen=v;S.before=false;seed()}if(g==='look')S.dark=v==='dark';if(g==='width')S.phone=v==='phone';draw()});

$('#notes').innerHTML=[
  ['Where it comes from','Today AppSidebarLayout.vue (line 52) draws each string of installation.faults as a red line under the top bar. AppContext::installation() (app/Web/AppContext.php 193–205) fills them for the owner only, from InstallationFaults (the updater\'s faults file) and HostLinkAlarms (broken links and hosts on another release). Each one is a bare sentence, so they stack and push the page down.'],
  ['The pill','In the bottom-left corner of the content area, 16 px in, clear of the sidebar\'s account foot. Toasts stay bottom right, so the two never meet. It exists only while an issue is open and not ignored. Its mark is red with a triangle when any error is open, amber with a circle for warnings only; then the count, then the kinds in words. It pings once when a new issue arrives, which is announced politely. ⌥⇧I toggles the console. While the journal fixes something itself, the pill reads “Fixing …” with a spinner, then “Fixed · …” for 4 s.'],
  ['The console','The kit Dialog (lg), titled Issues, with “2 open · newest first”. Each issue shows the sentence, a source chip (a host, a host\'s release, the installation\'s updater or scheduler), when it began and how long ago, why, what to do (with its command), and its actions. With more than three issues there are filters for All, Errors and Warnings. Below the open issues come Cleared, Fixed for you (today) and Ignored. Esc or the scrim closes it and focus returns to the pill; ↑ ↓ move between issues.'],
  ['The actions','Fix (primary) runs the known remedy now and shows it working (“Running the install line on mac-1.home…”). Auto-fix asks once, in place: “From now on, whenever a host on an older release happens, the journal will run its install line again without asking”, then fixes every open issue of that kind. Ask for help opens the picker. Ignore hides the issue until it changes. Fix and Auto-fix appear only where the journal knows a remedy; an error without one offers what you can do yourself (Open Hosts, Copy the command), Ask for help and Ignore. With several remedies open, the head offers Fix all.'],
  ['Ask for help','A smaller dialog over the console: the main agents and running helpers, each with its state, then “A new agent for it” with the program, model and account it would start with, and an optional note. Send hands the agent the issue with its reason, evidence and what was tried, in its own chat. The issue then carries “Agent 1 is looking at it · open its chat” until it clears.'],
  ['Fix known problems myself','A setting, on by default, at the console\'s foot and in Settings. While it is on, a problem the journal knows the remedy for never waits as a warning: the journal applies the remedy itself and logs it under Fixed for you, with what it did and the result. Turning it off makes those problems wait with Fix and Auto-fix; each Auto-fix rule then keeps fixing its own kind. When a remedy fails, the issue opens as usual with the failure as its reason.'],
  ['Ignored and cleared','Ignore hides an issue for you until it changes (a new reason, a new release, or it heals and comes back), and folds it into Ignored with Show again. An issue that heals by itself greys out with a tick, reads “Cleared at … · why”, and stays in Cleared while the console is open. When none are left the pill reads All clear for 4 s, then fades out.'],
  ['Phone width','Below 760 px the sidebar is gone, so the pill sits 12 px from the left above the composer (at the bottom it would cover it), and shows only its mark and count. The console and the picker open as sheets from the bottom, without the key hints.'],
  ['What the code needs (for a worker)','A fault must become a record rather than a string. It needs a stable id (the host and its kind, so Ignore survives a reload), a severity, a source (type and name), since when, the sentence, why, what to do, its command, and its remedy when one is known (a command the journal can run: a host\'s install line, a container restart). HostLinkAlarms and InstallationFaults return that record. The journal needs a log of applied remedies, per-owner ignores with the fault\'s fingerprint, per-kind auto-fix rules, the setting, and an action that hands an issue to an agent. AppSidebarLayout drops the inline lines and mounts the pill and the console next to ToastRegion.']
].map(([t,x])=>`<div><b>${t}</b>${x}</div>`).join('');

seed();draw();
})();
