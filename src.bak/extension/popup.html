<!doctype html>
<meta charset="utf-8">
<title>Agent journal</title>
<style>
  :root { color-scheme: dark; }
  body { width: 220px; margin: 0; padding: 10px; background: #0e1013; color: #e6e8ec;
    font: 13px/1.45 -apple-system, system-ui, sans-serif; font-variant-ligatures: none; }
  button { width: 100%; margin: 0; padding: 8px 10px; border: 1px solid #3a4a8a; border-radius: 7px;
    background: #232a44; color: #e6e8ec; font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  button:hover { background: #2a3352; }
  kbd { padding: 1px 4px; border: 1px solid #2a2d33; border-radius: 4px; background: #171a1f;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9aa0a8; }
  .said { margin: 8px 0 0; color: #d98a8a; font-size: 11px; min-height: 0; }
  .said:empty { display: none; }
</style>
<button id="chat"><span>Open the chat here</span><kbd>Alt+J</kbd></button>
<div class="said" id="said"></div>
<script src="popup.js"></script>
