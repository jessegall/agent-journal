[pytest]
testpaths = tests src/features
pythonpath = src
python_files = test_*.py test.py
norecursedirs = tests/live .git __pycache__ .venv
addopts = -p no:cacheprovider --import-mode=importlib -n 3 --dist worksteal -m "not lessons and not slow"
timeout_method = thread
markers =
    xdist_group(name): keep these tests on one worker
    lessons: replays every lesson; run on their own with -m lessons
    slow: the installer and the viewer, about ten minutes; run on their own with -m slow, when asked or when a release is cut
