services:
    app:
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
        ports:
            - '127.0.0.1:${APP_PORT:-54700}:8000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # The websocket server; the app and the queue worker publish to it at reverb:8080 (REVERB_HOST, REVERB_PORT).
    reverb:
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);']
            interval: 5s
            timeout: 5s
            retries: 10
        depends_on:
            redis:
                condition: service_healthy

    # Runs queued jobs, broadcasts among them, with the same code, environment and queue connection as the app.
    queue:
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--backoff=5']
        # A worker listens on no port; the image's web server check does not apply.
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        restart: unless-stopped
        image: postgres:18-alpine
        # The journal's data lives on SSD-backed volumes, so a random page read costs nearly what a sequential one does;
        # at the default of 4 the planner prefers a full scan over the trigram indexes the library search needs.
        command: ['postgres', '-c', 'random_page_cost=1.1']
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        restart: unless-stopped
        image: redis:8-alpine
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
    redis-data:
