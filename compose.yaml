services:
    app:
        restart: unless-stopped
        # A server has no source folder mounted over the image (compose.override.yaml is the Mac's), so the
        # journal's settings come from .env as the environment; the sign-in runner never gets them.
        env_file:
            - path: .env
              required: false
        # The one build of the application image; reverb, queue, scheduler and ticker run the same image by its name.
        image: ${COMPOSE_PROJECT_NAME}-app
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
            target: app
            args:
                VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
                VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
                VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
                VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-}
        environment:
            # The most worker threads FrankenPHP grows to under load: about one per two active actors. The threads
            # started at boot (two per processor) are the floor and are never removed.
            OCTANE_MAX_THREADS: ${OCTANE_MAX_THREADS:-32}
            # Where agents run (doc 61): local on this machine, or contained in the agent daemon's containers.
            AGENTS_ARRANGEMENT: ${AGENTS_ARRANGEMENT:-local}
            AGENTS_INSTALLATION_NAME: ${AGENTS_INSTALLATION_NAME:-journal}
            # Where the agent host holds the profiles a contained manifest names (.docker/helper/seccomp-agent.json).
            AGENTS_SECURITY_PROFILES: /etc/journal/security
        # Healthy once the journal itself answers, not only its web server: an install switches to a new app container
        # only then.
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8000/up']
            interval: 3s
            timeout: 5s
            retries: 3
            start_period: 60s
        networks:
            - default
            - journal-api
        # The signed host releases install lines hand out (files.places.releases); the updater publishes one per install.
        volumes:
            - releases:/app/storage/app/releases
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # The journal's front door (.docker/web/Caddyfile): it holds the published port and passes requests to the app
    # containers, so an install can start the new app beside the old one and stop the old one with no request lost.
    web:
        restart: unless-stopped
        image: ${COMPOSE_PROJECT_NAME}-web
        build:
            context: .
            dockerfile: .docker/web/Dockerfile
        ports:
            - '127.0.0.1:${APP_PORT:-54700}:8000'
        depends_on:
            - app

    # The websocket server; the app and the queue worker publish to it at reverb:8080 (REVERB_HOST, REVERB_PORT).
    reverb:
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        image: ${COMPOSE_PROJECT_NAME}-app
        pull_policy: never
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);']
            interval: 5s
            timeout: 5s
            retries: 10
        depends_on:
            redis:
                condition: service_healthy

    # Runs queued jobs, broadcasts among them, with the same code, environment and queue connection as the app.
    queue:
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        image: ${COMPOSE_PROJECT_NAME}-app
        pull_policy: never
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--backoff=5']
        # A worker listens on no port; the image's web server check does not apply.
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Runs the scheduled commands, such as the minute account reconciliation, with the queue's code and environment.
    scheduler:
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        image: ${COMPOSE_PROJECT_NAME}-app
        pull_policy: never
        command: ['php', 'artisan', 'schedule:work']
        # The scheduler listens on no port; the image's web server check does not apply.
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Runs the engine: one pass a second while it owns the engine's advisory lock, on its own pinned database session.
    ticker:
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        image: ${COMPOSE_PROJECT_NAME}-app
        pull_policy: never
        command: ['php', 'artisan', 'engine:tick']
        # The ticker listens on no port; the image's web server check does not apply.
        healthcheck:
            disable: true
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    # The share service: the sharing supervisor with the share-only listener and the gateway programs. It publishes no
    # port; Tunler or ngrok forward to the listener on loopback. Its configuration and credential store live on a private
    # volume; no home folder or personal gateway settings are mounted.
    share:
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        build:
            context: .
            dockerfile: .docker/app/Dockerfile
            target: share
        volumes:
            - sharing-data:/app/storage/sharing
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'sharing:health']
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        restart: unless-stopped
        image: postgres:18-alpine
        # The journal's data lives on SSD-backed volumes, so a random page read costs nearly what a sequential one does;
        # at the default of 4 the planner prefers a full scan over the trigram indexes the library search needs.
        # Rebuilding a test database drops every table in one transaction, one lock each, and the parallel suite
        # rebuilds six at once; the default of 64 locks per transaction runs out of shared memory there.
        command: ['postgres', '-c', 'random_page_cost=1.1', '-c', 'max_locks_per_transaction=512']
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        restart: unless-stopped
        image: redis:8-alpine
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # The contained profile (doc 61): on a server, every agent runs in a container of a separate Docker daemon that
    # holds nothing else. A plain docker compose up on the Mac starts none of these services.
    #
    # The daemon is rootless Docker-in-Docker by default (AGENT_DAEMON_IMAGE docker:28-dind-rootless): it needs the
    # relaxed seccomp and AppArmor profiles below for its own user namespaces, and nothing more. Where the server has
    # Sysbox, set AGENT_DAEMON_RUNTIME=sysbox-runc and the same daemon runs with no relaxed profile. It never gets the
    # server's own Docker socket.
    # Mounts the accounts volume first, from the runner image, so the volume starts with that image's folder: owned by
    # 10001, the sign-in service's user, mode 0700. A volume first mounted by the agent daemon would start root-owned.
    # The accounts root is root's and not writable by anyone else, so the program's user can neither replace one
    # account's folder nor make another: the agent host makes and removes each account folder as root (doc 78
    # revision 2, Startup and ownership). This also settles a volume an earlier version made as the program's user.
    accounts-volume:
        profiles: [contained]
        restart: 'no'
        image: ${RUNNER_IMAGE:-journal-runner:unset}
        user: '0:0'
        command: ['sh', '-c', 'chown 0:0 /srv/journal/accounts && chmod 0755 /srv/journal/accounts']
        volumes:
            - accounts-data:/srv/journal/accounts
        network_mode: none

    agent-docker:
        profiles: [contained]
        restart: unless-stopped
        image: ${AGENT_DAEMON_IMAGE:-docker:28-dind-rootless}
        runtime: ${AGENT_DAEMON_RUNTIME:-runc}
        # A host that restricts unprivileged user namespaces loads .docker/helper/apparmor-agent-daemon and names it.
        security_opt:
            - seccomp=unconfined
            - apparmor=${AGENT_DAEMON_APPARMOR:-unconfined}
            # The daemon mounts a fresh /proc for each agent container, which the kernel refuses while this
            # container's own /proc has paths masked over it.
            - systempaths=unconfined
        # Rootless Docker-in-Docker makes its own network through a TUN device: never privileged, never the
        # server's socket.
        devices:
            - /dev/net/tun:/dev/net/tun
        depends_on:
            accounts-volume:
                condition: service_completed_successfully
        environment:
            DOCKER_HOST: unix:///run/agent-docker/docker.sock
        # Naming dockerd skips the image's default listeners, so the daemon listens on its socket alone, never on TCP.
        # The socket's group is group 1000 outside, the one its clients join: group 0 inside the rootless daemon's user
        # namespace is that group, while a rootful daemon under sysbox-runc (ID-mapped volumes) names 1000 itself.
        command: ['dockerd', '--host=unix:///run/agent-docker/docker.sock', '--group=${AGENT_DAEMON_SOCKET_GROUP:-0}']
        volumes:
            # The daemon's own data: the rootless image keeps it under its user's home, a rootful one in /var/lib/docker.
            - agent-docker-data:${AGENT_DAEMON_DATA:-/home/rootless/.local/share/docker}
            - agent-docker-socket:/run/agent-docker
            - accounts-data:/srv/journal/accounts
            # The operator's server folders, one per environment, bound as workspaces after daemon-side checks
            # (AGENTS_WORKSPACES_FOLDER in .env; unset leaves an empty folder, so no operator folder exists).
            - ${AGENTS_WORKSPACES_FOLDER:-./.docker/helper/no-workspaces}:/srv/journal/workspaces
        networks:
            - agent-egress
        healthcheck:
            test: ['CMD', 'docker', '--host=unix:///run/agent-docker/docker.sock', 'info']
            interval: 5s
            timeout: 5s
            retries: 30

    # Loads the two pinned images into the agent daemon from the files .docker/helper/build.sh saved in images/ once it
    # answers, and fails when a loaded image's id differs from the pin docs/accounts/docker-images.json records; a
    # running agent never pulls an image.
    agent-images:
        profiles: [contained]
        restart: 'no'
        image: ${AGENT_DAEMON_IMAGE:-docker:28-dind-rootless}
        depends_on:
            agent-docker:
                condition: service_healthy
        environment:
            DOCKER_HOST: unix:///run/agent-docker/docker.sock
            AGENT_IMAGE: ${AGENT_IMAGE:-}
            RUNNER_IMAGE: ${RUNNER_IMAGE:-}
        entrypoint: ['/bin/sh', '-c']
        command:
            - |
              set -eu
              if [ -z "$$AGENT_IMAGE" ] || [ -z "$$RUNNER_IMAGE" ]; then
                  echo "Name AGENT_IMAGE and RUNNER_IMAGE by image id in .env." >&2
                  exit 1
              fi
              # The daemon keeps the two pinned images and those a container still runs on, so an earlier build never fills
              # its disk and an agent at work keeps its image; that image goes on a later run, once its container is gone.
              for held in $$(docker image ls --quiet --no-trunc); do
                  if [ "$$held" = "$$AGENT_IMAGE" ] || [ "$$held" = "$$RUNNER_IMAGE" ]; then
                      continue
                  fi
                  if [ -n "$$(docker container ls --all --quiet --filter "ancestor=$$held")" ]; then
                      continue
                  fi
                  docker image rm --force "$$held" >/dev/null
              done
              docker image prune --force >/dev/null
              # The archives are loaded only when a pinned image is missing.
              if ! docker image inspect "$$AGENT_IMAGE" "$$RUNNER_IMAGE" >/dev/null 2>&1; then
                  for archive in /images/*.tar; do
                      docker load --quiet --input "$$archive"
                  done
              fi
              for image in "$$AGENT_IMAGE" "$$RUNNER_IMAGE"; do
                  loaded="$$(docker image inspect --format '{{.Id}}' "$$image" 2>/dev/null || true)"
                  if [ "$$loaded" != "$$image" ]; then
                      echo "The agent daemon holds no image $$image: build it and copy images/ here." >&2
                      exit 1
                  fi
              done
        volumes:
            - agent-docker-socket:/run/agent-docker
            - ./images:/images:ro
        networks:
            - agent-egress

    # Enrolls the contained agent host once: it reads the secret agents:host-enroll printed from the compose secret,
    # never from the environment, and does nothing when host-state already holds the same enrollment.
    agent-host-enroll:
        profiles: [contained]
        restart: 'no'
        image: ${RUNNER_IMAGE:-journal-runner:unset}
        user: '10001:10001'
        command:
            - journal-agent
            - enroll
            - --journal=http://app:8000
            - --host=${AGENTS_HOST_ID:-}
            - --state=/var/lib/journal-host
            - --secret-file=/run/secrets/journal_host_secret
        secrets:
            - journal_host_secret
        volumes:
            - host-state:/var/lib/journal-host
        networks:
            - journal-api
        depends_on:
            app:
                condition: service_started

    # The contained agent host: it claims the journal's starts and runs every agent in a container of the agent
    # daemon, from the two pinned images. It publishes no port, never sees the server's Docker socket and holds no
    # secret in its environment; PHP reaches its start socket through the host-start-socket volume.
    agent-host:
        profiles: [contained]
        restart: unless-stopped
        image: ${RUNNER_IMAGE:-journal-runner:unset}
        user: '10001:10001'
        group_add: ['1000']
        command:
            - journal-agent
            - serve
            - --arrangement=contained
            - --state=/var/lib/journal-host
            - --start-socket-dir=/run/journal-start
            - --docker=unix:///run/agent-docker/docker.sock
            - --installation-name=${AGENTS_INSTALLATION_NAME:-journal}
            - --agent-image=${AGENT_IMAGE:-}
            - --runner-image=${RUNNER_IMAGE:-}
            - --seccomp-profile=/etc/journal/security/seccomp-agent.json
            - --protected-trial=${AGENTS_PROTECTED_ACCOUNT_TRIAL:-}
        # Each environment's deploy key, for its workspace clone (secrets below); only agent-host mounts them.
        # secrets:
        #     - deploy_key_main
        volumes:
            - host-state:/var/lib/journal-host
            - host-start-socket:/run/journal-start
            - agent-docker-socket:/run/agent-docker
            # The seccomp profile agent containers run under, read by the Docker client (docs/accounts/host-protection.md).
            - ./.docker/helper/seccomp-agent.json:/etc/journal/security/seccomp-agent.json:ro
        networks:
            - journal-api
        depends_on:
            agent-host-enroll:
                condition: service_completed_successfully
            agent-images:
                condition: service_completed_successfully
        healthcheck:
            test: ['CMD', 'test', '-S', '/run/journal-start/start.sock']
            interval: 5s
            timeout: 5s
            retries: 30

    # The sign-in runner as an always-on service (doc 61): it runs every sign-in, check and cleanup of the
    # journal's accounts in /accounts, reaches the app on journal-api and the providers only through egress, and
    # resolves neither postgres nor redis. Its host secret comes from the compose secret, never the environment.
    accounts:
        profiles: [contained]
        restart: unless-stopped
        image: ${RUNNER_IMAGE:-journal-runner:unset}
        user: '10001:10001'
        command: ['php', '/app/artisan', 'accounts:run-sign-ins']
        environment:
            # One path for the accounts volume everywhere: the journal names an attempt's folder under this root, and
            # the agent daemon mounts the same volume at the same path. The journal's .env sets ACCOUNTS_ROOT to it.
            ACCOUNTS_ROOT: /srv/journal/accounts
            JOURNAL_URL: http://app:8000
            JOURNAL_HOST_SECRET_FILE: /run/secrets/journal_host_secret
            AGENTS_HOST_START_SOCKET: /run/journal-start/start.sock
            AGENTS_ARRANGEMENT: contained
            AGENTS_INSTALLATION_NAME: ${AGENTS_INSTALLATION_NAME:-journal}
            JOURNAL_EGRESS_PROXY: http://egress:3128
        secrets:
            - journal_host_secret
        volumes:
            - accounts-data:/srv/journal/accounts
            - host-start-socket:/run/journal-start
        networks:
            - journal-api
            - egress-internal
        depends_on:
            agent-host:
                condition: service_healthy
            egress:
                condition: service_healthy
        healthcheck:
            # The runner image has no pgrep: the process is looked for by its command line.
            test: ['CMD-SHELL', 'grep -qs accounts:run-sign-ins /proc/[0-9]*/cmdline']
            interval: 10s
            timeout: 5s
            retries: 6

    # The allow-list proxy: CONNECT on 443 to the domains in .docker/egress/allowed-domains.txt and nothing else.
    # It is the one contained service with a way out.
    egress:
        profiles: [contained]
        restart: unless-stopped
        image: ${EGRESS_PROXY_IMAGE:-ubuntu/squid:6.13-25.04_beta}
        volumes:
            - ./.docker/egress/squid.conf:/etc/squid/squid.conf:ro
            - ./.docker/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
        networks:
            - egress-internal
            - default
        healthcheck:
            test: ['CMD-SHELL', 'squidclient -h 127.0.0.1 -p 3128 mgr:info >/dev/null 2>&1 || bash -c "exec 3<>/dev/tcp/127.0.0.1/3128"']
            interval: 10s
            timeout: 5s
            retries: 6

    updater:
        profiles: [updater]
        build:
            context: .
            dockerfile: .docker/updater/Dockerfile
        restart: unless-stopped
        environment:
            JOURNAL_ROOT: ${JOURNAL_ROOT:-}
            JOURNAL_BRANCH: ${JOURNAL_BRANCH:-version-6}
            JOURNAL_REPOSITORY: ${JOURNAL_REPOSITORY:-https://github.com/jessegall/agent-journal.git}
        working_dir: ${JOURNAL_ROOT:-/journal}
        volumes:
            - .:${JOURNAL_ROOT:-/journal}
            - /var/run/docker.sock:/var/run/docker.sock
            - updater-mirror:/var/lib/journal-updater

volumes:
    releases:
    updater-mirror:
    postgres-data:
    redis-data:
    sharing-data:
    agent-docker-data:
    # The agent daemon's socket folder, in memory and owned by the daemon's rootless user (1000): a plain named volume
    # starts root-owned, where the rootless daemon cannot make its socket. Its clients join group 1000 to reach it.
    agent-docker-socket:
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: 'uid=1000,gid=1000,mode=0750'
    accounts-data:
    # The contained agent host's enrollment and start records, kept across restarts so it reconciles from them.
    host-state:
    # The folder of the contained host's start socket, owned by 10001 as the runner image makes it.
    host-start-socket:

secrets:
    # The host secret agents:host-enroll printed, in a file only the operator writes (secrets/README.md).
    journal_host_secret:
        file: ./secrets/journal_host_secret
    # An environment's deploy key, read only by agent-host, which hands it to the one-shot clone container on standard
    # input; it never reaches app or an agent container. Add one per environment and name it in agent-host's secrets.
    # deploy_key_main:
    #     file: ./secrets/deploy_key_main

networks:
    # The agent daemon's own network, shared with no app, database or cache container.
    agent-egress:
    # The internal network the app shares with the contained agent host and the sign-in service; it reaches no
    # outside address.
    journal-api:
        internal: true
    # The sign-in service's network to the egress proxy; it reaches no outside address itself.
    egress-internal:
        internal: true
