# The journal on a server: docker compose up -d in this folder, after filling in .env.
# Needs a Linux server with Docker and the compose plugin, ports 80 and 443 open, and a DNS name pointing at it.
name: agent-journal

services:
  journal:
    image: ${JOURNAL_IMAGE:-ghcr.io/jessegall/agent-journal:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ${JOURNAL_ENV_FILE:-.env}
    volumes:
      - journal:/data
    expose:
      - "8440"
    mem_limit: ${JOURNAL_MEMORY:-4g}
    pids_limit: 1024
    stop_grace_period: 30s
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - journal
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      JOURNAL_ADDRESS: ${JOURNAL_ADDRESS:?set JOURNAL_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging: *logs
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backup:
    image: restic/restic:0.17.3
    restart: unless-stopped
    env_file: ${JOURNAL_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
    volumes:
      - journal:/data:ro
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_FOLDER:-./backups}:/backups
    mem_limit: 512m
    logging: *logs

  restore:
    image: restic/restic:0.17.3
    profiles: [restore]
    env_file: ${JOURNAL_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "-c", 'find /data -mindepth 1 -delete && restic restore "$$SNAPSHOT" --target / --host journal']
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      SNAPSHOT: ${SNAPSHOT:-latest}
    volumes:
      - journal:/data
      - ${BACKUP_FOLDER:-./backups}:/backups

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --cleanup --interval 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    logging: *logs

volumes:
  journal:
  caddy-data:
  caddy-config:
