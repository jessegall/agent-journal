# The journal on a server: docker compose up -d in this folder, after filling in .env.
# Needs a Linux server with Docker and the compose plugin, ports 80 and 443 open, and a DNS name pointing at it.
name: agent-journal

services:
  # Started only by the updater, on the digest it verified; a plain docker compose up never runs an unchecked image.
  journal:
    image: ${JOURNAL_IMAGE:-ghcr.io/jessegall/agent-journal:unverified}
    profiles: [journal]
    restart: unless-stopped
    # Only what the journal and its agents use: backup credentials stay on the backup service.
    environment:
      JOURNAL_ADDRESS: ${JOURNAL_ADDRESS:?set JOURNAL_ADDRESS in .env}
      GIT_REPOSITORY: ${GIT_REPOSITORY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_NAME: ${GIT_NAME:-}
      GIT_EMAIL: ${GIT_EMAIL:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - journal:/data
    expose:
      - "8440"
    mem_limit: ${JOURNAL_MEMORY:-4g}
    pids_limit: 1024
    # Root in the container only starts the two users, so it keeps nothing but switching to them.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    # caddy 2.8; the digest is what runs, so a moved tag changes nothing.
    image: caddy@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      JOURNAL_ADDRESS: ${JOURNAL_ADDRESS:?set JOURNAL_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging: *logs

  backup:
    # restic 0.17.3
    image: restic/restic@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a
    restart: unless-stopped
    env_file: ${JOURNAL_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
    volumes:
      - journal:/data:ro
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_FOLDER:-./backups}:/backups
    mem_limit: 512m
    logging: *logs

  restore:
    # restic 0.17.3
    image: restic/restic@sha256:8f5a62b422a2cb1277ea0dd6e826fe1acf649e5b9f02d60e5268d5fd1976255a
    profiles: [restore]
    env_file: ${JOURNAL_ENV_FILE:-.env}
    entrypoint: ["/bin/sh", "/restore.sh"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      SNAPSHOT: ${SNAPSHOT:-latest}
    volumes:
      - journal:/data
      - ./restore-into-volume.sh:/restore.sh:ro
      - ${BACKUP_FOLDER:-./backups}:/backups

  # Updates the journal only to an image cosign verifies was signed by this repository's release workflow.
  updater:
    build:
      context: ..
      dockerfile: docker/updater.Dockerfile
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-agent-journal}
      JOURNAL_ADDRESS: ${JOURNAL_ADDRESS:?set JOURNAL_ADDRESS in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/compose:ro
      - journal:/data
    mem_limit: 128m
    logging: *logs

  # Updates nothing while Caddy is pinned by digest; a newer Caddy comes from changing its digest above. The journal is left to the updater, which checks its signature.
  watchtower:
    # watchtower 1.7.1
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    restart: unless-stopped
    command: --label-enable --cleanup --interval 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    logging: *logs

volumes:
  journal:
  caddy-data:
  caddy-config:
