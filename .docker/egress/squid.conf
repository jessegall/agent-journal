# The sign-in service's only way out (doc 61, decision 5): CONNECT on 443 to the allow-listed domains, nothing else.
# No plain HTTP, no other port, no cache, and the log keeps the host a tunnel went to, never a path or a query.
http_port 3128

acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow CONNECT allowed
http_access deny all

cache deny all
logformat hostonly %ts %>a %Ss/%03>Hs %rm %>rd
# Squid writes as its own user, which may not open the container's standard streams.
access_log stdio:/var/log/squid/access.log hostonly
cache_log /var/log/squid/cache.log
pid_filename none
