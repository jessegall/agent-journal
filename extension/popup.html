<!doctype html>
<meta charset="utf-8">
<title>Journal pointer</title>
<style>
  :root { color-scheme: dark; }
  body { width: 248px; margin: 0; padding: 12px; background: #0e1013; color: #e6e8ec;
    font: 13px/1.45 -apple-system, system-ui, sans-serif; font-variant-ligatures: none; }
  h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  p { margin: 0 0 10px; color: #9aa0a8; font-size: 11.5px; }
  button { width: 100%; margin-bottom: 6px; padding: 7px 10px; border: 1px solid #2a2d33;
    border-radius: 7px; background: #171a1f; color: #e6e8ec; font: inherit; cursor: pointer; }
  button:hover { background: #1e222a; }
  button.go { border-color: #3a4a8a; background: #232a44; }
  label { display: block; margin: 8px 0 4px; color: #9aa0a8; font-size: 11px; }
  select { width: 100%; padding: 6px; border: 1px solid #2a2d33; border-radius: 6px;
    background: #171a1f; color: #e6e8ec; font: inherit; }
  .where { margin-top: 10px; color: #6b6e76; font-size: 10.5px; word-break: break-all; }
  kbd { padding: 1px 4px; border: 1px solid #2a2d33; border-radius: 4px; background: #171a1f;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
</style>
<h1>Journal pointer</h1>
<p>Point at anything on the page and the agent is told what you meant, with a picture of it.</p>
<button class="go" id="point">Point at an element <kbd>Alt+P</kbd></button>
<button id="chat">Open the chat <kbd>Alt+J</kbd></button>
<label for="env">Environment</label>
<select id="env"></select>
<div class="where" id="where">Looking for the viewer…</div>
<script src="popup.js"></script>
