<!doctype html>
<meta charset="utf-8">
<title>Agent journal</title>
<style>
  :root { color-scheme: dark; }
  body { width: 258px; margin: 0; padding: 12px; background: #0e1013; color: #e6e8ec;
    font: 13px/1.45 -apple-system, system-ui, sans-serif; font-variant-ligatures: none; }
  h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  p { margin: 0 0 10px; color: #9aa0a8; font-size: 11.5px; }
  button { width: 100%; margin-bottom: 6px; padding: 7px 10px; border: 1px solid #2a2d33;
    border-radius: 7px; background: #171a1f; color: #e6e8ec; font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  button:hover { background: #1e222a; }
  button.go { border-color: #3a4a8a; background: #232a44; }
  label { display: block; margin: 8px 0 4px; color: #9aa0a8; font-size: 11px; }
  select { width: 100%; padding: 6px; border: 1px solid #2a2d33; border-radius: 6px;
    background: #171a1f; color: #e6e8ec; font: inherit; }
  select:disabled { opacity: .5; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 10px; color: #6b6e76; font-size: 10.5px; }
  .foot button { width: auto; margin: 0; padding: 3px 7px; font-size: 10.5px; }
  .said { margin-top: 8px; color: #9aa0a8; font-size: 11px; min-height: 15px; }
  .said.bad { color: #d98a8a; }
  .said.good { color: #8ad1a0; }
  kbd { padding: 1px 4px; border: 1px solid #2a2d33; border-radius: 4px; background: #171a1f;
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #9aa0a8; }
</style>
<h1>Agent journal</h1>
<p>Point at anything on the page and the agent is told what you meant, with a picture of it.</p>
<button class="go" id="point"><span>Point at an element</span><kbd>Alt+P</kbd></button>
<button id="chat"><span>Open the chat here</span><kbd>Alt+J</kbd></button>
<label for="journal">Journal</label>
<select id="journal"></select>
<label for="env">Environment</label>
<select id="env"></select>
<button id="follow" hidden>Let the chat follow you on every page</button>
<div class="said" id="said">Looking for journals…</div>
<div class="foot">
  <button id="again">Look again</button>
  <button id="test">Send a test message</button>
</div>
<script src="popup.js"></script>
