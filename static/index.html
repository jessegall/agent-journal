  /* the agent's note on a handled comment sits under it, set in a little, so it reads as the answer */
  .comment-card.comment-reply { margin-left: 14px; background: transparent; border-style: dashed; }
  .linked a { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text); }
  .linked a:last-child { border-bottom: none; }
  .linked a:hover { color: var(--accent-text); }
  /* a web address inside text stays part of the sentence, not a row of a linked list */
  .linked a.autolink, a.autolink { display: inline; padding: 0; border: none; color: var(--accent-text); overflow-wrap: anywhere; }
  /* A PILL IS NOT A ROW OF THE LIST IT SITS IN. `.linked a` makes every link a flex row with a rule
     under it, which a to-do named inside a reply's prose is not: it is a word in a sentence. */
  .linked a.row-pill { display: inline; padding: 0 4px; border: 1px solid var(--border-2); border-bottom-width: 1px; }
  .linked a.autolink:hover, a.autolink:hover { color: var(--text); text-decoration: underline; }
  .linked .answer { color: var(--text-3); }

  /* compose: the inbox's message box and a question's answer box */
  .compose-wrap { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chat > .list { min-height: 0; }
  .compose-wrap.at-bottom { border-bottom: 0; border-top: 1px solid var(--border); }
  .compose { display: flex; flex-direction: column; gap: 8px; }
  /* the BOX is the bordered surface, not the textarea: attachments belong inside it, the way the
     quick menu already shows them, rather than hanging underneath as a separate row */
  /* NOT RESIZED BY HAND: it grows with what is typed, and a corner grip that fights that is one
     control too many in the corner of a chat box. */
  .box-area { width: 100%; min-height: 72px; resize: none; outline: none; padding: 9px 11px;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--text); font: inherit; font-size: 13px; line-height: 1.55; }
  /* answering where you are reading: the design's taller box, so a real answer has room */
  .answer-here .box-area { min-height: 86px; }
  .box-area::placeholder { color: var(--text-3); }
  /* what a comment is ABOUT: shown above the field, never typed into — the box is for your own words */
  .compose-quote { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: 8px; background: var(--raised); }
  .compose-quote-label { font-size: 11px; color: var(--text-3); }
  .compose-quote-text { font-size: 12.5px; line-height: 1.5; color: var(--text-2); max-height: 120px; overflow-y: auto; }
  .compose-quote-text p { margin: 0; }
  .compose-quote-text p + p { margin-top: 4px; }
  .compose-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hint { color: var(--text-3); font-size: 12px; }
  .primary { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 500; }
  .primary:disabled { opacity: .45; cursor: default; }
  .compose .error { padding: 0; }
  .option.picked { box-shadow: inset 0 0 0 1px rgba(99, 132, 255, .8); background: rgba(99, 132, 255, .12); color: var(--text); }
  .option-save { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  /* an option's own explanation and code example, under its label */
  .option-description { display: block; margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--text-2); white-space: normal; }
  .option-code { display: block; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    line-height: 1.5; white-space: pre; overflow-x: auto; text-align: left; }
  /* the last option is a custom answer: picking it opens a text box inside the option */
  .option-custom { display: block; }
  .option-custom textarea { box-sizing: border-box; width: 100%; min-height: 64px; margin-top: 8px; resize: vertical; padding: 7px 10px;
    border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: 13px; line-height: 1.5; }
  .option-custom textarea:focus { outline: none; border-color: var(--accent); }
  .option.locked { cursor: default; opacity: 1; }
  .option.locked:not(.chosen) { color: var(--text-2); }
  .option-pick { display: block; margin: -9px -12px 7px; padding: 3px 12px; border-radius: 7px 7px 0 0; font-size: 10px;
    font-weight: 500; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); background: rgba(94, 100, 201, .14); }
  .prio-wrap { position: relative; }
  .prio-current { display: inline-flex; align-items: center; gap: 6px; margin: -3px -6px; padding: 3px 6px; border: none;
    border-radius: 6px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .prio-current:hover:not(:disabled) { background: var(--hover); }
  .prio-current .ico, .prio-option .ico { width: 14px; height: 14px; }
  .prio-menu { position: absolute; left: -6px; top: calc(100% + 6px); z-index: 20; min-width: 150px; padding: 4px;
    display: flex; flex-direction: column; background: var(--side); border: 1px solid var(--border-2); border-radius: 8px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45); }
  .prio-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: none; border-radius: 5px;
    background: none; color: var(--text-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .prio-option:hover { background: var(--hover); color: var(--text); }
  .prio-option.on { color: var(--text); background: var(--sel); }
  .linked-q { border-bottom: 1px solid var(--border); }
  .linked-q:last-child { border-bottom: none; }
  .linked .linked-q a { border-bottom: none; }
  .question-answer.compact { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 12px 24px; }
  .compose-files { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; }
  .compose-files .chip { margin: 0; }
  .chip-x { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 0 0 0 4px; font-size: 13px; }
  /* the paperclip sits inside the message box, top right; the text keeps clear of it */
  .compose-box { position: relative; display: flex; flex-direction: column;
    background: var(--raised); border: 1px solid var(--border-2); border-radius: 8px; }
  .compose-box:focus-within { border-color: var(--accent); }
  .compose-box.attachable .box-area { padding-right: 46px; }
  .compose-attach { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; display: flex; align-items: center;
    justify-content: center; border-radius: 6px; color: var(--text-2); background: transparent; cursor: pointer; }
  .compose-attach:hover { background: var(--hover); color: var(--text); }
  .compose-attach .ico { width: 20px; height: 20px; }

  /* actions on a resource, and the small forms they open */
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .action-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border-2); background: transparent; color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
  .btn:hover, .btn.on { background: var(--hover); color: var(--text); }
  .btn.toolbar-btn { height: 28px; padding: 0 11px; border-radius: 7px; border-color: #2f3136; color: #a9acb3; font-size: 12.5px; white-space: nowrap; }
  .btn.toolbar-btn:hover { color: var(--text); }
  .panel-top .icon-btn .ico { width: 14px; height: 14px; }
  .btn.flush { border-color: transparent; }
  /* a New button: flush, with a plus drawn before its label */
  .btn.new { height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid rgba(94, 100, 201, .5); background: rgba(94, 100, 201, .16); color: #c3c7fb; font-weight: 500; }
  .btn.new:hover { background: rgba(94, 100, 201, .28); color: #c3c7fb; }
  .btn.danger { color: var(--danger); }
  .action-form { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--border-2); border-radius: 8px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; color: var(--text-3); }
  .input { height: 30px; padding: 0 9px; background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .input:focus { border-color: var(--accent); }
  .form-buttons { display: flex; gap: 6px; }
  .primary.danger-fill { background: var(--danger); color: #1a0f0d; }
  .setting .toggle { margin-left: 0; align-self: flex-start; }
  /* the results scroll under the bar rather than taking it with them */
  .search-page { max-width: 900px; }
  .search-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px;
    margin: -28px -32px 0; padding: 20px 32px 14px; background: var(--bg);
    border-bottom: 1px solid var(--border); }
  .search-input { flex: 1; height: 34px; }
  .search-bar .toggle { margin-left: 0; }
  .searchrow, .hitrow { display: grid; gap: 12px; }
  .stack { min-width: 0; }
  .searchrow { grid-template-columns: 72px 44px minmax(0, 1fr); }
  .hitrow { grid-template-columns: 52px 48px minmax(0, 1fr); align-items: start; }
  .searchrow .tag, .hitrow .tag { text-align: left; }
  .hit { white-space: normal; overflow-wrap: anywhere; }
  mark { background: rgba(94, 100, 201, .35); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option { text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--raised);
    color: var(--text); font-size: 13px; line-height: 1.45; }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option.chosen { border-color: var(--accent); background: rgba(94, 100, 201, .18); }
  .setting { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; }

  /* markdown, rendered by app.js */
  .md > :first-child { margin-top: 0; }
  .md :is(h1, h2, h3, h4, h5, h6) { font-size: 13.5px; font-weight: 600; color: var(--text); margin: 1.2em 0 .4em; }
  .md p { margin: .6em 0; }
  .md ul, .md ol { margin: .4em 0 .8em; padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md code { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: .05em .35em;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .md pre code { background: none; border: none; padding: 0; }

  /* a doc's files */
  .files { display: flex; flex-direction: column; gap: 4px; }
  .file-row, .file-folder summary { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; color: var(--text); cursor: pointer; }
  .file-row:hover, .file-folder summary:hover { background: var(--hover); color: var(--text); }
  .file-folder summary { list-style: none; }
  .file-folder .file-row { padding-left: 34px; }
  .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .file-preview { display: block; align-self: flex-start; width: auto; height: auto; object-fit: contain; max-width: calc(100% - 20px); max-height: 360px; margin: 4px 10px 10px; border-radius: 8px; border: 1px solid var(--border); }

  /* an environment's home */
  .stat.hot .stat-n { color: var(--accent-text); }
  /* a radio group: one small track, the chosen option raised inside it */
  .radio-group { display: inline-flex; gap: 2px; margin-left: 10px; padding: 2px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); }
  .radio-option { height: 22px; padding: 0 10px; border: none; border-radius: 5px; background: transparent; color: var(--text-3);
    font: inherit; font-size: 12px; cursor: pointer; }
  .radio-option:hover { color: var(--text); }
  .radio-option.on { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--border-2); }
  .radio-option:focus { outline: none; }
  /* the head of the Documents area: one row with the type switch, the quiet links and the New button; it stays while the list scrolls */
  .doc-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg); overflow: hidden; }
  .doc-switch { flex: none; display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: #151619; }
  .doc-switch-opt { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 13px; border-radius: 7px;
    font-size: 12.5px; color: var(--text-3); text-decoration: none; white-space: nowrap; }
  .doc-switch-opt:hover { color: var(--text); }
  .doc-switch-opt.on { background: var(--sel); color: var(--text); font-weight: 500; box-shadow: 0 0 0 1px var(--border-2); }
  .doc-switch-n { min-width: 2ch; text-align: right; font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--text-3); }
  .doc-switch-opt.on .doc-switch-n { color: var(--accent-text); }
  button.viewbar-archive { border: none; background: transparent; font: inherit; font-size: 12.5px; cursor: pointer; }
  .doc-head-new { margin-left: auto; flex: none; }
  .radio-option:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
  .body > .page { flex: 1; min-width: 0; }
  .agent-work { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .agent-work-head, .agent-work-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 48px 60px 96px; column-gap: 12px;
    align-items: center; padding: 0 14px; }
  .agent-work-head { height: 32px; font-size: 11.5px; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--raised); }
  .agent-work-row { min-height: 38px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 13px; }
  .agent-work-row:last-of-type { border-bottom: none; }
  .agent-work-row:hover { background: var(--hover); }
  .agent-work-row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-work-row .num, .agent-work-row .age, .agent-work-status { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .agent-work-row .age { text-align: right; }
  .agent-work-head span:last-child { text-align: right; }
  .agent-work-status.open { color: var(--accent-text); }
  .agent-work-more { align-self: center; margin: 8px 0; }
  /* the subagents a session sent: name, status, the model it ran on, when it last wrote */
  .agent-work.dispatched .agent-work-head, .agent-work.dispatched .agent-work-row { grid-template-columns: minmax(0, 1fr) 72px 124px 104px; }
  .agent-work.dispatched .num { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-work.skills .agent-work-head, .agent-work.skills .agent-work-row { grid-template-columns: minmax(0, 1fr) 90px 90px; }
  .agent-work.skills div.agent-work-row { color: var(--text-2); }
  .agent-work.skills .agent-work-row.picked { background: var(--hover); }
  /* a project can carry many skills: the table scrolls inside its own height, its header staying in view */
  .agent-work.skills { max-height: 420px; overflow-y: auto; }
  .agent-work.skills .agent-work-head, .agent-work.skills .agent-work-row { flex: none; }
  .agent-work.skills .agent-work-head { position: sticky; top: 0; z-index: 1; }
  .skill-always { margin-left: 8px; padding: 0 6px; border: 1px solid var(--border-2); border-radius: 4px; font-size: 10.5px; color: var(--text-3); }
  .skill-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel-tools { display: flex; align-items: center; gap: 4px; }
  /* a block is a list container too, so Home's lists narrow their columns beside an open panel */
  .block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; container: list / inline-size; }
  /* a to-do's work log: each entry opens its work item, named at the end of the line */
  .log-row { display: flex; align-items: baseline; gap: 10px; color: inherit; text-decoration: none; border-bottom: none; }
  a.log-row:hover .log-text { color: var(--text); }
  a.log-row:hover .log-work { color: var(--accent-text); }
  .log-text { flex: 1; min-width: 0; }
  .log-work { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  /* the files a piece of work changed: path, a new tag, and green added / red removed line counts */
  .work-files { display: flex; flex-direction: column; gap: 2px; }
  .work-file { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .work-file-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-2); }
  .work-file-new { font-size: 10px; padding: 0 5px; border-radius: 4px; color: var(--accent); background: rgba(94, 100, 201, .14); }
  .work-file-add { color: rgb(96, 186, 126); }
  .work-file-del { color: var(--danger); }
  .block .lgroup:last-child > .rows:last-child > .row:last-child { border-bottom: none; }
  @keyframes subagent-live { 50% { opacity: .35; } }
  /* the Files page: one row per stored file, with a thumbnail or icon, where it came from, size and age */
  /* one agent, and its raw transcript read from the top down */
  .agent-status.working { color: var(--accent-text); }
  .agent-links { display: flex; gap: 8px; }
  .tlog { gap: 0; }
  .tlog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12.5px; }
  .tlog-line { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .tlog-meta { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--text-3); }
  .tlog-who { color: var(--text-2); font-weight: 500; }
  .tlog-human .tlog-who { color: var(--accent-text); }
  .tlog-n { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .7; }
  .tlog-tools { margin-top: 3px; font-size: 11.5px; color: var(--text-3); }
  .tlog-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12.5px; line-height: 1.5; color: var(--text); }
  .tlog-tool_result .tlog-text, .tlog-injected .tlog-text { max-height: 280px; overflow: auto; color: var(--text-2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .tlog-end { padding: 18px 0; text-align: center; font-size: 12px; color: var(--text-3); }
  .commit-body { white-space: pre-wrap; }
  /* a commit hash: an inline button as wide as its text, readable, and plainly a link */
  .chip.sha { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--accent-text);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border-2)); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .sha-subject { color: var(--text-3); font-size: 12px; }
  a.chip.sha:hover { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
  /* inside a list, links are rows; a hash inside a row stays an inline button on the row's line */
  .linked a.chip.sha { display: inline-flex; align-self: auto; height: 20px; padding: 0 6px; margin: 0 6px 0 4px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border-2)); border-radius: 5px; vertical-align: baseline; }
  .linked a.chip.sha:last-child { border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border-2)); }
  .linked a.chip.sha:hover { border-color: var(--accent); }
  /* the image library: a grid of square thumbnails, each with its name and where it came from */
  .files-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .files-tile { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .files-tile-img { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--raised); }
  .files-tile-img:hover { border-color: var(--border-2); }
  .files-tile-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .files-tile figcaption { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 12px; }
  .files-tile-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-tile figcaption a { color: var(--text-3); }
  .files-page { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .files-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .files-row:last-child { border-bottom: none; }
  .files-thumb { flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 6px; background: var(--raised); border: 1px solid var(--border); overflow: hidden; color: var(--text-3); }
  .files-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .files-thumb .ico { width: 18px; height: 18px; }
  .files-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .files-name { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .files-name:hover { text-decoration: underline; }
  .files-meta { font-size: 12px; color: var(--text-3); }
  .files-meta a { color: var(--text-2); }
  .files-age { flex: none; font-size: 12px; color: var(--text-3); }
  /* a message's file: a Remove button beside it, and a short form asking why */
  .file-held { display: flex; align-items: center; gap: 8px; }
  .file-held > .file-row { flex: 1; min-width: 0; }
  .file-held > .btn { flex: none; height: 24px; padding: 0 9px; font-size: 12px; }
  .file-remove { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; }
  .file-remove input { flex: 1; min-width: 0; height: 28px; padding: 0 9px; border: 1px solid var(--border-2); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 12.5px; }
  .file-remove input:focus { outline: none; border-color: var(--accent); }
  .file-remove .btn { height: 28px; padding: 0 10px; font-size: 12px; }
  .file-row.removed { cursor: default; }
  /* the Files heading of a message, with Attach files beside it */
  .files-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .files-head .btn { height: 26px; padding: 0 10px; font-size: 12px; cursor: pointer; }
  .files-head .btn.disabled { opacity: .6; cursor: default; }
  /* a removed file keeps its name readable; a long reason gives way and ends in an ellipsis */
  .file-row.removed .file-name { flex: 0 1 auto; max-width: 50%; text-decoration: line-through; color: var(--text-3); }
  .file-row.removed .file-meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  /* a document part is its own bordered block, so where it starts and ends is plain; its header carries Edit */
  .doc-part { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .doc-part-head { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 14px;
    background: var(--raised); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .doc-part-head .doc-part-num { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .doc-part-head .doc-part-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 500; }
  .doc-part-head .doc-part-age { color: var(--text-3); font-size: 11.5px; }
  .doc-part-head .btn { height: 24px; padding: 0 9px; font-size: 12px; opacity: 0; transition: opacity .12s; }
  .doc-part:hover .doc-part-head .btn, .doc-part-head .btn:focus-visible, .doc-part.editing .doc-part-head .btn { opacity: 1; }
  .doc-part-body { padding: 10px 14px 14px; }
  .doc-part-edit { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
  .doc-part-edit textarea { box-sizing: border-box; width: 100%; min-height: 180px; resize: vertical; padding: 9px 11px;
    border: 1px solid var(--border-2); border-radius: 8px; background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .doc-part-edit textarea:focus { outline: none; border-color: var(--accent); }
  .doc-part-edit-bar { display: flex; align-items: center; gap: 8px; }
  .doc-part-edit-bar .hint { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
  @media (hover: none) { .doc-part-head .btn { opacity: 1; } }
  .block .ghead { position: static; }


  @media (max-width: 960px) {
    .side { display: none; }
    .activity-dock { display: none; }
    .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 5; box-shadow: -12px 0 32px rgba(0, 0, 0, .45); }
  }
  @media (max-width: 640px) {
    .lrow .cite { display: none; }
  }
</style>
