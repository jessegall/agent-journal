<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  /* no scrollbars anywhere: what scrolls says so by its content, not by a bar beside it */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  :root {
    color-scheme: dark;
    --side: #0d0e10; --bg: #131416; --raised: #18191c; --hover: #1d1e22; --sel: #212329;
    --border: #25272b; --border-2: #2f3136;
    --text: #e6e7ea; --text-2: #a9acb3; --text-3: #83868e;
    --accent: #5e64c9; --accent-text: #a3a8f0; --warn: #c9955e; --danger: #df8b7e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #app { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  .app { display: flex; height: 100%; overflow: hidden; }
  /* several journals open: a thin strip in this project's colour along the very top, its name on a small tab */
  .app.striped { box-sizing: border-box; padding-top: 3px; }
  .project-strip { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; background: var(--strip); pointer-events: none; }
  /* the font is spelled out: a `font` shorthand holding `inherit` is invalid, so a button fell back to its own larger size */
  .project-strip-name { position: absolute; top: 0; left: 50%; transform: translateX(-50%); padding: 5px 9px 3px;
    border: none; border-radius: 0 0 6px 6px; background: var(--strip); color: var(--strip-label, #0d0e10);
    font-family: inherit; font-size: 10px; font-weight: 600; line-height: 12px;
    white-space: nowrap; pointer-events: auto; cursor: pointer; transition: padding-bottom .12s; }
  .project-strip-name:hover, .project-strip-name[aria-expanded="true"] { padding-bottom: 4px; filter: brightness(1.08); }
  .project-strip-name:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .strip-drop { position: fixed; top: 20px; left: 50%; right: auto; transform: translateX(-50%); z-index: 61; }
  .journal-dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; }

  /* sidebar */
  .side { width: 236px; flex: none; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 18px; padding: 12px 0; overflow-x: hidden; overflow-y: auto; }
  .side > * { flex: none; }
  /* each section pads itself, so the Activity section can run edge to edge */
  .side > .project { margin-inline: 10px; }
  .side > .journal-switch { margin-inline: 10px; }
  button.project { width: 100%; background: transparent; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-family: inherit; }
  button.project:hover { background: var(--hover); }
  button.project .fold { margin-left: auto; }
  /* the sidebar clips what sticks out, so the list keeps to its width */
  .journal-switch .drop { left: 0; right: 0; top: 36px; width: auto; }
  /* this journal, in both pickers: selected, and still answering the pointer without looking like a link */
  .journal-switch .drop-row.current, .strip-drop .drop-row.current { background: var(--sel); cursor: default; }
  .journal-switch .drop-row.current:hover, .strip-drop .drop-row.current:hover { background: color-mix(in srgb, var(--sel) 88%, var(--text) 12%); }
  .side > .group { padding-inline: 10px; }
  .project { display: flex; align-items: center; gap: 9px; padding: 6px 8px; font-weight: 600; font-size: 13.5px; color: var(--text); }
  .project:hover { color: var(--text); }
  .project .logo { width: 20px; height: 20px; border-radius: 5px; background: #2a2c33; display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: var(--text-2); }
  .group { display: flex; flex-direction: column; gap: 1px; }
  .side { display: flex; flex-direction: column; }
  .side-foot { display: flex; flex-direction: column; gap: 2px; margin: auto 0 -12px; padding: 6px 10px 8px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
  .side-foot-version { box-sizing: border-box; height: 22px; margin: 0 -10px 2px; padding: 0 10px; display: flex; align-items: center;
    border-radius: 6px; font-size: 10.5px; color: var(--text-3); text-decoration: none; }
  .side-foot-version:hover { color: var(--text); }
  .about-log h2 { margin-top: 28px; font-size: 15px; }
  .side-foot-branch-name { overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text-2, var(--text)); }
  .ctx-bar { width: 36px; height: 3px; border-radius: 2px; background: var(--border-2); overflow: hidden; }
  .ctx-bar > span { display: block; height: 100%; background: var(--text-3); }
  @keyframes env-blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .side-foot .env-dot.live { animation: none; } }
  .activity-text { font-size: 12px; color: var(--text-2); line-height: 1.45; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .activity-row { display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; }
  /* a new Activity line slides down in, an old one fades out, and the rest glide */
  .act-enter-active { transition: opacity .24s ease-out, transform .24s cubic-bezier(.2, .8, .2, 1); }
  .act-enter-from { opacity: 0; transform: translateY(-8px); }
  .act-leave-active { transition: opacity .18s ease-in; }
  .act-leave-to { opacity: 0; }
  .act-move { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-reduced-motion: reduce) { .act-enter-active, .act-leave-active, .act-move { transition: none; } }
  .activity-row .activity-text { overflow-wrap: anywhere; }
  .activity-title { font-size: 11.5px; color: var(--text-3); line-height: 1.4; overflow-wrap: anywhere; }
  .activity-age { font-size: 11px; color: var(--text-3); white-space: nowrap; opacity: .8; }
  .activity-n { margin-left: .35em; font-size: 10.5px; color: var(--text-3); opacity: .65; font-variant-numeric: tabular-nums; }
  .activity-n::before { content: "·"; margin-right: .35em; }
  .activity-d { margin-left: .35em; font-size: 10.5px; color: var(--text-3); opacity: .65; }
  .activity-d::before { content: "·"; margin-right: .35em; }
  .activity-alert { margin: 4px 0; padding: 8px; gap: 8px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .activity-alert-body { display: flex; flex-direction: column; gap: 1px; color: inherit; }
  .activity-alert .activity-text { color: var(--text); }
  .activity-actions { display: flex; gap: 6px; }
  .btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
  .activity-soft { background: color-mix(in srgb, var(--warn) 5%, transparent); }
  /* work landing: a commit stands out in its own outline, the short sha set like the commit chips */
  .activity-commit { margin: 4px 0; padding: 7px 8px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .activity-commit .activity-text { color: var(--text); }
  .activity-commit .activity-d { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent-text); opacity: 1; }
  .activity-link { color: inherit; border-radius: 7px; }
  .activity-head { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -10px; padding: 0 10px;
    border-bottom: 1px solid var(--border); box-sizing: border-box; }
  .activity-head .group-label { padding-block: 0; }
  .activity-head-tools { display: flex; align-items: center; gap: 2px; }
  .activity-head-tools .icon-btn { position: relative; }
  /* the Activity column clips what sticks out, so the list spans the header instead of hanging off its button */
  .activity-head { position: relative; }
  .activity-head .drop-wrap.crew { position: static; }
  .activity-head .drop { left: 8px; right: 8px; top: 44px; width: auto; }
  .activity-dock { width: 290px; flex: none; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0 10px;
    background: var(--side); border-left: 1px solid var(--border); }
  .activity-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .activity-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 12px; }
  /* Settings as grouped rows: a label, its current value, and the one action that changes it; a form opens under its row */
  .settings-page { padding: 26px 28px 56px; display: flex; flex-direction: column; gap: 26px; max-width: 720px; }
  .settings-group { display: flex; flex-direction: column; gap: 10px; }
  .settings-group h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .settings-note { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text-3); }
  .settings-card { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: #151619; }
  .settings-row { box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 46px; padding: 8px 16px; border-bottom: 1px solid #1f2125; }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { flex: 1; min-width: 0; margin: 0; font-size: 13px; color: var(--text); }
  .settings-value { flex: none; font-size: 12.5px; color: var(--text-3); }
  .settings-row .actions { display: contents; }
  .settings-row .action-form, .settings-wide { flex-basis: 100%; }
  .activity-link:hover { background: var(--hover); }
  .activity-link:hover .activity-text { color: var(--text); }
  .group-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding: 4px 8px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold-head { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0;
    font-family: inherit; text-align: left; cursor: pointer; border-radius: 6px; }
  .fold-head:hover { color: var(--text-2); }
  .fold { width: 5px; height: 5px; margin-right: 4px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg); transition: transform .15s; opacity: .7; }
  .fold.shut { transform: rotate(-45deg); }
  /* a list group's header folds its rows away; the count stays, so a folded group still says how much it holds */
  .ghead-fold { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: auto; margin-right: -4px; padding: 0;
    border: none; background: transparent; color: var(--text-3); cursor: pointer; }
  .ghead-fold:hover { color: var(--text); }
  .ghead-fold .fold { margin: 0; }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
  .item:hover { background: var(--hover); color: var(--text); }
  .item.on { background: var(--sel); color: var(--text); }
  .item .ico { width: 15px; height: 15px; color: var(--text-3); }
  .item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .item .count.hot { color: var(--accent-text); font-weight: 500; }
  .env-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box;
    border: 1.5px solid var(--text-3); background: transparent; opacity: .7; flex: none; margin: 0 4px; }
  /* an agent working here: the accent colour with a slow, soft ring; green is kept for done */
  .env-dot.live { border-color: var(--accent); background: var(--accent); opacity: 1; }
  .env-dot.live::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: var(--accent);
    opacity: .3; animation: env-pulse 2.6s ease-out infinite; }
  @keyframes env-pulse { from { transform: scale(.45); opacity: .38; } to { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .env-dot.live::after { animation: none; opacity: .2; } }

  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px; border-bottom: 1px solid var(--border); }
  .top-tools { display: flex; align-items: center; gap: 6px; flex: none; }
  /* the agent's state under the top bar on every page; only the description gives way when the bar is narrow */
  .statusbar { height: 52px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px;
    border-bottom: 1px solid var(--border); background: #17181b; overflow: hidden; }
  .statusbar.held { background: #1b1a16; }
  .statusbar-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--text-3); }
  .statusbar-dot.live { background: var(--accent); }
  .statusbar-dot.held { background: #d9a441; }
  .statusbar-text { flex: 1 1 0%; min-width: 0; display: flex; align-items: baseline; gap: 8px; overflow: hidden; margin: 0 -7px; padding: 3px 7px; border: none; border-radius: 7px;
    background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .statusbar-text:hover { background: rgba(255, 255, 255, .04); }
  .statusbar-text b { flex: none; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
  .statusbar-text span { flex: 1 1 auto; min-width: 180px; font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-decoration: underline; text-decoration-color: #3a3d44; text-underline-offset: 3px; }
  .statusbar-branch { flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  .statusbar-branch .ico { flex: none; width: 12px; height: 12px; }
  .statusbar-branch > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .statusbar-tools { margin-left: auto; flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .statusbar-branch { gap: 7px; }
  .statusbar-auto { flex: none; display: inline-flex; align-items: center; gap: 7px; border: none; background: transparent; padding: 0;
    font-size: 11.5px; color: var(--text-2); cursor: pointer; }
  /* the agent's latest reply, at the top of the Activity column, so what it wrote in the terminal is readable here */
  .activity-said { flex: none; max-height: 160px; overflow-y: auto; margin: 8px 0 4px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); }
  .activity-said-head { display: block; margin-bottom: 4px; font-size: 11px; color: var(--text-3); }
  .activity-said-text { font-size: 12px; line-height: 1.5; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  /* the quick menu: a command box over the whole app that sends what is typed to the agent unless a command is picked */
  .quick-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(4, 5, 6, .62); }
  .quick-menu { position: fixed; z-index: 51; top: 92px; left: 50%; transform: translateX(-50%); width: min(580px, calc(100% - 56px));
    display: flex; flex-direction: column; overflow: hidden; border: 1px solid #33363d; border-radius: 14px; background: #151619; box-shadow: 0 26px 64px rgba(0, 0, 0, .6); }
  .quick-head { flex: none; display: flex; align-items: center; gap: 11px; height: 54px; padding: 0 15px; border-bottom: 1px solid var(--border); }
  .quick-head .ico { flex: none; width: 15px; height: 15px; color: var(--text-3); }
  .quick-head.writing .ico { color: var(--accent); }
  .quick-input { flex: 1; min-width: 0; border: none; background: transparent; color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .quick-key { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 20px; padding: 0 6px; border: 1px solid var(--border-2);
    border-radius: 4px; background: transparent; color: var(--text-3); font: inherit; font-size: 10.5px; cursor: pointer; }
  .quick-rows { flex: 1; min-height: 0; max-height: 294px; overflow-y: auto; overflow-x: hidden; padding: 6px; }
  .quick-row { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .quick-row.on { background: var(--sel); color: var(--text); }
  .quick-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-foot { flex: none; display: flex; align-items: center; gap: 14px; padding: 9px 15px; border-top: 1px solid var(--border); background: #121316;
    font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .quick-foot-note { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .quick-row .ico { flex: none; width: 14px; height: 14px; color: var(--text-3); }
  .quick-row.on .ico { color: var(--accent-text); }
  .quick-cap { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 18px; padding: 0 6px; border: 1px solid var(--border-2);
    border-radius: 4px; color: var(--text-3); font-size: 10.5px; line-height: 1; white-space: nowrap; }
  .quick-row.on .quick-cap { border-color: #3a3d44; color: #c3c7fb; }
  .quick-head.writing { height: 48px; gap: 10px; background: #17181b; }
  .quick-write-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-write-note { flex: none; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
  .quick-write { flex: none; padding: 14px 15px 4px; }
  .quick-write textarea { box-sizing: border-box; display: block; width: 100%; height: 112px; resize: none; padding: 0; border: none; background: transparent;
    color: var(--text); font: inherit; font-size: 14px; line-height: 1.6; outline: none; }
  .quick-foot-grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* files held with a message: a chip each, above the compose footer */
  .quick-files { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 15px 2px; }
  .quick-file { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; height: 24px; padding: 0 7px 0 9px;
    border: 1px solid var(--border-2); border-radius: 6px; background: #18191c; color: var(--text-2); font-size: 11.5px; }
  .quick-file-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-file-size { flex: none; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
  .quick-file-x { flex: none; box-sizing: border-box; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: none; border-radius: 4px; background: transparent; color: var(--text-3); cursor: pointer; }
  .quick-file-x:hover { background: #212329; color: var(--text); }
  .quick-file-x .ico { width: 10px; height: 10px; }
  .quick-attach { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 9px; border: none; border-radius: 7px;
    background: transparent; color: var(--text-3); font: inherit; font-size: 12px; cursor: pointer; }
  .quick-attach:hover { background: var(--hover); color: var(--text); }
  .quick-attach .ico { flex: none; width: 13px; height: 13px; }
  .quick-foot .btn { height: 27px; font-size: 12px; border-radius: 7px; }
  .quick-foot.writing { padding: 10px 15px; }
  .quick-send { flex: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; height: 27px; padding: 0 11px; border-radius: 7px; border: none;
    background: #212329; color: var(--text-3); font: inherit; font-size: 12px; font-weight: 500; }
  .quick-send.ready { background: var(--accent); color: #fff; cursor: pointer; }
  .quick-send .ico { width: 13px; height: 13px; }
  .quick-toast { position: fixed; z-index: 52; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; height: 34px; padding: 0 15px;
    border: 1px solid #33363d; border-radius: 9px; background: var(--hover); color: var(--text); font-size: 12.5px; white-space: nowrap; box-shadow: 0 14px 34px rgba(0, 0, 0, .5); }
  .side-foot.side-foot-row { flex-direction: row; align-items: center; gap: 6px; }
  .side-foot-row .side-foot-version { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .space-hint { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 17px; padding: 0 5px; border: 1px solid var(--border);
    border-radius: 4px; background: transparent; color: var(--text-3); font: inherit; font-size: 10px; line-height: 1; cursor: pointer; }
  .space-hint:hover { border-color: #3a3d44; color: var(--text-2); }
  .drop-wrap { position: relative; }
  .icon-btn.on { background: var(--sel); color: var(--text); }
  .tool-badge { position: absolute; top: -2px; right: -3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 10px; line-height: 15px; text-align: center; pointer-events: none; }
  /* the away digest: bottom right when the user comes back, closed by its button or Esc, never on a timer */
  .away-card { position: fixed; z-index: 53; right: 18px; bottom: 18px; width: min(340px, calc(100vw - 36px)); display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #33363d; border-radius: 12px; background: #17181b; box-shadow: 0 20px 48px rgba(0, 0, 0, .55); animation: away-in .24s cubic-bezier(.22, .7, .2, 1) both; }
  @keyframes away-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .away-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-bottom: 1px solid var(--border); }
  .away-close { flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 5px;
    background: transparent; color: var(--text-3); cursor: pointer; }

  /* detail panel */

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes quick-in { from { transform: translate(-50%, -8px) scale(.985); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
  @keyframes toast-in { from { transform: translate(-50%, 10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

  .input { height: 30px; padding: 0 9px; background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .input:focus { border-color: var(--accent); }
  .form-buttons { display: flex; gap: 6px; }
  .primary.danger-fill { background: var(--danger); color: #1a0f0d; }
  .setting .toggle { margin-left: 0; align-self: flex-start; }
  .search-bar { display: flex; align-items: center; gap: 10px; }
  .search-input { flex: 1; height: 34px; }
  .search-bar .toggle { margin-left: 0; }
  .searchrow, .hitrow { display: grid; gap: 12px; }
  .stack { min-width: 0; }
  .searchrow { grid-template-columns: 72px 44px minmax(0, 1fr); }
  .hitrow { grid-template-columns: 52px 48px minmax(0, 1fr); align-items: start; }
  .searchrow .tag, .hitrow .tag { text-align: left; }
  .hit { white-space: normal; overflow-wrap: anywhere; }
  mark { background: rgba(94, 100, 201, .35); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
  .options { display: flex; flex-direction: column; gap: 6px; }
  .option { text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--raised);
    color: var(--text); font-size: 13px; line-height: 1.45; }
  .option:hover:not(:disabled) { border-color: var(--accent); }
  .option.chosen { border-color: var(--accent); background: rgba(94, 100, 201, .18); }
  .setting { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; }

  /* markdown, rendered by app.js */
  .md > :first-child { margin-top: 0; }
  .md :is(h1, h2, h3, h4, h5, h6) { font-size: 13.5px; font-weight: 600; color: var(--text); margin: 1.2em 0 .4em; }
  .md p { margin: .6em 0; }
  .md ul, .md ol { margin: .4em 0 .8em; padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md code { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: .05em .35em;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .md pre code { background: none; border: none; padding: 0; }

  /* a doc's files */
  .files { display: flex; flex-direction: column; gap: 4px; }
  .file-row, .file-folder summary { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px; color: var(--text); cursor: pointer; }
  .file-row:hover, .file-folder summary:hover { background: var(--hover); color: var(--text); }
  .file-folder summary { list-style: none; }
  .file-folder .file-row { padding-left: 34px; }
  .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .file-preview { display: block; align-self: flex-start; width: auto; height: auto; object-fit: contain; max-width: calc(100% - 20px); max-height: 360px; margin: 4px 10px 10px; border-radius: 8px; border: 1px solid var(--border); }
  /* a doc's attachments */
  .attachment-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .attachment-card { display: flex; align-items: center; gap: 10px; min-width: 180px; max-width: 100%;
    border: 1px solid var(--border-2); border-radius: 8px; padding: 9px 12px; }
  .attachment-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .attachment-name { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-meta { color: var(--text-3); font-size: 12px; }

  /* an environment's home */
  .stat { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--raised); color: var(--text-2); }
  .stat:hover { border-color: var(--border-2); color: var(--text); }
  .stat-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
  .stat-n { font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat.hot .stat-n { color: var(--accent-text); }
  .stat-sub { margin-top: -4px; font-size: 11.5px; color: var(--text-3); }
  /* a radio group: one small track, the chosen option raised inside it */
  .radio-group { display: inline-flex; gap: 2px; margin-left: 10px; padding: 2px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); }
  .radio-option { height: 22px; padding: 0 10px; border: none; border-radius: 5px; background: transparent; color: var(--text-3);
    font: inherit; font-size: 12px; cursor: pointer; }
  .radio-option:hover { color: var(--text); }
  .radio-option.on { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--border-2); }
  .radio-option:focus { outline: none; }
  /* the head of the Documents area: one row with the type switch, the quiet links and the New button; it stays while the list scrolls */
  .doc-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border); background: var(--bg); overflow: hidden; }
  .doc-switch { flex: none; display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: #151619; }
  .doc-switch-opt { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 13px; border-radius: 7px;
    font-size: 12.5px; color: var(--text-3); text-decoration: none; white-space: nowrap; }
  .doc-switch-opt:hover { color: var(--text); }
  .doc-switch-opt.on { background: var(--sel); color: var(--text); font-weight: 500; box-shadow: 0 0 0 1px var(--border-2); }
  .doc-switch-n { min-width: 2ch; text-align: right; font-size: 11px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--text-3); }
  .doc-switch-opt.on .doc-switch-n { color: var(--accent-text); }
  button.viewbar-archive { border: none; background: transparent; font: inherit; font-size: 12.5px; cursor: pointer; }
  .doc-head-new { margin-left: auto; flex: none; }
  .radio-option:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
  .body > .page { flex: 1; min-width: 0; }
  .agent-work { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .agent-work-head, .agent-work-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 48px 60px 96px; column-gap: 12px;
    align-items: center; padding: 0 14px; }
  .agent-work-head { height: 32px; font-size: 11.5px; color: var(--text-3); border-bottom: 1px solid var(--border); background: var(--raised); }
  .agent-work-row { min-height: 38px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 13px; }
  .agent-work-row:last-of-type { border-bottom: none; }
  .agent-work-row:hover { background: var(--hover); }
  .agent-work-row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-work-row .num, .agent-work-row .age, .agent-work-status { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .agent-work-row .age { text-align: right; }
  .agent-work-head span:last-child { text-align: right; }
  .agent-work-status.open { color: var(--accent-text); }
  .agent-work-more { align-self: center; margin: 8px 0; }
  /* the subagents a session sent: name, status, the model it ran on, when it last wrote */
  .agent-work.dispatched .agent-work-head, .agent-work.dispatched .agent-work-row { grid-template-columns: minmax(0, 1fr) 72px 124px 104px; }
  .agent-work.dispatched .num { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-work.skills .agent-work-head, .agent-work.skills .agent-work-row { grid-template-columns: minmax(0, 1fr) 90px 90px; }
  .agent-work.skills div.agent-work-row { color: var(--text-2); }
  .agent-work.skills .agent-work-row.picked { background: var(--hover); }
  /* a project can carry many skills: the table scrolls inside its own height, its header staying in view */
  .agent-work.skills { max-height: 420px; overflow-y: auto; }
  .agent-work.skills .agent-work-head, .agent-work.skills .agent-work-row { flex: none; }
  .agent-work.skills .agent-work-head { position: sticky; top: 0; z-index: 1; }
  .skill-always { margin-left: 8px; padding: 0 6px; border: 1px solid var(--border-2); border-radius: 4px; font-size: 10.5px; color: var(--text-3); }
  .skill-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel-tools { display: flex; align-items: center; gap: 4px; }
  /* a block is a list container too, so Home's lists narrow their columns beside an open panel */
  .block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; container: list / inline-size; }
  /* a to-do's work log: each entry opens its work item, named at the end of the line */
  .log-row { display: flex; align-items: baseline; gap: 10px; color: inherit; text-decoration: none; border-bottom: none; }
  a.log-row:hover .log-text { color: var(--text); }
  a.log-row:hover .log-work { color: var(--accent-text); }
  .log-text { flex: 1; min-width: 0; }
  .log-work { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  /* the files a piece of work changed: path, a new tag, and green added / red removed line counts */
  .work-files { display: flex; flex-direction: column; gap: 2px; }
  .work-file { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .work-file-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-2); }
  .work-file-new { font-size: 10px; padding: 0 5px; border-radius: 4px; color: var(--accent); background: rgba(94, 100, 201, .14); }
  .work-file-add { color: rgb(96, 186, 126); }
  .work-file-del { color: var(--danger); }
  .block .lgroup:last-child > .rows:last-child > .row:last-child { border-bottom: none; }
  /* Home: the last work that ended, under the open work, smaller and muted */
  .recent-ended { display: flex; flex-direction: column; margin-top: 8px; }
  .recent-ended-row { display: flex; align-items: baseline; gap: 10px; padding: 5px 12px; border-radius: 6px;
    color: var(--text-3); font-size: 12px; text-decoration: none; }
  .recent-ended-row:hover { background: var(--hover); color: var(--text-2); }
  .recent-ended-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-ended-age { flex: none; font-size: 11.5px; opacity: .8; }
  .subagent-row::before { content: ""; flex: none; align-self: center; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: subagent-live 1.6s ease-in-out infinite; }
  @keyframes subagent-live { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .subagent-row::before { animation: none; } }
  .subagent-model { flex: none; font-size: 11px; color: var(--text-3); }
  /* the Files page: one row per stored file, with a thumbnail or icon, where it came from, size and age */
  /* one agent, and its raw transcript read from the top down */
  .agent-status.working { color: var(--accent-text); }
  .agent-links { display: flex; gap: 8px; }
  .tlog { gap: 0; }
  .tlog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12.5px; }
  .tlog-line { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .tlog-meta { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--text-3); }
  .tlog-who { color: var(--text-2); font-weight: 500; }
  .tlog-human .tlog-who { color: var(--accent-text); }
  .tlog-n { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .7; }
  .tlog-tools { margin-top: 3px; font-size: 11.5px; color: var(--text-3); }
  .tlog-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12.5px; line-height: 1.5; color: var(--text); }
  .tlog-tool_result .tlog-text, .tlog-injected .tlog-text { max-height: 280px; overflow: auto; color: var(--text-2);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .tlog-end { padding: 18px 0; text-align: center; font-size: 12px; color: var(--text-3); }
  .commit-body { white-space: pre-wrap; }
  /* a commit hash: an inline button as wide as its text, readable, and plainly a link */
  .chip.sha { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--accent-text);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border-2)); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .sha-subject { color: var(--text-3); font-size: 12px; }
  a.chip.sha:hover { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
  /* inside a list, links are rows; a hash inside a row stays an inline button on the row's line */
  .linked a.chip.sha { display: inline-flex; align-self: auto; height: 20px; padding: 0 6px; margin: 0 6px 0 4px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border-2)); border-radius: 5px; vertical-align: baseline; }
  .linked a.chip.sha:last-child { border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border-2)); }
  .linked a.chip.sha:hover { border-color: var(--accent); }
  /* the image library: a grid of square thumbnails, each with its name and where it came from */
  .files-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .files-tile { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .files-tile-img { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--raised); }
  .files-tile-img:hover { border-color: var(--border-2); }
  .files-tile-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .files-tile figcaption { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 12px; }
  .files-tile-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-tile figcaption a { color: var(--text-3); }
  .files-page { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .files-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .files-row:last-child { border-bottom: none; }
  .files-thumb { flex: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
    border-radius: 6px; background: var(--raised); border: 1px solid var(--border); overflow: hidden; color: var(--text-3); }
  .files-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .files-thumb .ico { width: 18px; height: 18px; }
  .files-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .files-name { color: var(--text); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .files-name:hover { text-decoration: underline; }
  .files-meta { font-size: 12px; color: var(--text-3); }
  .files-meta a { color: var(--text-2); }
  .files-age { flex: none; font-size: 12px; color: var(--text-3); }
  /* a message's file: a Remove button beside it, and a short form asking why */
  .file-held { display: flex; align-items: center; gap: 8px; }
  .file-held > .file-row { flex: 1; min-width: 0; }
  .file-held > .btn { flex: none; height: 24px; padding: 0 9px; font-size: 12px; }
  .file-remove { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; }
  .file-remove input { flex: 1; min-width: 0; height: 28px; padding: 0 9px; border: 1px solid var(--border-2); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 12.5px; }
  .file-remove input:focus { outline: none; border-color: var(--accent); }
  .file-remove .btn { height: 28px; padding: 0 10px; font-size: 12px; }
  .file-row.removed { cursor: default; }
  /* the Files heading of a message, with Attach files beside it */
  .files-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .files-head .btn { height: 26px; padding: 0 10px; font-size: 12px; cursor: pointer; }
  .files-head .btn.disabled { opacity: .6; cursor: default; }
  /* a removed file keeps its name readable; a long reason gives way and ends in an ellipsis */
  .file-row.removed .file-name { flex: 0 1 auto; max-width: 50%; text-decoration: line-through; color: var(--text-3); }
  .file-row.removed .file-meta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  /* a document part is its own bordered block, so where it starts and ends is plain; its header carries Edit */
  .doc-part { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .doc-part-head { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 8px 0 14px;
    background: var(--raised); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .doc-part-head .doc-part-num { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .doc-part-head .doc-part-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 500; }
  .doc-part-head .doc-part-age { color: var(--text-3); font-size: 11.5px; }
  .doc-part-head .btn { height: 24px; padding: 0 9px; font-size: 12px; opacity: 0; transition: opacity .12s; }
  .doc-part:hover .doc-part-head .btn, .doc-part-head .btn:focus-visible, .doc-part.editing .doc-part-head .btn { opacity: 1; }
  .doc-part-body { padding: 10px 14px 14px; }
  .doc-part-edit { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
  .doc-part-edit textarea { box-sizing: border-box; width: 100%; min-height: 180px; resize: vertical; padding: 9px 11px;
    border: 1px solid var(--border-2); border-radius: 8px; background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .doc-part-edit textarea:focus { outline: none; border-color: var(--accent); }
  .doc-part-edit-bar { display: flex; align-items: center; gap: 8px; }
  .doc-part-edit-bar .hint { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
  @media (hover: none) { .doc-part-head .btn { opacity: 1; } }
  .block .ghead { position: static; }


  @media (max-width: 960px) {
    .side { display: none; }
    .activity-dock { display: none; }
    .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 5; box-shadow: -12px 0 32px rgba(0, 0, 0, .45); }
    .home-body { display: flex; }
  }
  @media (max-width: 640px) {
    .lrow .cite { display: none; }
  }
</style>
