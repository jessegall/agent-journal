<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --side: #0d0e10; --bg: #131416; --raised: #18191c; --hover: #1d1e22; --sel: #212329;
    --border: #25272b; --border-2: #2f3136;
    --text: #e6e7ea; --text-2: #a9acb3; --text-3: #83868e;
    --accent: #5e64c9; --accent-text: #a3a8f0; --warn: #c9955e; --danger: #df8b7e; --live: #6fae7d;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #app { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  .app { display: flex; height: 100%; overflow: hidden; }

  /* sidebar */
  .side { width: 236px; flex: none; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 18px; padding: 12px 10px; overflow-y: auto; }
  .project { display: flex; align-items: center; gap: 9px; padding: 6px 8px; font-weight: 600; font-size: 13.5px; color: var(--text); }
  .project:hover { color: var(--text); }
  .project .logo { width: 20px; height: 20px; border-radius: 5px; background: #2a2c33; display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: var(--text-2); }
  .group { display: flex; flex-direction: column; gap: 1px; }
  .group-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding: 4px 8px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
  .item:hover { background: var(--hover); color: var(--text); }
  .item.on { background: var(--sel); color: var(--text); }
  .item .ico { width: 15px; height: 15px; }
  .item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .item .count.hot { color: var(--accent-text); font-weight: 500; }
  .env-dot { width: 7px; height: 7px; border-radius: 2px; background: #3a3c43; flex: none; margin: 0 4px; }
  .env-dot.cur { background: var(--accent); }
  .env-dot.live { box-shadow: 0 0 0 2px rgba(111, 174, 125, .4); }

  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px; border-bottom: 1px solid var(--border); }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); min-width: 0; }
  .crumb b { color: var(--text); font-weight: 500; }
  .crumb .sep { color: var(--text-3); }
  .viewbar { height: 40px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-3); }
  .viewbar b { color: var(--text-2); font-weight: 500; }
  .toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .body { flex: 1; min-height: 0; display: flex; }
  .list { flex: 1; min-width: 0; overflow-y: auto; }
  .page { flex: 1; min-height: 0; overflow-y: auto; }
  .page-inner { max-width: 760px; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 22px; }

  .ghead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 20px;
    background: var(--raised); border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 500; color: var(--text-2); }
  .ghead .n { color: var(--text-3); font-weight: 400; }

  /* rows: fixed columns, so status and priority never push a title out of line */
  .row { display: grid; align-items: center; column-gap: 8px; min-height: 40px; padding: 0 20px;
    border-bottom: 1px solid var(--border); color: var(--text); }
  .row:hover { background: var(--hover); color: var(--text); }
  .row.sel { background: var(--sel); }
  .todorow { grid-template-columns: 22px 22px 44px minmax(0, 1fr) 76px 64px; }
  .pinrow { grid-template-columns: 44px minmax(0, 1fr) 76px 64px; }
  .inboxrow, .questionrow { grid-template-columns: 22px 44px minmax(0, 1fr) minmax(0, 160px) 64px; }
  .docrow { grid-template-columns: 44px minmax(0, 1fr) 60px 64px; }
  .reminderrow { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 220px); }
  .workrow { grid-template-columns: 22px minmax(0, 1fr) 64px; align-items: start; padding-top: 11px; padding-bottom: 11px; }
  .row .num { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .row .cite, .row .age, .row .tag { color: var(--text-3); font-size: 12.5px; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--text-3); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.struck .title { color: var(--text-3); text-decoration: line-through; }
  .ico { width: 16px; height: 16px; color: var(--text-3); flex: none; }
  .ico.hot { color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; margin: 0 4px; }
  .empty { color: var(--text-3); padding: 16px 20px; margin: 0; }
  .error { color: var(--danger); padding: 12px 20px; margin: 0; }
  .muted { color: var(--text-3); }

  /* detail panel */
  .panel { width: 400px; flex: none; min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border); background: var(--bg); }
  .panel-top { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); color: var(--text-3); font-size: 12.5px; }
  .icon-btn { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn .ico { width: 15px; height: 15px; }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
  .p-title { font-size: 16px; font-weight: 600; line-height: 1.4; margin: 0; text-wrap: pretty; }
  .page .p-title { font-size: 20px; }
  .props { display: grid; grid-template-columns: 96px 1fr; row-gap: 10px; column-gap: 12px; font-size: 13px; margin: 0; }
  .props dt { color: var(--text-3); }
  .props dd { margin: 0; color: var(--text); display: flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
  .props dd .ico { width: 15px; height: 15px; }
  .section-label { font-size: 12px; font-weight: 500; color: var(--text-3); margin: 0 0 8px; }
  .prose { color: var(--text-2); font-size: 13px; line-height: 1.6; margin: 0; }
  .message { white-space: pre-wrap; color: var(--text); }
  .note { border: 1px solid var(--border-2); border-radius: 8px; padding: 10px 12px; color: var(--text-2); font-size: 12.5px; line-height: 1.5; }
  .note .section-label { margin-bottom: 4px; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; margin: 0 6px 6px 0;
    border-radius: 5px; border: 1px solid var(--border-2); color: var(--text-2); font-size: 12px; }
  a.chip:hover { background: var(--hover); color: var(--text); }
  .part { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .part:last-child { border-bottom: none; }
  .excerpt { color: var(--text-2); margin-bottom: 6px; }
  .linked { display: flex; flex-direction: column; }
  .linked a { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); color: var(--text); }
  .linked a:last-child { border-bottom: none; }
  .linked a:hover { color: var(--accent-text); }
  .linked .answer { color: var(--text-3); }

  /* compose: the inbox's message box and a question's answer box */
  .compose-wrap { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .compose { display: flex; flex-direction: column; gap: 8px; }
  .box-area { width: 100%; min-height: 72px; resize: vertical; outline: none; padding: 9px 11px;
    background: var(--raised); border: 1px solid var(--border-2); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 13px; line-height: 1.55; }
  .box-area:focus { border-color: var(--accent); }
  .box-area::placeholder { color: var(--text-3); }
  .compose-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hint { color: var(--text-3); font-size: 12px; }
  .primary { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 6px; border: none;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 500; }
  .primary:disabled { opacity: .45; cursor: default; }
  .compose .error { padding: 0; }

  /* actions on a resource, and the small forms they open */
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .action-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--border-2); background: transparent; color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
  .btn:hover, .btn.on { background: var(--hover); color: var(--text); }
  .btn.danger { color: var(--danger); }
  .action-form { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--border-2); border-radius: 8px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; color: var(--text-3); }
  .input { height: 30px; padding: 0 9px; background: var(--raised); border: 1px solid var(--border-2); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13px; outline: none; }
  .input:focus { border-color: var(--accent); }
  .form-buttons { display: flex; gap: 6px; }
  .primary.danger-fill { background: var(--danger); color: #1a0f0d; }
  .setting .toggle { margin-left: 0; align-self: flex-start; }
  .search-bar { display: flex; align-items: center; gap: 10px; }
  .search-input { flex: 1; height: 34px; }
  .search-bar .toggle { margin-left: 0; }
  .searchrow, .hitrow { display: grid; gap: 12px; }
  .searchrow { grid-template-columns: 72px 44px minmax(0, 1fr); }
  .hitrow { grid-template-columns: 52px 48px minmax(0, 1fr); align-items: start; }
  .searchrow .tag, .hitrow .tag { text-align: left; }
  .hit { white-space: normal; overflow-wrap: anywhere; }
  mark { background: rgba(94, 100, 201, .35); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
  .setting { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; }

  /* markdown, rendered by app.js */
  .md > :first-child { margin-top: 0; }
  .md :is(h1, h2, h3, h4, h5, h6) { font-size: 13.5px; font-weight: 600; color: var(--text); margin: 1.2em 0 .4em; }
  .md p { margin: .6em 0; }
  .md ul, .md ol { margin: .4em 0 .8em; padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md code { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: .05em .35em;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { background: var(--raised); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .md pre code { background: none; border: none; padding: 0; }

  /* a doc's attachments */
  .attachment-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .attachment-card { display: flex; align-items: center; gap: 10px; min-width: 180px; max-width: 100%;
    border: 1px solid var(--border-2); border-radius: 8px; padding: 9px 12px; }
  .attachment-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .attachment-name { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-meta { color: var(--text-3); font-size: 12px; }

  /* an environment's home */
  .home { max-width: 1100px; padding: 24px 28px 64px; display: flex; flex-direction: column; gap: 26px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--raised); color: var(--text-2); }
  .stat:hover { border-color: var(--border-2); color: var(--text); }
  .stat-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
  .stat-n { font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat.hot .stat-n { color: var(--accent-text); }
  .home-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }
  .home-head h2 { font-size: 13.5px; font-weight: 600; margin: 0; }
  .home-head .n { color: var(--text-3); font-size: 12.5px; }
  .home-head .more { margin-left: auto; font-size: 12.5px; }
  .block { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .block .row:last-child { border-bottom: none; }
  .block .ghead { position: static; }

  .list, .panel-body, .page, .side { scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }

  @media (max-width: 960px) {
    .side { display: none; }
    .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 5; box-shadow: -12px 0 32px rgba(0, 0, 0, .45); }
  }
  @media (max-width: 640px) {
    .todorow { grid-template-columns: 22px 22px 36px minmax(0, 1fr) 56px; }
    .inboxrow, .questionrow { grid-template-columns: 22px 36px minmax(0, 1fr) 56px; }
    .todorow .cite, .inboxrow .cite, .questionrow .cite { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
