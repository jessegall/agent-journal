<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>journal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  /* no scrollbars anywhere: what scrolls says so by its content, not by a bar beside it */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  :root {
    color-scheme: dark;
    --side: #0d0e10; --bg: #131416; --raised: #18191c; --hover: #1d1e22; --sel: #212329;
    --border: #25272b; --border-2: #2f3136;
    --text: #e6e7ea; --text-2: #a9acb3; --text-3: #83868e;
    --accent: #5e64c9; --accent-text: #a3a8f0; --warn: #c9955e; --danger: #df8b7e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #app { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    /* NO LIGATURES ANYWHERE. This viewer prints commands — `--continue`, `--resume=<id>`, `!=` — in
       ordinary text as well as in code, and a font that joins `--` into one long dash makes the flag
       unreadable and uncopyable to the eye. Nothing here is prose that wants them. */
    font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "calt" 0;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { color: var(--text); }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  .app { display: flex; height: 100%; overflow: hidden; }
  /* several journals open: a thin strip in this project's colour along the very top, its name on a small tab */
  .app.striped { box-sizing: border-box; padding-top: 3px; }
  .project-strip { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; background: var(--strip); pointer-events: none; }
  /* the font is spelled out: a `font` shorthand holding `inherit` is invalid, so a button fell back to its own larger size */
  .project-strip-name { position: absolute; top: 0; left: 50%; transform: translateX(-50%); padding: 5px 9px 3px;
    border: none; border-radius: 0 0 6px 6px; background: var(--strip); color: var(--strip-label, #0d0e10);
    font-family: inherit; font-size: 10px; font-weight: 600; line-height: 12px;
    white-space: nowrap; pointer-events: auto; cursor: pointer; transition: padding-bottom .12s; }
  .project-strip-name:hover, .project-strip-name[aria-expanded="true"] { padding-bottom: 4px; filter: brightness(1.08); }
  .project-strip-name:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .strip-drop { position: fixed; top: 20px; left: 50%; right: auto; transform: translateX(-50%); z-index: 61; }
  .journal-dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; vertical-align: 1px; }

  /* A NEW VERSION OUTRANKS THE JOURNAL STRIP: it sits ABOVE it, in its own row, because the multi-
     journal band answers "which project" and this answers "is this project current" — a more urgent
     fact that would otherwise be buried in a card the activity dock nobody opens by default. */
  :root { --update-band-h: 26px; }
  .app.has-update-band { box-sizing: border-box; padding-top: var(--update-band-h); }
  .app.has-update-band.striped { padding-top: calc(var(--update-band-h) + 3px); }
  .app.has-update-band .project-strip,
  .app.has-update-band .project-strip .project-strip-name { top: var(--update-band-h); }
  .app.has-update-band .strip-drop { top: calc(var(--update-band-h) + 20px); }
  .update-band { position: fixed; top: 0; left: 0; right: 0; height: var(--update-band-h); z-index: 62;
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: color-mix(in srgb, var(--accent) 30%, var(--bg-2, #14161a)); color: var(--text);
    font-size: 11.5px; }
  .update-band-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .update-band-go { flex: none; padding: 3px 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 6px; background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text);
    font: inherit; font-size: 11px; cursor: pointer; }
  .update-band-go:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 38%, transparent); }
  .update-band-go:disabled { opacity: .6; cursor: default; }
  .update-band-x { flex: none; padding: 2px 5px; border: 0; border-radius: 6px; background: none; color: inherit; opacity: .75; }
  .update-band-x:hover { opacity: 1; background: rgba(255, 255, 255, .12); }
  .update-band-x .ico { width: 12px; height: 12px; }

  /* sidebar */
  .side { width: 236px; flex: none; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 18px; padding: 12px 0; overflow-x: hidden; overflow-y: auto; }
  .side > * { flex: none; }
  /* each section pads itself, so the Activity section can run edge to edge */
  .side > .project { margin-inline: 10px; }
  .side > .journal-switch { margin-inline: 10px; }
  button.project { width: 100%; background: transparent; border: none; border-radius: 6px; cursor: pointer; text-align: left; font-family: inherit; }
  button.project:hover { background: var(--hover); }
  button.project .fold { margin-left: auto; }
  /* the sidebar clips what sticks out, so the list keeps to its width */
  /* A DROPDOWN MAY BE WIDER THAN THE THING IT HANGS FROM. Pinned to both edges of the sidebar it
     was 215px, and its own heading — "Journals running on this machine" — wrapped to two lines. */
  /* IT SCROLLS RATHER THAN RUNNING OFF THE SCREEN. One machine had twenty viewers up at once —
     test journals, since fixed — and the list went past the bottom of the window with no way down. */
  .journal-switch .drop, .strip-drop { max-height: min(60vh, 420px); overflow-y: auto; }
  .journal-switch .drop { left: 0; right: auto; top: 36px; width: max-content;
    min-width: 100%; max-width: 320px; }
  /* this journal, in both pickers: selected, and still answering the pointer without looking like a link */
  .journal-switch .drop-row.current, .strip-drop .drop-row.current { background: var(--sel); cursor: default; }
  .journal-switch .drop-row.current:hover, .strip-drop .drop-row.current:hover { background: color-mix(in srgb, var(--sel) 88%, var(--text) 12%); }
  .side > .group { padding-inline: 10px; }
  .project { display: flex; align-items: center; gap: 9px; padding: 6px 8px; font-weight: 600; font-size: 13.5px; color: var(--text); }
  .project:hover { color: var(--text); }
  .project .logo { width: 20px; height: 20px; border-radius: 5px; background: #2a2c33; display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: var(--text-2); }
  .group { display: flex; flex-direction: column; gap: 1px; }
  .side { display: flex; flex-direction: column; }
  .side-foot { display: flex; flex-direction: column; gap: 2px; margin: auto 0 -12px; padding: 6px 10px 8px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
  .side-foot-version { box-sizing: border-box; height: 22px; margin: 0 -10px 2px; padding: 0 10px; display: flex; align-items: center;
    border-radius: 6px; font-size: 10.5px; color: var(--text-3); text-decoration: none; }
  .side-foot-version:hover { color: var(--text); }
  .about-log h2 { margin-top: 28px; font-size: 15px; }
  @keyframes env-blink { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .side-foot .env-dot.live { animation: none; } }
  .activity-text { font-size: 12px; color: var(--text-2); line-height: 1.45; }
  .activity-row { display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; }
  /* a new Activity line slides down in, an old one fades out, and the rest glide */
  .act-enter-active { transition: opacity .24s ease-out, transform .24s cubic-bezier(.2, .8, .2, 1); }
  .act-enter-from { opacity: 0; transform: translateY(-8px); }
  .act-leave-active { transition: opacity .18s ease-in; }
  .act-leave-to { opacity: 0; }
  .act-move { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-reduced-motion: reduce) { .act-enter-active, .act-leave-active, .act-move { transition: none; } }
  .activity-row .activity-text { overflow-wrap: anywhere; }
  .activity-title { font-size: 11.5px; color: var(--text-3); line-height: 1.4; overflow-wrap: anywhere; }
  /* a call through an MCP server: its own line, opening to the calls it holds */
  .activity-mcp { flex-direction: column; align-items: stretch; gap: 4px; }
  .activity-mcp-head { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
    padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .activity-mcp-head:hover .activity-text { color: var(--text); }
  .activity-mcp-calls { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 2px 2px; }
  .activity-mcp-call { padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--raised); color: var(--text-3); font-size: 11px; }
  .activity-age { font-size: 11px; color: var(--text-3); white-space: nowrap; opacity: .8; }
  .activity-n { margin-left: .35em; font-size: 10.5px; color: var(--text-3); opacity: .65; font-variant-numeric: tabular-nums; }
  .activity-n::before { content: "·"; margin-right: .35em; }
  .activity-d { margin-left: .35em; font-size: 10.5px; color: var(--text-3); opacity: .65; }
  .activity-d::before { content: "·"; margin-right: .35em; }
  /* PLAIN TEXT, LIKE EVERY OTHER LINE. The boxes were drawn when this column was the only place
     anything was said; what needs the user is in the rail now, and a second highlight beside it is
     the same news twice. An alert keeps its colour — on the words, not around them. */
  .activity-alert { margin: 4px 0; padding: 5px 8px; gap: 8px; }
  .activity-alert .activity-title { color: color-mix(in srgb, var(--warn) 80%, var(--text-3)); }
  .activity-alert-body { display: flex; flex-direction: column; gap: 1px; color: inherit; }
  .activity-alert .activity-text { color: var(--text); }
  .activity-actions { display: flex; gap: 6px; }
  .btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
  .activity-soft { background: none; }
  /* a commit is a line like the others; only its sha is set apart, because a sha is read character
     by character and everything else here is read as a sentence */
  .activity-commit { margin: 0; padding: 5px 8px; }
  .activity-commit .activity-d { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent-text); opacity: 1; }
  .activity-link { color: inherit; border-radius: 7px; }
  .activity-head { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -10px; padding: 0 10px;
    border-bottom: 1px solid var(--border); box-sizing: border-box; }
  .activity-head .group-label { padding-block: 0; }
  .activity-head-tools { display: flex; align-items: center; gap: 2px; }
  .activity-head-tools .icon-btn { position: relative; }
  /* the Activity column clips what sticks out, so the list spans the header instead of hanging off its button */
  .activity-head { position: relative; }
  .activity-head .drop-wrap.crew { position: static; }
  .activity-head .drop { left: 8px; right: 8px; top: 44px; width: auto; }
  .activity-dock { width: 290px; flex: none; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0 10px;
    background: var(--side); border-left: 1px solid var(--border); }
  /* the update notice: the foot of the right sidebar, and there is no way to close it */
  .update-bar { flex: none; margin: 8px -10px 0; padding: 10px 12px 12px; border-top: 1px solid var(--border); background: #17191d; }
  .update-bar p { margin: 0; }
  .update-bar-head { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .update-bar-note { margin-top: 3px !important; font-size: 12px; line-height: 1.5; color: var(--text-3); }
  /* the upgrade is the agent's job, so the button asks it rather than doing it here */
  .update-bar-go { margin-top: 8px; height: 26px; padding: 0 11px; border: none; border-radius: 7px;
    background: var(--accent); color: #fff; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .update-bar-go:hover { filter: brightness(1.08); }
  .update-bar-go:disabled { opacity: .6; cursor: default; }
  .update-bar-how { margin-top: 6px !important; font-size: 12px; color: var(--text-2); }
  .update-bar code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--text); }
  .plan-paused-why { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--text-3); }
  .activity-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .activity-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 12px; }
  /* Settings as grouped rows: a label, its current value, and the one action that changes it; a form opens under its row */
  .settings-page { padding: 26px 28px 56px; display: flex; flex-direction: column; gap: 26px; max-width: 720px; }
  .settings-group { display: flex; flex-direction: column; gap: 10px; }
  .settings-group h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .settings-note { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text-3); }
  .settings-card { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: #151619; }
  .settings-row { box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 46px; padding: 8px 16px; border-bottom: 1px solid #1f2125; }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { flex: 1; min-width: 0; margin: 0; font-size: 13px; color: var(--text); }
  .settings-value { flex: none; font-size: 12.5px; color: var(--text-3); }
  .settings-row .actions { display: contents; }
  .settings-row .action-form, .settings-wide { flex-basis: 100%; }
  .activity-link:hover { background: var(--hover); }
  .activity-link:hover .activity-text { color: var(--text); }
  .group-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding: 4px 8px 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fold-head { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0;
    font-family: inherit; text-align: left; cursor: pointer; border-radius: 6px; }
  .fold-head:hover { color: var(--text-2); }
  .fold { width: 5px; height: 5px; margin-right: 4px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg); transition: transform .15s; opacity: .7; }
  .fold.shut { transform: rotate(-45deg); }
  /* a list group's header folds its rows away; the count stays, so a folded group still says how much it holds */
  .ghead-fold { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: auto; margin-right: -4px; padding: 0;
    border: none; background: transparent; color: var(--text-3); cursor: pointer; }
  .ghead-fold:hover { color: var(--text); }
  .ghead-fold .fold { margin: 0; }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
  .item:hover { background: var(--hover); color: var(--text); }
  .item.on { background: var(--sel); color: var(--text); }
  .item .ico { width: 15px; height: 15px; color: var(--text-3); }
  .item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .item .count.hot { color: var(--accent-text); font-weight: 500; }
  /* making one is a line of work beginning, so it sits with the list of them rather than in a
     settings page: the same row shape as an environment, quieter until it is wanted */
  .item-new { width: 100%; border: 0; background: none; font: inherit; font-size: 13px;
    color: var(--text-3); text-align: left; cursor: pointer; }
  .item-new:hover { background: var(--hover); color: var(--text-2); }
  .env-new { padding: 4px 8px 8px; }
  .env-new .field { width: 100%; }
  .env-new .error { margin: 6px 0 0; font-size: 11.5px; }
  .env-dot { position: relative; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box;
    border: 1.5px solid var(--text-3); background: transparent; opacity: .7; flex: none; margin: 0 4px; }
  /* an agent working here: the accent colour with a slow, soft ring; green is kept for done */
  .env-dot.live { border-color: var(--accent); background: var(--accent); opacity: 1; }
  .env-dot.live::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: var(--accent);
    opacity: .3; animation: env-pulse 2.6s ease-out infinite; }
  @keyframes env-pulse { from { transform: scale(.45); opacity: .38; } to { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .env-dot.live::after { animation: none; opacity: .2; } }

  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px; border-bottom: 1px solid var(--border); }
  .top-tools { display: flex; align-items: center; gap: 6px; flex: none; }
  /* the agent's state under the top bar on every page; only the description gives way when the bar is narrow */
  .statusbar { height: 52px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 20px;
    border-bottom: 1px solid var(--border); background: #17181b; overflow: hidden; }
  .statusbar.held { background: #1b1a16; }
  .statusbar-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--text-3); }
  .statusbar-dot.live { background: var(--accent); }
  .statusbar-dot.held { background: #d9a441; }
  /* CENTRED, NOT ON A BASELINE. The sentence rolls inside a box of its own height now, so there is
     no shared baseline to sit on: the state sat low and the sentence high. */
  /* ONE LINE OF TEXT, NOT A ROW OF BOXES. Every element added here fought `.statusbar-text span`
     for the width and lost — three rounds of the command being flung to the right edge. It is a
     sentence now: the state, the work, a middot, the command, all inline, cut as one. */
  .statusbar-text { flex: 1 1 0%; min-width: 0; display: flex; align-items: center; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; margin: 0 -7px; padding: 3px 7px; border: none; border-radius: 7px;
    background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .statusbar-text:hover { background: rgba(255, 255, 255, .04); }
  .statusbar-text b { flex: none; font-weight: 500; font-size: 13.5px; margin-right: 8px; }
  /* the work does not give way to the command: both are held at their own width, and only a narrow
     bar (the media query below) lets the sentence shrink */
  .statusbar-text .statusbar-roll { flex: 0 0 auto; min-width: 0; position: relative; display: flex;
    align-items: baseline; font-size: 13px; color: var(--text-2);
    text-decoration: underline; text-decoration-color: #3a3d44; text-underline-offset: 3px; }
  .statusbar-text .statusbar-head { flex: none; white-space: pre; }
  /* THE WORK DOES NOT MOVE WHEN A COMMAND APPEARS. It used to shrink by the width of the command
     arriving beside it, which reads as the sentence twitching every time a command starts; it keeps
     its own width and only a very long one is cut. */
  .statusbar-text .statusbar-line { flex: 0 0 auto; min-width: 0; max-width: 62ch;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the command: right after the work, small and quiet, and it rolls when one follows another */
  .statusbar-text .statusbar-running { flex: none; display: inline-flex; align-items: center;
    position: relative; font-size: 10px; color: var(--text-4, #6b6e76); text-decoration: none; }
  .statusbar-text .statusbar-running-dot { margin-right: 4px; opacity: .5; }
  .statusbar-text .statusbar-run-line { display: inline-flex; align-items: center; max-width: 40ch;
    margin-left: 7px; }
  .statusbar-text .statusbar-run-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statusbar-text .statusbar-running-for { flex: 0 0 auto; margin-left: 5px; font-size: 9.5px;
    font-variant-numeric: tabular-nums; opacity: .8; }
  .roll-enter-active { transition: opacity 180ms ease, transform 180ms cubic-bezier(.22,.7,.3,1); }
  .roll-leave-active { transition: opacity 140ms ease, transform 140ms cubic-bezier(.22,.7,.3,1); }
  .roll-enter-from { opacity: 0; transform: translateY(5px); }
  .roll-leave-to { opacity: 0; transform: translateY(-5px); }
  .roll-leave-active { position: absolute; }
  @media (prefers-reduced-motion: reduce) { .roll-enter-active, .roll-leave-active { transition: none; } }
  /* the branch this project is on, left of the Auto switch; the to-do is named in the sentence itself */
  .statusbar-facts { flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  a.statusbar-facts { text-decoration: none; }
  a.statusbar-facts:hover { color: var(--text-2); }
  .statusbar-facts .ico { flex: none; width: 12px; height: 12px; }
  .statusbar-facts > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .statusbar-tools { margin-left: auto; flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 14px; }
  .statusbar-tools::before { content: ""; align-self: stretch; width: 1px; margin: 3px 0;
    background: var(--line, rgba(255,255,255,.14)); }
  .statusbar-auto { flex: none; display: inline-flex; align-items: center; gap: 7px; border: none; background: transparent; padding: 0;
    font-size: 11.5px; color: var(--text-2); cursor: pointer; }
  .statusbar-auto .ico { width: 12px; height: 12px; opacity: .65; }
  /* the agent's latest reply, at the top of the Activity column, so what it wrote in the terminal is readable here */
  /* the quick menu: a command box over the whole app that sends what is typed to the agent unless a command is picked */
  .quick-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(4, 5, 6, .62); }
  .quick-menu { position: fixed; z-index: 51; top: 92px; left: 50%; transform: translateX(-50%); width: min(580px, calc(100% - 56px));
    display: flex; flex-direction: column; overflow: hidden; border: 1px solid #33363d; border-radius: 14px; background: #151619; box-shadow: 0 26px 64px rgba(0, 0, 0, .6); }
  .quick-head { flex: none; display: flex; align-items: center; gap: 11px; height: 54px; padding: 0 15px; border-bottom: 1px solid var(--border); }
  .quick-head .ico { flex: none; width: 15px; height: 15px; color: var(--text-3); }

  .ghead .sort-select:hover { color: var(--text-2); }
  .ghead .sort-dir { width: 18px; height: 18px; }
  .ghead .sort-dir .ico { width: 11px; height: 11px; opacity: .7; }
  .ghead .sort-dir:hover .ico { opacity: 1; }
  .more-rows { margin: 10px 20px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .switch { position: relative; width: 26px; height: 16px; flex: none; padding: 0; border: none; border-radius: 8px; background: var(--border-2); }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-2); transition: transform .15s; }
  .switch.on { background: var(--accent); }
  .switch.on .knob { transform: translateX(10px); background: #fff; }
  /* THE SWITCH SAYS WHICH WAY IT IS. A toggle beside the word "Auto" says what it is called, never
     what it is doing; the word inside says the state, and the opposite of auto is manual. */
  /* ONE WIDTH FOR BOTH WORDS: it changes state, it does not change size, or the bar shifts under the
     hand that pressed it. The dot slides between the two ends rather than appearing at the other.
     ONE WORD, BOTH WAYS: the toggle says which way it is set, so the word only has to say what it
     is — "manual" was the switch saying its own state twice. */
  .switch.worded { width: 52px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center;
    transition: background .15s; }
  .switch.worded .switch-word { flex: 1 1 auto; padding: 0 6px 0 18px; font-size: 10px; letter-spacing: .04em;
    line-height: 18px; text-align: center; color: var(--text-2); }
  .switch.worded .knob { top: 3px; left: 3px; transition: transform .18s cubic-bezier(.2, .8, .2, 1), background .15s; }
  .switch.worded.on .switch-word { padding: 0 18px 0 6px; color: #fff; }
  .switch.worded.on .knob { transform: translateX(34px); }
  @media (prefers-reduced-motion: reduce) { .switch.worded .knob { transition: none; } }
  .row .num { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  /* after the number: a question marker, warm while a linked question waits on you, faint once answered */
  .row .qmark { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; }
  .row .qmark .ico { width: 13px; height: 13px; }
  .row .qmark.open { color: var(--warn); }
  .row .qmark.answered { color: var(--text-3); opacity: .6; }
  .row .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; overflow-wrap: anywhere; }
  .row .cite, .row .age, .row .tag { color: var(--text-3); font-size: 12.5px; text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .age { overflow: visible; text-overflow: clip; }
  .row .age.warn { color: var(--warn); }
  .row .sub { color: var(--text-3); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.struck .title { color: var(--text-3); text-decoration: line-through; }
  .ico { width: 16px; height: 16px; color: var(--text-3); flex: none; }
  .ico.hot { color: var(--warn); }
  .dot { width: 10px; height: 10px; box-sizing: border-box; border: 2px solid; border-radius: 50%; flex: none; display: inline-block; margin: 0 3px; }
  .empty { color: var(--text-3); padding: 16px 20px; margin: 0; }
  .error { color: var(--danger); padding: 12px 20px; margin: 0; }
  .muted { color: var(--text-3); }
  /* Home, the cockpit: a state band, then what waits on you beside what the agent is doing */
  /* Home: one column that answers whether anything needs the user; flat lists on hairlines, one accent */
  /* THE HOME DOES NOT SCROLL; ITS COLUMNS DO. One page scroll behind a chat is what made the thread
     run past its own end, put the rail's edge wherever the rail's content happened to stop, and grow
     the page instead of keeping the conversation on screen. The shell is fixed, the turns scroll, the
     rail scrolls, and the writing box is simply the last row of its column. */
  /* the side padding is on what needs it, not on the home: a bar whose rule stops short of both edges
     reads as a box, and the status bar directly above it runs the full width */
  /* NO CAP ON THE PAGE. A max-width here left the whole home sitting left once the window was wider
     than it, so the agent bar's rule and the rail both stopped short of the right edge. The cap belongs
     on the reading column, which is the only part that suffers from an over-long line. */
  .home { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  /* the thread keeps its gutters; the rail is flush to the window's edge, and its own entries carry
     the inset off the divider so the rule is the only thing between the two columns */
  .home-main { flex: 1; min-height: 0; display: flex; align-items: stretch; }
  /* the bar is the chat's now, so the chat's side padding must not indent it: it runs the column's
     width like the writing box's rule does, and the padding lives on what is inside */
  .home-thread { --home-gutter: 24px; padding: 0; }
  .home-thread > .thread { padding: 0 var(--home-gutter); }
  /* EVERY CARD IS FLUSH, not the plan alone: the section carried the inset, so the cards inside it sat
     off the divider while the plan card ran to both edges. The section gives its padding to its
     heading, and each card carries its own. */
  .home-rail .home-section { padding: 0; }
  /* divided by a rule and nothing else, the way the list pages divide their rows: a gap between cards
     makes a border read as an outline around each rather than one line between two */
  /* THE RAIL SCROLLS ITSELF, so the slot must not cap its own height: a 268px cap written when this
     lived on a full-width home clipped the third card's button behind the fourth card. */
  .home-rail .needs-slot { display: flex; flex-direction: column; gap: 0;
    max-height: none; overflow: visible; padding-top: 0; }
  .home-rail .needs-card { margin: 0; border-bottom: 1px solid var(--border); }
  .home-rail .home-line, .home-rail .home-more { padding-left: var(--rail-gutter); padding-right: var(--rail-gutter); }
  .home-rail .home-section:first-child { padding: 0; }
  .home-rail .home-section:first-child + .home-section { margin-top: 0; padding-top: 16px; }
  /* THE CARD IS INFORMATION, THEN AN ACTION ON IT. The tint marks what the plan IS and stops at the
     rule; the button sits under that rule as a footer, so it reads as something you do to the card
     rather than another part of it. */
  /* the status colours live on the card's own band, which the body's band replaces here, so the card
     names the colour and the body draws it — one place per status rather than four rules twice */
  .home-rail .work-now { padding: 0; gap: 0; --band: var(--accent); }
  .home-rail .work-now.ready { --band: #d9a441; }
  .home-rail .work-now.parked { --band: var(--text-3); }
  .home-rail .work-now.finished { --band: #3ecf74; }
  /* THE BAND RUNS THE WHOLE CARD AND THE ACTION IS ITS BOTTOM EDGE. Separating the band from the
     button stopped the button reading as part of the tinted thing, but the fault was the button being
     a rounded pill inset in a padded box: a card flush to its column cannot hold one without it
     looking dropped in. So the band goes back to full height, and the footer IS the button — full
     bleed and square, with the rule above it doing the separating the padding was doing. */
  .home-rail .work-now::before { background: var(--band); opacity: .8; }
  .home-rail .work-now-body { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px 10px 14px; }
  .home-rail .work-now-foot { padding: 0; border-top: 1px solid var(--border); }
  .home-rail .work-now-foot button { display: flex; width: 100%; justify-content: center; gap: 5px;
    margin: 0; padding: 9px 12px 9px 14px; border: 0; border-radius: 0; background: transparent;
    color: var(--accent-text); font-size: 12px; font-weight: 500; }
  .home-rail .work-now-foot button:hover { background: color-mix(in srgb, var(--band) 16%, transparent);
    color: var(--text); }
  /* A COLUMN THIS NARROW HAS NO ROOM FOR A BUTTON BESIDE TEXT: it takes the width the text needed.
     Every action inside a rail card goes on its own line at the bottom, full width. */
  .home-rail .work-now-bar { flex-wrap: wrap; gap: 5px 10px; }
  .home-rail .work-now-bar .progress-track { flex: 1 0 100%; }
  .home-rail .needs-card-go { flex: 1 0 100%; justify-content: center; margin-top: 2px; padding: 6px 10px; }
  .home-rail .needs-card-foot { display: flex; }
  .home-rail .needs-card-act { flex: 1 0 100%; }
  /* the column keeps its place when there is nothing in it, and says what is empty: the list of
     things waiting on YOU, which is not the same claim as nothing happening */
  .home-rail-empty { display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 34px 18px 0; text-align: center; color: var(--text-3); }
  .home-rail-empty p { margin: 0; font-size: 11.5px; }
  .home-rail-empty .ico { width: 20px; height: 20px; opacity: .5; }
  .home-thread { flex: 1 1 auto; min-width: 0; min-height: 0; max-width: 1080px; display: flex; flex-direction: column; }
  /* a RANGE, not a number: with the Activity column hidden the page gains its whole width, and a
     fixed rail left all of it to the thread while its own cards stayed as cramped as before */
  /* NO GAP BETWEEN THE STRIP AND WHAT IT INTRODUCES. The column used to put 22px between everything
     in it, which is right between SECTIONS and wrong under a tab strip: a bar with a rule along the
     bottom and then a gap reads as a bar belonging to nothing. Sections that still want the air ask
     for it themselves. */
  /* the handle between the columns: the rule itself, with a few pixels of grab either side of it */
  .home-divider { flex: none; width: 5px; margin: 0 -2px; cursor: col-resize; background: transparent;
    transition: background .15s ease; z-index: 3; }
  .home-divider:hover, .home-divider.dragging { background: var(--accent); opacity: .5; }
  .home-rail { flex: none; width: clamp(288px, 27%, 400px); min-height: 0; overflow-y: auto; scrollbar-width: none;
    display: flex; flex-direction: column; gap: 0;
    padding: 0; border-left: 1px solid var(--border); }
  /* the last thing in the column keeps clear of the window's edge — unless the foot bar is the last
     thing, and then IT is the edge and padding under it is a gap the bar cannot cover */
  .home-rail > :last-child { padding-bottom: 18px; }
  .home-rail > .rail-foot:last-child { padding-bottom: 0; }
  .home-rail > .home-section + .home-section { margin-top: 22px; }
  .home-rail::-webkit-scrollbar { width: 0; }
  /* ONE FLUSH FEED, NOT A STACK OF CARDS. In a column this narrow a card is a border, a background, a
     radius and an inset tint all fighting over the same forty characters — four kinds of chrome doing
     what one hairline does. So the cards keep their component and lose their box here: each entry is
     its text with the kind's own tint on the left, sections divided by a rule, content flush right. */
  /* THE RAIL IS THREE LISTS AND THE TABS SAY WHICH. Same bar the headings were, so the strip and a
     section heading are the same object at the top of the column rather than two competing ones. */
  /* THE STRIP DOES NOT COMPRESS AND DOES NOT SCROLL AWAY. Without `flex: none` a long list under it
     squeezed it, and the tabs' own height was decided by how many notifications there were. */
  /* the tabs INSIDE a tab: they scroll with the list rather than sticking under the bar above them */
  .rail-tabs { position: sticky; top: 0; z-index: 2; flex: none; display: flex; align-items: stretch;
    height: 34px; padding: 0 var(--rail-gutter); gap: 14px;
    border-bottom: 1px solid var(--border); background: var(--raised); }
  /* THE UNDERLINE TAKES NO SPACE. As a border it sat inside the tab's box, so selecting one moved
     its own text up a pixel; as an inset shadow it lies over the bar's rule and moves nothing. */
  .rail-tab { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0;
    background: none; font: inherit; font-size: 11.5px;
    letter-spacing: .03em; color: var(--text-3); white-space: nowrap; cursor: pointer; }
  .rail-tab:hover { color: var(--text-2); }
  /* the browser's own ring is a rounded box, which made a tab read as a button with a border */
  .rail-tab:focus { outline: none; }
  .rail-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 4px; }
  .rail-tab.on { color: var(--text); box-shadow: inset 0 -1px 0 var(--accent); }
  .rail-tab-n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .rail-tab.on .rail-tab-n, .rail-tab-n.hot { color: var(--accent-text); }
  /* A BAR UNDER A BAR IS NOT THE SAME BAR. It carried the tabs' own ground and nearly their size,
     so the rail read as two competing strips. Darker than them, smaller, and quieter — and it must
     come after `.rail-tabs` here, because both classes are on the one element and order decides. */
  .rail-tabs.rail-subtabs { position: static; height: 24px; margin-top: -1px; background: var(--side); }
  .rail-subtabs .rail-tab { font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-4, #6b6e76); }
  .rail-subtabs .rail-tab:hover { color: var(--text-3); }
  .rail-subtabs .rail-tab.on { color: var(--text-2);
    box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  .rail-subtabs .rail-tab-n { font-size: 10px; }
  /* a row in the rail: the list page's row with everything the width cannot afford taken out */
  /* THE ROWS ARE ONE LIST, not a column of sections: the rail puts 22px between its sections, and a
     row is not a section. They are divided by their own rule and nothing else, as every list page is. */
  /* a notification reads as a headline, the thing it is about, and then its words */
  /* A NOTIFICATION IS TWO LINES: what happened and when, then the words. They were one row of
     flex children, so the headline, the chip, the text and the time all sat on one line. */
  .rail-row.note-row { flex-direction: column; align-items: stretch; gap: 3px; }
  .rail-note-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail-note-top .rail-row-state { padding-top: 0; margin-left: auto; }
  .rail-note-head { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .rail-note-ref { padding: 0 5px; border-radius: 4px; background: var(--raised); color: var(--text-4, #6b6e76);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 9.5px; letter-spacing: 0;
    text-transform: none; }
  .rail-row.read .rail-note-head { opacity: .6; }
  .rail-list { display: flex; flex-direction: column; gap: 0; }
  .rail-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 36px;
    padding: 0 var(--rail-gutter, 12px); border: 0; border-bottom: 1px solid var(--border);
    background: none; font: inherit; text-align: left; color: var(--text-2); cursor: pointer; }
  .rail-row:hover { background: var(--hover); }
  .rail-row.sel { background: var(--sel); }
  .rail-row:disabled { cursor: default; }
  .rail-row .ico { flex: none; width: 13px; height: 13px; }
  .rail-row-n { flex: none; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .rail-row-title { flex: 1 1 auto; min-width: 0; font-size: 12.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .rail-row-state { flex: none; font-size: 11px; color: var(--text-3); white-space: nowrap; }
  /* A NOTIFICATION IS A SENTENCE, NOT A TITLE. Clamped to one line it ended in an ellipsis before
     it said what happened, so it wraps — and the age holds the top-right corner rather than riding
     the last line it happens to end on. */
  .rail-row.wrap { align-items: flex-start; padding-block: 9px; }
  .rail-row.wrap .rail-row-title { white-space: normal; overflow: visible; line-height: 1.45; }
  .rail-row.wrap .rail-row-state { padding-top: 1px; }
  /* the edge, not a border: a border would move the text of a tinted row 2px off every other one */
  .rail-row.tinted { box-shadow: inset 2px 0 0 var(--tint); }
  /* one already read is still worth showing, quietly: it is history rather than news */
  .rail-row.read .rail-row-title { color: var(--text-3); }
  /* stuck to the foot of the column the way the tabs are stuck to its head */
  .rail-foot { position: sticky; bottom: 0; z-index: 2; margin-top: auto; display: flex; align-items: center;
    height: 34px; padding: 0 var(--rail-gutter); border-top: 1px solid var(--border); background: var(--raised); }
  /* the bar is a bar, not a row that gives way: it is the last thing in a scrolling column, and a
     flex parent was taking its height back when the list above it grew */
  .rail-foot { flex: none; }
  /* A BUTTON THAT LOOKS LIKE A SENTENCE IS NOT A BUTTON. It clears every notification in the column
     and read as a caption under the list; it has an edge now, and a ground of its own. */
  .rail-foot-act { flex: none; padding: 3px 9px; border: 1px solid var(--border-2); border-radius: 6px;
    background: var(--raised); font: inherit; font-size: 11px; letter-spacing: .02em;
    white-space: nowrap; color: var(--text-2); cursor: pointer; }
  .rail-foot-act:hover:not(:disabled) { color: var(--text); background: var(--hover); border-color: var(--text-4, #3a3d44); }
  .rail-foot-act:disabled { color: var(--text-4, var(--text-3)); background: transparent; opacity: .5; cursor: default; }
  /* the reason a row is not moving, on the line that says it is not moving */
  .status-why { color: var(--text-3); }
  /* the file reader's title line: the name, and the way out to the bytes */
  .file-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .file-raw-link { flex: none; font-size: 11.5px; color: var(--text-3); text-decoration: none; }
  .file-raw-link:hover { color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; }
  /* A HEADING IN THE RAIL IS THE LIST PAGE'S GROUP HEADING, at the width this column has: the state
     is said once, over the rows that are in it, rather than repeated on the end of every row. */
  /* the same bar the notifications' Unread/Read strip is: darker than the rows, shorter, quieter —
     a divider between sections rather than a heading competing with the tabs above it */
  .rail-group { display: flex; align-items: center; justify-content: space-between; gap: 7px;
    height: 24px; padding: 0 var(--rail-gutter); border-bottom: 1px solid var(--border);
    background: var(--side); font-size: 10px; font-weight: 500; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-4, #6b6e76); }
  .rail-group-n { color: var(--text-4, #6b6e76); font-size: 10px; font-variant-numeric: tabular-nums;
    text-transform: none; }
  .rail-note { display: flex; align-items: stretch; }
  /* THE HEADING IS A BAR, THE SAME BAR THE LIST PAGES USE. It was a line of text with six pixels
     under it and nothing above it, so a section began with a word rather than with a division. It
     is `.ghead`'s shape now: a fixed height with its text centred in it and one rule along the
     bottom, which IS the separator. The sections need no border of their own with that in place,
     and no margin either: each one opens with its own bar. */
  .home-rail .home-section + .home-section { margin-top: 0; padding-top: 0; border-top: 0; }
  /* ONE GUTTER, AND EVERYTHING IN THE RAIL KEEPS TO IT. The heading sat flush at zero while the
     cards under it were inset sixteen, so a section's title and the titles it introduced started at
     two different places — and the card's own left and right differed by the width of its tint band,
     which is drawn at the card's edge and should not be paid for twice. */
  .home-rail { --rail-gutter: 14px; }
  .home-rail .home-head { flex-wrap: nowrap; align-items: center; height: 34px; padding: 0 var(--rail-gutter);
    border-bottom: 1px solid var(--border); background: var(--raised); }
  .home-rail .needs-card, .home-rail .work-card {
    margin: 0; padding: 10px var(--rail-gutter); border: 0; border-radius: 0; background: none; }
  /* the plan card carries its own band on its BODY, so it takes no inset here: an 11px one would
     push the band that far off the rail's edge */
  .home-rail .work-now { margin: 0; padding: 0; border: 0; border-radius: 0; background: none; }
  .home-rail .needs-card:hover, .home-rail .work-now:hover, .home-rail .work-card:hover { background: #17181b; }
  .home-rail .needs-card::before, .home-rail .work-now::before, .home-rail .work-card::before {
    top: 5px; bottom: 5px; }
  .home-rail .work-now.sel, .home-rail .needs-card.sel { background: var(--sel); }
  /* a card is reachable, so it says where the focus IS: nothing in the viewer relies on a hover to
     tell you what you are on */
  .needs-card:focus-visible, .work-now:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .home-rail .home-line { padding-left: 11px; }
  .home-rail .home-more { padding-left: 11px; }
  /* too narrow for two columns: the rail becomes a short strip above the thread, and its edge with it */
  @media (max-width: 820px) {
    .home-main { flex-direction: column; }
    .home-rail { order: -1; width: auto; max-height: 34%; padding: 0 0 18px; border-left: 0;
      border-bottom: 1px solid var(--border); }
  }
  /* a slim bar under the status bar: ONE ROW THAT STAYS ONE ROW. The facts sit across the full width
     where they fit, and the subagents fold into a count — a list that grows must never push the
     conversation down, which is why these left the space above the thread to begin with. */
  /* THE SAME HEIGHT AS THE RAIL'S TABS, because they sit side by side across one line: the agent's
     state on the left of it and the rail's tabs on the right. Four pixels apart reads as a mistake. */
  .agent-bar { flex: none; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 16px;
    font-size: 11.5px; color: var(--text-3); border-bottom: 1px solid var(--border); }
  /* the strip is the bar continuing, not a second thing under it: one rule goes under both */
  .agent-bar.open { border-bottom-color: transparent; }
  /* THE FACTS SCROLL RATHER THAN DISAPPEAR. In a narrow window the branch and the context fell off
     the end with nothing to say they were there; the row slides sideways instead, with no bar in the
     way of a 30px strip. */
  .agent-facts { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
  .agent-facts::-webkit-scrollbar { height: 0; }
  .agent-facts > * { flex: none; }
  .agent-fact, .agent-fact-lead { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .agent-fact .ico, .agent-fact-lead .ico { width: 12px; height: 12px; opacity: .65; }
  .agent-fact-lead { color: var(--text-2); }
  /* a fact that happens to be a link is still a fact: it reads like the ones beside it, and says it
     can be opened by answering the pointer, not by being a different colour standing still */
  a.agent-fact { color: inherit; text-decoration: none; }
  a.agent-fact:hover { color: var(--text-2); text-decoration: underline; text-decoration-color: #3a3d44;
    text-underline-offset: 3px; }
  .agent-fact-lead:hover { color: var(--text); text-decoration: underline; text-decoration-color: #3a3d44;
    text-underline-offset: 3px; }
  .agent-crew-toggle { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
    border: 0; border-radius: 6px; background: none; color: var(--text-3); font: inherit; font-size: 11.5px; cursor: pointer; }
  .agent-crew-toggle:hover { background: var(--hover); color: var(--text-2); }
  .agent-crew-toggle .ico { width: 13px; height: 13px; }
  .home-facts .first { color: var(--text-2); }
  .home-facts a.first { text-decoration: none; }
  .home-facts a.first:hover { color: var(--text); text-decoration: underline; text-decoration-color: #3a3d44; text-underline-offset: 3px; }
  /* the live subagents hang under the facts line, indented past it: part of the page's opening block, not a bar */
  /* ONE SUBAGENT TO A LINE: wrapped in a row, the model fell off the end of the one thing the user
     always wants to see. The top padding is gone with the rule that used to sit above it. */
  /* the strip lines up with the bar above it, not with an indent of its own, and it keeps a rule on
     BOTH sides: the bar's own line above it stays, and its own closes it off underneath */
  /* ONE RULE, NOT TWO. The bar's line and the strip's read as a two-pixel band with the thread
     column's own 2px gap between them; the strip lifts by that gap plus one, so its line lands
     exactly ON the bar's. */
  .crew-strip { flex: none; margin-top: -3px; display: flex; flex-direction: column; align-items: flex-start;
    gap: 2px; padding: 4px 9px 6px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  /* A COLUMN, NOT A RUN-ON LINE: names and models differ in length, so each fact used to start
     wherever the last one ended and nothing lined up down the strip. */
  .crew-line { display: flex; align-items: center; gap: 9px; height: 22px; padding: 0 7px; border: none; border-radius: 6px;
    background: transparent; text-align: left; cursor: pointer; animation: crew-in .28s ease-out both; }
  .crew-line:hover { background: #17181b; }
  /* a fact and its mark, the agent bar's vocabulary at the size the strip uses */
  /* ONE COLUMN, NOT FOUR. Fixed-width facts lined the marks up and left a stretch of nothing
     between them; the NAME holds a column, and the facts that follow read as one quiet line — the
     model first, because that is the one being looked for. */
  .crew-fact { flex: 0 1 auto; display: inline-flex; align-items: center; gap: 4px;
    min-width: 0; font-size: 10.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  .crew-fact + .crew-fact::before { content: ""; flex: none; width: 1px; height: 9px; margin-right: 7px;
    background: var(--border-2); }
  .crew-fact span { overflow: hidden; text-overflow: ellipsis; }
  .crew-fact .ico { width: 11px; height: 11px; opacity: .6; }
  .crew-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #6fae7d; animation: crew-pulse 1.8s ease-in-out infinite; }
  /* quiet: no tool call in a while and no stop either — dimmer than working, not greyed out like finished */
  .crew-line.quiet .crew-dot { background: #c9955e; animation: none; }
  /* a finished subagent is still here to click, and says so by not pulsing */
  .crew-line.done .crew-dot { background: #4a4d55; animation: none; }
  .crew-line.done .crew-name { color: var(--text-3); }
  .crew-name { flex: none; font-size: 11px; color: #a9acb3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes crew-in { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes crew-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .crew-line, .crew-dot { animation-duration: .01ms; animation-iteration-count: 1; } }
  /* THE CHAT ALONE — the extension's floating window asks for this with ?chat on the URL. What is
     hidden is everything whose job is to take you somewhere else: the journals rail, the side
     navigation, the to-do rail beside the thread, the Activity dock and the project strip. */
  .app.chat-only .side, .app.chat-only .home-rail, .app.chat-only .activity-dock,
  .app.chat-only .project-strip, .app.chat-only .top { display: none; }
  .app.chat-only .home-main { flex: 1; min-width: 0; }
  /* WHAT THE AGENT PINNED OVER THE CONVERSATION, under the agent bar: one line, and only its X
     takes it down. The tone is the agent's own call — a note, something that went well, a warning. */
  /* FLUSH, LIKE THE BARS ABOVE IT. The section holding the thread is a flex column with a 2px gap,
     which put a hairline of page between one notice and the next; they are one block of bars. */
  .chat-notice { flex: none; margin-bottom: -2px; display: flex; align-items: center; gap: 9px;
    padding: 7px 14px; border-radius: 0; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--accent) 10%, var(--bg)); color: var(--text); font-size: 12px; }
  .chat-notice:last-of-type { margin-bottom: 0; }
  .chat-notice-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .chat-notice-text { flex: 1; min-width: 0; }
  /* a button, not a link in a sentence: the notice exists BECAUSE there is something to open */
  .chat-notice-go { flex: none; padding: 3px 9px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: 6px; background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--text); font-size: 11.5px; text-decoration: none; }
  .chat-notice-go:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); color: #fff; }
  .chat-notice-x { flex: none; padding: 2px 5px; border: 0; border-radius: 6px; background: none;
    color: var(--text-3); }
  .chat-notice-x:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
  .chat-notice-x .ico { width: 11px; height: 11px; }
  .chat-notice.tone-good { background: color-mix(in srgb, #3d7a4f 16%, var(--bg)); }
  .chat-notice.tone-good .chat-notice-dot { background: #63b37c; }
  .chat-notice.tone-warn { background: color-mix(in srgb, #8a6a2f 18%, var(--bg)); }
  .chat-notice.tone-warn .chat-notice-dot { background: #d8a94a; }
  /* a face on a turn: small, under the bubble, and the one you left is marked as yours */
  .thread-faces { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 2px; }
  .thread-turn.mine .thread-faces { justify-content: flex-end; }
  .thread-face, .thread-face-pick { display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 6px; border: 1px solid var(--border); border-radius: 20px; background: var(--raised);
    font-size: 12px; line-height: 18px; cursor: pointer; }
  .thread-face:hover, .thread-face-pick:hover { border-color: var(--text-3); }
  .thread-face.mine { border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, var(--raised)); }
  .thread-face-n { font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .thread-face-pick { background: transparent; padding: 0 4px; border: 0; }
  .thread-face-pick:hover { background: rgba(255, 255, 255, .08); border: 0; }
  /* the tools bar holding faces is the same bar, only wider: it grows leftwards from its own edge */
  .thread-tools.picking { gap: 1px; padding: 1px 3px; }
  .thread-tools.picking .thread-tool .ico { width: 11px; height: 11px; }
  /* browsing the skills: a page of its own, because the agent's page lists them as one section */
  .skills-page { max-width: 900px; }
  .skills-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .skills-find { flex: 1; min-width: 220px; height: 34px; }
  .skills-only { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 8px;
    background: var(--raised); }
  .skills-only-tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 0;
    border-radius: 6px; background: none; color: var(--text-3); font: inherit; font-size: 12px; cursor: pointer; }
  .skills-only-tab:hover { color: var(--text-2); }
  .skills-only-tab.on { background: var(--bg); color: var(--text); }
  .skills-only-n { color: var(--text-4, #6b6e76); font-size: 11px; font-variant-numeric: tabular-nums; }
  .skills-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; }
  .skills-row { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 0;
    border-bottom: 1px solid var(--border); }
  .skills-row:last-child { border-bottom: 0; }
  .skills-row:hover { background: var(--hover); }
  .skills-row.picked { background: var(--sel); }
  .skills-open { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(150px, 220px) 1fr auto;
    align-items: center; gap: 12px; padding: 11px 12px; color: inherit; text-decoration: none; }
  .skills-name { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text); }
  .skills-name .ico { width: 13px; height: 13px; color: var(--text-3); }
  .skills-badge { padding: 0 6px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--accent-text); font-size: 10px; }
  .skills-what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-3); font-size: 12px; }
  .skills-where { color: var(--text-4, #6b6e76); font-size: 11px; }
  .skills-always { flex: none; padding: 4px 10px; border: 1px solid var(--border-2); border-radius: 7px;
    background: none; color: var(--text-3); font: inherit; font-size: 11.5px; cursor: pointer; }
  .skills-always:hover:not(:disabled) { color: var(--text); background: var(--raised); }
  .skills-always.on { border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); }
  .skills-always:disabled { opacity: .5; cursor: default; }
  @media (max-width: 720px) {
    .skills-open { grid-template-columns: 1fr; gap: 3px; }
    .skills-what, .skills-where { white-space: normal; }
  }
  /* the chat, taken off the page: one window over whatever you walk to */
  .chat-window { position: fixed; z-index: 60; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line, #2a2d33); border-radius: 12px; background: var(--bg);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .chat-window-bar { display: flex; align-items: center; gap: 8px; padding: 7px 9px; cursor: grab;
    border-bottom: 1px solid var(--line, #1d2026); background: var(--bg-2, #14161a); user-select: none; }
  .chat-window-bar:active { cursor: grabbing; }
  .chat-window-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .chat-window-name { flex: 1; font-size: 11.5px; font-weight: 500; color: var(--text-3); }
  .chat-window-x { padding: 2px 5px; border: 0; border-radius: 6px; background: none; color: var(--text-3); }
  .chat-window-x:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
  .chat-window-x .ico { width: 12px; height: 12px; }
  .chat-window .thread { min-height: 0; }
  .chat-window-grip { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize; }
  .chat-window-grip::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px;
    border-right: 2px solid var(--text-4, #3a3d44); border-bottom: 2px solid var(--text-4, #3a3d44); }
  /* where the chat was, while it is in its window */
  .thread-gone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--text-3); font-size: 12.5px; }
  .thread-gone-back { padding: 6px 11px; border: 1px solid var(--line, #2a2d33); border-radius: 7px;
    background: var(--bg-2, #14161a); color: var(--text-2); font: inherit; font-size: 12px; }
  .thread-gone-back:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
  .thread-gone-more { max-width: 320px; margin: 4px 0 0; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--raised); color: var(--text-3);
    font-size: 11.5px; line-height: 1.5; text-align: center; }
  .thread-gone-more a { color: var(--accent-text); }
  /* THE ACTIVE PLAN, under the status bar and on every page: the same slim height as the bar above it */
  .planbar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 14px;
    border-bottom: 1px solid var(--line, #1d2026); background: var(--bg-2, #101216);
    color: var(--text-2); font-size: 11.5px; text-decoration: none; }
  .planbar:hover { background: rgba(255, 255, 255, .03); color: var(--text); }
  .planbar-n { flex: none; font-weight: 500; color: var(--accent-text); }
  .planbar-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .planbar-phase { flex: none; margin-left: auto; color: var(--text-3); font-size: 11px; }
  .planbar-track { flex: none; width: 96px; height: 4px; border-radius: 3px; overflow: hidden;
    background: var(--line, #22252b); }
  .planbar-track > span { display: block; height: 100%; border-radius: 3px; background: var(--accent);
    transition: width .3s ease; }
  /* A NARROW BAR KEEPS THE WORK AND DROPS THE COMMAND. In the extension's window the bar is 420px
     wide: the command runs the sentence off the end, and what the agent is working on is the half
     worth keeping. */
  @media (max-width: 620px) {
    .statusbar-text .statusbar-running { display: none; }
    /* and the work itself gives way rather than running off the end */
    .statusbar-text .statusbar-roll { flex: 0 1 auto; }
    .statusbar-text .statusbar-line { flex: 0 1 auto; max-width: 100%; }
    .planbar-phase { display: none; }
  }
  /* the extension's window is the chat and nothing else: no room for the command either */
  .app.chat-only .statusbar-text .statusbar-running { display: none; }
  .app.chat-only .statusbar-text .statusbar-roll { flex: 0 1 auto; }
  .app.chat-only .statusbar-text .statusbar-line { flex: 0 1 auto; max-width: 100%; }
  /* the bar's own menu: what you want of THIS conversation — its words and its files */
  .bar-menu { position: relative; flex: none; }
  .bar-dots { padding: 2px 6px; border: 1px solid transparent; border-radius: 6px; background: none;
    color: var(--text-3); font-size: 14px; line-height: 1; }
  .bar-dots:hover, .bar-dots[aria-expanded="true"] { border-color: var(--line, #2a2d33); color: var(--text); background: rgba(255,255,255,.04); }
  .bar-drop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; width: 330px;
    max-height: 60vh; overflow-y: auto; padding: 5px; }
  .bar-item, .bar-hit, .bar-file { display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 8px; border: 0; border-radius: 7px; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; text-align: left; text-decoration: none; cursor: pointer; }
  .bar-item:hover, .bar-hit:hover, .bar-file:hover { background: rgba(255,255,255,.05); }
  .bar-item .ico, .bar-file .ico { flex: none; width: 13px; height: 13px; color: var(--text-3); }
  .bar-n { margin-left: auto; color: var(--text-3); font-size: 11px; }
  .bar-find { width: 100%; margin-bottom: 4px; padding: 7px 8px; border: 1px solid var(--line, #2a2d33);
    border-radius: 7px; background: var(--bg); color: var(--text); font: inherit; font-size: 12.5px; }
  .bar-find:focus { outline: none; border-color: var(--accent); }
  .bar-none { margin: 6px 8px; color: var(--text-3); font-size: 11.5px; }
  .bar-hit { flex-direction: column; align-items: flex-start; gap: 2px; }
  .bar-hit-who { color: var(--text-3); font-size: 10.5px; }
  .bar-hit-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; color: var(--text-2); }
  .bar-file-shot { flex: none; width: 26px; height: 26px; border-radius: 5px; object-fit: cover; }
  .bar-file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-file-from { margin-left: auto; flex: none; color: var(--text-3); font-size: 10.5px; }
  /* the skills this session has open, under the count that says how many */
  .agent-fact-open { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0;
    background: none; color: inherit; font: inherit; cursor: pointer; }
  .agent-fact-open:hover { color: var(--text); }
  .skills-drop { width: 260px; }
  /* what the menu can DO, under what it says: one rule, then the actions */
  .bar-foot { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; padding-top: 5px;
    border-top: 1px solid var(--border); }
  .bar-act { padding: 6px 8px; border: 0; border-radius: 7px; background: none; color: var(--accent-text);
    font: inherit; font-size: 12px; text-align: left; text-decoration: none; cursor: pointer; }
  .bar-act:hover:not(:disabled) { background: rgba(255, 255, 255, .05); }
  .bar-act:disabled { color: var(--text-3); cursor: default; }
  /* THE HOVER BOX IS NOT PART OF THE SPACING. Its padding and border made every counter sit eight
     pixels further from its neighbours than the facts do from each other; the negative margin gives
     that back, so what lines up is the text and the box merely grows around it. */
  .agent-skills { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 2px 4px;
    margin: 0 -5px; border: 1px solid transparent; border-radius: 6px; background: none;
    color: var(--text-3); font: inherit; font-size: 11.5px; cursor: pointer; }
  .agent-skills:hover, .agent-skills[aria-expanded="true"] { border-color: var(--border-2);
    background: var(--raised); color: var(--text); }
  .agent-skills .ico { width: 12px; height: 12px; }
  /* none open is the state worth noticing, so it is the one that is tinted */
  .agent-skills.none { color: var(--text-4, #6b6e76); }
  .agent-skills.none .ico { color: #c9955e; }
  /* the thread: what was said, read downwards, with the writing box under it */
  /* THE WRITING BOX IS FIRST IN THE DOCUMENT AND LAST ON THE PAGE. Each turn carries two or three
     buttons, so a box written after them sat behind dozens of tab stops; ordering it here costs
     nothing visually and puts it one Tab from the page. */
  .thread { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
    transition: opacity .16s ease; }
  /* while a strip is open above it, the conversation steps back so the strip is what you are reading */
  .thread.stepped { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { .thread { transition: none; } }
  .thread-scroll { order: 1; }
  .thread-write { order: 2; position: relative; }
  /* THE REPLY CHIP OVERHANGS ITS TURN ON PURPOSE, and on a turn of the user's own — flush to the
     right edge — that overhang left the column and made the thread four pixels scrollable
     sideways. The gutter is the chip's room, so it can sit over the bubble without leaving. */
  .thread-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
    display: flex; flex-direction: column; gap: 7px; padding: 14px 8px 12px; }
  .thread-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .thread-more { align-self: center; padding: 2px 8px; border: 0; border-radius: 6px; background: none;
    color: var(--text-3); font: inherit; font-size: 11px; }
  .thread-turn { display: flex; flex-direction: column; gap: 3px; max-width: 78%; }
  .thread-turn.mine { align-self: flex-end; align-items: flex-end; }
  .thread-bubble { padding: 9px 12px; border: 1px solid #232529; border-radius: 9px;
    background: #161719; overflow-wrap: anywhere; }
  .thread-bubble > div > :first-child { margin-top: 0; }
  .thread-bubble > div > :last-child { margin-bottom: 0; }
  .thread-turn.mine .thread-bubble { border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .thread-meta { display: flex; align-items: baseline; gap: 6px; padding: 0 3px; font-size: 11px; color: var(--text-3); }
  /* delivered, read, filed — the third has no equivalent in a chat app and is the one worth having:
     it means the message became something, and the title says what */
  /* a reference you go looking for, not something read at a glance: quieter than the time beside it */
  .thread-ref { font-size: 11px; opacity: .62; }
  .thread-ticks { display: inline-flex; margin-left: 1px; opacity: .45; }
  .thread-ticks svg { width: 16px; height: 10px; }
  .thread-ticks.read { opacity: .8; }
  .thread-ticks.filed { opacity: 1; color: var(--accent-text); }
  /* what the message BECAME, and whether that row is moving. A pointer, never a report: what is being
     done is the Activity column's, and this says only which row to look at. */
  /* TWO ENDS OF ONE LINE. "Working on" says what is happening to this message; the pills say what
     it became. Different kinds of thing, so they sit at opposite ends rather than running together
     from the same one. The pills hold the right edge and the word pushes itself off the left; the
     dot travels with the word, since both appear only while the row is being worked. */
  /* the pills read as part of the message now that no rule divides them from it, so they start where
     the words do rather than hanging off the far edge */
  .thread-bubble.md > .thread-became { justify-content: flex-start; }
  /* the rule crosses the whole bubble, so it reads as a header and not as an underlined phrase: the
     row is what holds the text, the block around it is what holds the rule */
  /* .md p carries a margin and one more class than .thread-became, so it won and the header sat
     inside the bubble's padding with the rule stopping 13px short of each edge */
  /* IT IS A HEADER, NOT A ROW OF ITS OWN. The bubble's 9px of top padding sat above it whole,
     so a one-line pill cost three lines of height; the negative top margin eats most of it.
     .md > :first-child ZEROES A TOP MARGIN, comes later in this sheet and matches just as
     hard, so a rule spelled `.thread-bubble .thread-became` had its margin quietly dropped —
     which is what made this header too tall twice. The bubble's own class outranks it. */
  /* NO RULE UNDER IT: the header and the message are one thing, and a line between them says they
     are two. The space below is what separates them. */
  /* even above and below: the -5px top was there to sit the header under a rule that is gone, which
     left it tight at the top and loose underneath */
  .thread-bubble.md > .thread-became { margin: -2px -12px 5px; padding: 0 12px 1px;
    font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
  .thread-became.live { color: var(--accent-text); }
  .thread-became-word { flex: none; }
  /* what it became is a NAME, and the one thing you want to do with a name is follow it */
  /* THE JOURNAL'S OWN RECEIPT, not the agent speaking: what the message became, said by the record
     that knows it. Quieter than a turn and without a bubble, so a run of them reads as marginalia. */
  .thread-turn.receipt { max-width: 100%; }
  .thread-turn.receipt .thread-bubble { padding: 0 2px; border: 0; background: none; font-size: 12px;
    color: var(--text-3); }
  /* the meta line is what gives every other turn its space below, and a receipt hides it — so a
     run of them sat on each other and on the message under them. The gap comes back as padding. */
  .thread-turn.receipt .thread-meta { display: none; }
  .thread-turn.receipt .thread-bubble { padding-bottom: 8px; }
  /* a row named in ordinary prose: the same thing as a became-pill, at the size of the words

  /* detail panel */
  /* the inspector lies over the whole app, sidebar and activity column included, so nothing under it is squeezed */
  /* A PICTURE OVER THE PAGE, with the page blurred behind it rather than merely dimmed: what is
     underneath stops competing for the eye without going away, so the reader keeps their place. */
  .lightbox { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 56px 64px; background: rgba(4, 5, 6, .72); backdrop-filter: blur(14px);
    animation: fade-in .16s ease-out both; }

    box-shadow: 0 24px 64px rgba(0, 0, 0, .55); }

    height: 44px; padding: 0 12px 0 18px; font-size: 12px; color: var(--text-2); }
  .lightbox-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lightbox-of { flex: none; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .lightbox-raw { flex: none; color: var(--text-3); text-decoration: none; }
  .lightbox-raw:hover { color: var(--text); }
  .lightbox-x { flex: none; display: inline-flex; padding: 5px; border: 0; border-radius: 6px;
    background: none; color: var(--text-3); }
  .lightbox-x:hover { background: var(--hover); color: var(--text); }
  /* the arrows point the way they move, which is why the up/down glyphs are turned rather than replaced */
  .lightbox-step { flex: none; display: inline-flex; padding: 9px; border: 1px solid var(--border-2);
    border-radius: 99px; background: var(--raised); color: var(--text-2); }
  .lightbox-step:hover { border-color: var(--accent); color: var(--text); }
  .lightbox-step.back .ico { transform: rotate(-90deg); }
  .lightbox-step.on .ico { transform: rotate(-90deg); }
  @media (prefers-reduced-motion: reduce) { .lightbox { animation: none; } }

  .panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; max-width: 100vw; min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border-2); background: var(--bg); box-shadow: -40px 0 90px rgba(0, 0, 0, .6); }

  .panel-scrim { animation: fade-in .18s ease-out both; }

  .quick-scrim { animation: fade-in .15s ease-out both; }
  .quick-menu { animation: quick-in .17s cubic-bezier(.22, .7, .2, 1) both; }
  .quick-toast { animation: toast-in .2s cubic-bezier(.22, .7, .2, 1) both; }
  @keyframes panel-in { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes panel-out { from { transform: none; opacity: 1; } to { transform: translateX(22px); opacity: 0; } }
  /* work that stopped on purpose: the dot is hollow, because nothing is running */

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
